<script>
geotab.addin.tempo = function () {
  'use strict';
  var B = window.Bonneville;
  var VERSION = '1.2.9';
  var api = null, G = null, moi = '', acces = false, pret = false;
  var users = [], employes = {}, heures = [], depenses = [];
  var periode = null, onglet = 'heures', filtreEmp = '', ouverts = {}, message = null;
  // Deux façons de voir : par période de paye (14 jours) ou par dates choisies
  var mode = 'paye', perso = null;
  function courtDate(iso) { var d = B.dateDe(iso); return d.getDate() + ' ' + B.MOIS[d.getMonth()]; }
  function plage() {
    if (mode === 'paye') {
      return { paye: true, debut: periode.debut, fin: periode.fin, semaines: [{ nom: 'Semaine 1', court: 'Semaine 1', debut: periode.s1.debut, fin: periode.s1.fin }, { nom: 'Semaine 2', court: 'Semaine 2', debut: periode.s2.debut, fin: periode.s2.fin }] };
    }
    // Personnalisée : découpée en semaines de paye (jeudi au mercredi)
    var p0 = B.periodeDe(perso.debut), j = perso.debut >= p0.s2.debut ? p0.s2.debut : p0.s1.debut, sem = [];
    while (j <= perso.fin && sem.length < 60) {
      var a = j < perso.debut ? perso.debut : j, f = B.ajouterJours(j, 6); if (f > perso.fin) { f = perso.fin; }
      sem.push({ nom: 'Semaine du ' + courtDate(a) + ' au ' + courtDate(f), court: 'Sem. du ' + courtDate(a), debut: a, fin: f });
      j = B.ajouterJours(j, 7);
    }
    return { paye: false, debut: perso.debut, fin: perso.fin, semaines: sem };
  }
  function semaineNom(P, iso) { var s = P.semaines.filter(function (x) { return iso >= x.debut && iso <= x.fin; })[0]; return s ? s.court : ''; }
  function nbJours(P) { return Math.round((B.dateDe(P.fin) - B.dateDe(P.debut)) / 86400000) + 1; }

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nomUser(u) { if (typeof fiches !== 'undefined' && fiches[u]) { return fiches[u]; } var x = users.filter(function (y) { return y.user === u; })[0]; return x ? x.nom : (u || ''); }
  function dire(t, e) { message = { t: t, e: !!e }; rendre(); }
  function dansPeriode(l) { var P = plage(); return l.filter(function (x) { return x.d.date >= P.debut && x.d.date <= P.fin && (!filtreEmp || x.d.user === filtreEmp); }); }
  // ---------- Chaque employé a sa période selon son cycle (aux 2 semaines ou hebdomadaire)
  function decalage() { return periode.n - B.periodeDe(B.jourIso()).n; }
  function cycleU(u) { return B.cycleDe(employes[u] ? employes[u].d : null); }
  function periodeU(u) { return cycleU(u) === 'hebdo' ? B.periodeCycleVoisine(B.periodeHebdo(B.jourIso()), decalage()) : periode; }
  function plageDe(u) { return B.plageCycle(periodeU(u)); }
  function droitsU(u) { return (employes[u] && employes[u].d.droits) || {}; }
  // Données supplémentaires : journées (modules, convoi), soumissions, notes, paramètres
  var jours = [], soumissions = [], notes = [], paramRec = null, fiches = {};
  function jourDe(u, j) { var x = jours.filter(function (y) { return y.d.user === u && y.d.date === j; })[0]; return x || null; }
  function soumissionDe(u, P) { return soumissions.filter(function (y) { return y.d.user === u && y.d.debut === P.debut; })[0] || null; }
  function estSoumise(u, P) { var x = soumissionDe(u, P); return !!(x && x.d.statut === 'soumise'); }
  function quand(iso) { var d = new Date(iso); return d.getDate() + ' ' + B.MOIS[d.getMonth()] + ' à ' + d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); }
  function minutes(l) { return l.reduce(function (s, x) { return s + B.minutesEntree(x.d); }, 0); }
  function argentTotal(l) { return l.reduce(function (s, x) { return s + (Number(x.d.montant) || 0); }, 0); }
  function trier(l) { return l.sort(function (a, b) { return (a.d.date + (a.d.debut || '')).localeCompare(b.d.date + (b.d.debut || '')); }); }
  function montantDe(t) { var n = parseFloat(String(t || '').replace(/\s|\$/g, '').replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; }

  // ---------- Chargement
  // ---------- Actualisation automatique : relecture dans Geotab toutes les 2 minutes
  var AUTO_MS = 2 * 60 * 1000, majHeure = '', majErreur = false, minuterieAuto = null;
  function heureMaintenant() { var d = new Date(); return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); }
  function texteMaj() { return majErreur ? 'Mise à jour impossible, nouvel essai dans 2 min' : (majHeure ? 'Mis à jour à ' + majHeure : ''); }
  function demarrerAuto() {
    clearInterval(minuterieAuto);
    minuterieAuto = setInterval(function () {
      // Pas pendant une saisie dans une fenêtre d'ajout ou de correction, ni quand la page est cachée
      if (!acces || document.hidden || $('hb-panneau')) { return; }
      charger(true);
    }, AUTO_MS);
  }
  // ---------- Heures automatiques (HOS) : lues dans Geotab pour la période affichée, jamais enregistrées
  var ajusts = [], hosPlage = '';
  // Les HOS servent de vérification. Une journée sans saisie prend les heures HOS.
  var hosTout = [];
  function recomposer() {
    var saisies = heures.filter(function (x) { return !x.d.hos; }), cle = {};
    saisies.forEach(function (x) { cle[x.d.user + '|' + x.d.date] = true; });
    heures = trier(saisies.concat(hosTout.filter(function (x) { return !cle[x.d.user + '|' + x.d.date]; })));
  }
  function hosDu(u, j) { return hosTout.filter(function (x) { return x.d.user === u && x.d.date === j; })[0] || null; }
  function ecartDu(u, j) {
    var hx = hosDu(u, j); if (!hx) { return null; }
    var saisies = heures.filter(function (x) { return x.d.user === u && x.d.date === j && !x.d.hos; });
    if (!saisies.length) { return null; }
    return B.ecartHos(saisies, hx.d.hosBrut);
  }

  var minuteur = null;
  window.addEventListener('resize', function () { clearTimeout(minuteur); minuteur = setTimeout(remplirZone, 120); });
  // ---------- Menu du clic droit sur une carte
  function fermerMenu() { var m = $('hb-menu'); if (m) { m.parentNode.removeChild(m); } }
  function ouvrirMenu(u, x, y) {
    fermerMenu();
    var m = document.createElement('div'); m.id = 'hb-menu'; m.className = 'menu-carte'; m.setAttribute('role', 'menu');
    var items = [['heure', 'Ajouter des heures']];
    if (droitsU(u).depenses) { items.push(['depense', 'Ajouter une dépense']); }
    items.push(['note', 'Ajouter une note']);
    if (estSoumise(u, plageDe(u))) { items.push(['sep'], ['relacher', 'Relâcher la feuille pour modification']); }
    items.push(['sep'], ['masquer', voirMasquees ? 'Réafficher la carte' : 'Masquer la carte']);
    m.innerHTML = '<div class="mtitre">' + h(nomUser(u)) + '</div>' + items.map(function (it) { return it[0] === 'sep' ? '<div class="msep"></div>' : '<button type="button" role="menuitem" data-m="' + it[0] + '">' + it[1] + '</button>'; }).join('');
    $('hb').appendChild(m);
    var w = m.offsetWidth, hgt = m.offsetHeight;
    m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px'; m.style.top = Math.min(y, window.innerHeight - hgt - 8) + 'px';
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]'); if (!b) { return; }
      var a = b.getAttribute('data-m'); fermerMenu();
      if (a === 'heure') { panneauHeure(null, u); }
      else if (a === 'depense') { panneauDepense(null, u); }
      else if (a === 'note') { panneauNote(u); }
      else if (a === 'masquer') { basculerCarte(u); }
      else if (a === 'relacher') { rouvrir(u); }
    });
    var premier = m.querySelector('button'); if (premier) { premier.focus(); }
  }
  document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('#hb-menu')) { fermerMenu(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { fermerMenu(); } });
  window.addEventListener('scroll', fermerMenu, true);
  function brancher() {
    var zoneC = $('hb-contenu');
    var appui = null, appuiFait = false;
    zoneC.addEventListener('touchstart', function (e) {
      var k = e.target.closest && e.target.closest('.carte[data-carte]'); if (!k || e.touches.length !== 1) { return; }
      var t = e.touches[0]; appuiFait = false;
      appui = setTimeout(function () { appuiFait = true; ouvrirMenu(k.getAttribute('data-carte'), t.clientX, t.clientY); }, 600);
    }, { passive: true });
    ['touchmove', 'touchend', 'touchcancel'].forEach(function (ev) { zoneC.addEventListener(ev, function () { clearTimeout(appui); }, { passive: true }); });
    zoneC.addEventListener('click', function (e) { if (appuiFait) { appuiFait = false; e.stopPropagation(); e.preventDefault(); } }, true);
    zoneC.addEventListener('contextmenu', function (e) {
      var k = e.target.closest && e.target.closest('.carte[data-carte]'); if (!k) { return; }
      e.preventDefault(); ouvrirMenu(k.getAttribute('data-carte'), e.clientX, e.clientY);
    });
    zoneC.addEventListener('dragstart', function (e) {
      var k = e.target.closest && e.target.closest('.carte[data-carte]'); if (!k) { return; }
      glisse = k.getAttribute('data-carte'); k.classList.add('glisse');
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', glisse); } catch (x) {}
    });
    zoneC.addEventListener('dragover', function (e) {
      var k = e.target.closest && e.target.closest('.carte[data-carte]'); if (!k || !glisse) { return; }
      e.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll('#hb .carte.cible'), function (c) { if (c !== k) { c.classList.remove('cible', 'apres'); } });
      if (k.getAttribute('data-carte') === glisse || cycleU(k.getAttribute('data-carte')) !== cycleU(glisse)) { return; }
      var r = k.getBoundingClientRect(), apres = e.clientX > r.left + r.width / 2;
      k.classList.add('cible'); k.classList.toggle('apres', apres);
    });
    zoneC.addEventListener('drop', function (e) {
      var k = e.target.closest && e.target.closest('.carte[data-carte]'); if (!k || !glisse) { return; }
      e.preventDefault();
      var cible = k.getAttribute('data-carte'), r = k.getBoundingClientRect(), apres = e.clientX > r.left + r.width / 2;
      if (cible !== glisse && cycleU(cible) === cycleU(glisse)) { deplacerCarte(glisse, cible, apres); }
    });
    zoneC.addEventListener('dragend', function () {
      glisse = null;
      Array.prototype.forEach.call(document.querySelectorAll('#hb .carte.glisse, #hb .carte.cible'), function (c) { c.classList.remove('glisse', 'cible', 'apres'); });
    });
    $('hb-contenu').addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.carte[data-carte]')) { e.preventDefault(); ouvrirTiroir(e.target.getAttribute('data-carte')); }
    });
    $('hb-contenu').addEventListener('click', function (e) {
      var o = e.target.closest('[data-o]'); if (o) { onglet = o.getAttribute('data-o'); pages[onglet] = 0; message = null; rendre(); return; }
      var mq = e.target.closest('[data-masquer]'); if (mq) { basculerCarte(mq.getAttribute('data-masquer')); return; }
      var k = e.target.closest('[data-carte]'); if (k) { ouvrirTiroir(k.getAttribute('data-carte')); return; }
      var b = e.target.closest('[data-a]'); if (!b) { return; }
      var a = b.getAttribute('data-a'), id = b.getAttribute('data-id');
      if (a === 'page') { pages[onglet] = Math.max(0, Math.min(nbPages - 1, pages[onglet] + Number(b.getAttribute('data-v')))); remplirZone(); return; }
      if (false) { mode = b.getAttribute('data-v'); if (mode === 'perso' && !perso) { perso = { debut: periode.debut, fin: periode.fin }; } pages = { heures: 0, depenses: 0 }; message = null; rendre(); return; }
      if (a === 'note') { panneauNote(); return; }
      if (a === 'ordreAlpha') { if (confirm('Remettre les cartes en ordre alphabétique ?')) { ordre = []; sauverOrdre(); rendre(); } return; }
      if (a === 'masquees') { voirMasquees = !voirMasquees; pages = { heures: 0, depenses: 0 }; rendre(); return; }
      if (a === 'periode') { periode = B.periodeVoisine(periode, Number(b.getAttribute('data-v'))); pages = { heures: 0, depenses: 0 }; message = null; rendre(); chargerHos(); }
      else if (a === 'aujourdhui') { periode = B.periodeDe(B.jourIso()); pages = { heures: 0, depenses: 0 }; message = null; rendre(); chargerHos(); }
      else if (a === 'excel') { exporter(); }
      else if (a === 'ajouterHeure') { panneauHeure(null); }
      else if (a === 'ajouterDepense') { panneauDepense(null); }
      else if (a === 'modifierHeure') { panneauHeure(trouver(heures, id)); }
      else if (a === 'modifierDepense') { panneauDepense(trouver(depenses, id)); }
      else if (a === 'recu') { voirRecu(trouver(depenses, id)); }
    });
  }

  window.BonnevilleModule = { aller: function () { onglet = 'heures'; periode = periode || B.periodeDe(B.jourIso()); rendre(); } };
  var branche = false;
  return {
    initialize: function (a, s, callback) {
      api = a; B = window.Bonneville; G = B.creerApi(api); periode = B.periodeDe(B.jourIso());
      if (!branche) { brancher(); branche = true; }
      $('hb-version').textContent = 'version ' + VERSION;
      G.session().then(function (s2) {
        moi = s2.userName || '';
        return Promise.all([G.lireChamp('employe', 'user', moi).catch(function () { return []; }), G.estAdministrateur(moi).catch(function () { return false; })]);
      }).then(function (r) {
        var e = r[0][0]; acces = !!(e && e.details.droits && e.details.droits.admin);
        if (acces) { demarrerAuto(); return charger(); }
        pret = true; rendre();
      });
      callback();
    },
    focus: function () { if (pret && acces) { charger(); demarrerAuto(); } },
    blur: function () { clearInterval(minuterieAuto); }
  };
};
</script>
</body>
</html>
