<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bonneville - Heures &amp; Dépenses</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://ericgloutnez.github.io/LFS/heures/heures-commun.js?v=1.1.2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body style="margin:0">
<div id="hb">
<style>
  #hb { --encre: #14191e; --doux: #4f5963; --ligne: #d3d8dd; --fond: #eef0f2; --surface: #ffffff; --bande: #e3e6e9; --accent: #f2a900; --ok: #1b7f3b; --non: #b42318; --bleu: #1f4f8a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--encre); background: var(--fond); height: 100vh; font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #hb * { box-sizing: border-box; }
  #hb .entete { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--ligne); }
  #hb .entete img { height: 18px; } #hb .entete .sep { width: 1px; height: 26px; background: var(--ligne); } #hb .entete .titre { font-weight: 700; font-size: 16px; }
  #hb .version { margin-left: auto; font-size: 12px; color: var(--doux); }
  #hb main { flex: 1; min-height: 0; padding: 14px 24px 8px; display: flex; flex-direction: column; gap: 10px; }
  #hb .zone { flex: 1; min-height: 0; overflow: hidden; }
  #hb .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #hb .maj { font-size: 12px; color: var(--doux); }
  #hb .mode { display: inline-flex; background: var(--bande); border-radius: 10px; padding: 3px; gap: 3px; }
  #hb .mode button { border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: var(--doux); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  #hb .mode button[aria-pressed="true"] { background: var(--surface); color: var(--encre); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #hb .per.perso { padding: 4px 12px; gap: 10px; font-weight: 700; }
  #hb .per.perso label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  #hb .per.perso input { height: 34px; }
  #hb .per.perso small { font-size: 12px; color: var(--doux); font-weight: 600; }
  #hb .pied { text-align: center; font-size: 12px; font-weight: 600; color: var(--doux); }
  #hb .pager { margin-right: 10px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--doux); }
  #hb .onglets .indice { align-self: center; margin-left: 14px; font-size: 12px; color: var(--doux); }
  #hb .outils { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  #hb .outils select { min-width: 200px; }
  #hb .per { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 10px; padding: 4px; }
  #hb .per b { min-width: 230px; text-align: center; font-size: 14px; }
  #hb .per small { display: block; font-weight: 600; color: var(--doux); font-size: 12px; }
  #hb .btn { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--surface); color: var(--encre); font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #hb .btn.discret { border-color: transparent; background: transparent; color: var(--doux); font-weight: 600; padding: 0 10px; }
  #hb .btn.discret:hover { color: var(--encre); background: var(--surface); border-color: var(--ligne); }
  #hb .btn.petit { height: 30px; padding: 0 10px; font-size: 13px; }
  #hb .btn.jaune { background: var(--accent); border-color: var(--accent); }
  #hb .btn.vert { color: var(--ok); border-color: var(--ok); }
  #hb .btn.rouge { color: var(--non); border-color: var(--non); }
  #hb .btn:disabled { opacity: .4; cursor: default; }
  #hb .per .btn { border: 0; font-size: 18px; width: 38px; justify-content: center; padding: 0; }
  #hb label.champ { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--doux); }
  #hb select, #hb input, #hb textarea { font: inherit; font-size: 14px; height: 38px; padding: 0 10px; border: 1px solid var(--ligne); border-radius: 8px; background: var(--surface); color: var(--encre); }
  #hb textarea { height: 80px; padding: 8px 10px; resize: vertical; }
  #hb .droite { margin-left: auto; display: flex; gap: 8px; }
  #hb .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  #hb .chiffres div { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; gap: 0; }
  #hb .chiffres b { font-size: 19px; } #hb .chiffres span { font-size: 12px; font-weight: 700; color: var(--doux); }
  #hb .onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--ligne); }
  #hb .onglets button { height: 38px; padding: 0 16px; border: 0; background: none; border-bottom: 3px solid transparent; font: inherit; font-size: 14px; font-weight: 700; color: var(--doux); cursor: pointer; }
  #hb .onglets button.on { color: var(--encre); border-bottom-color: #9E1F27; }
  #hb .tableau { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; overflow-x: auto; }
  #hb table { width: 100%; border-collapse: collapse; }
  #hb th { text-align: left; font-size: 12px; color: var(--doux); font-weight: 700; padding: 10px 12px; background: var(--bande); white-space: nowrap; }
  #hb td { padding: 10px 12px; border-top: 1px solid var(--ligne); vertical-align: top; }
  #hb td.n, #hb th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #hb tr.emp { cursor: pointer; } #hb tr.emp:hover td { background: #f7f8f9; }
  #hb tr.emp td:first-child::before { content: '▸ '; color: var(--doux); } #hb tr.emp.ouvert td:first-child::before { content: '▾ '; }
  #hb tr.detail > td { background: #fafbfc; padding: 0 0 0 24px; }
  #hb tr.detail table td { padding: 8px 12px; background: #fafbfc; }
  #hb tr.detail table th { background: transparent; } #hb tr.detail table td { border-top: 1px solid #e8ebee; }
  #hb tr.total td { font-weight: 800; background: var(--bande); }
  #hb .sem { font-size: 12px; font-weight: 700; color: var(--doux); }
  #hb .desc { max-width: 520px; overflow-wrap: anywhere; }
  #hb table.lignes td { height: 46px; padding-top: 0; padding-bottom: 0; vertical-align: middle; } #hb table.lignes th { height: 40px; }
  #hb .coupe { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
  #hb .carte .dep { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--doux); }
  #hb .aide { font-size: 13px; color: var(--doux); }
  #hb .message { border-radius: 10px; padding: 10px 14px; font-weight: 600; background: #e7f4ec; color: #14532d; }
  #hb .message.erreur { background: #fde8e7; color: #7a1a12; }
  #hb .cartes { display: grid; gap: 12px; grid-auto-rows: 150px; height: 100%; align-content: start; }
  #hb .carte { text-align: left; font: inherit; color: var(--encre); background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; padding: 11px 14px; overflow: hidden; }
  #hb .carte:hover { border-color: var(--accent); }
  #hb .carte small, #hb .tiroir small { color: var(--doux); font-size: 12px; display: block; }
  #hb .tete, #hb .ttete { display: flex; align-items: center; gap: 12px; }
  #hb .rond { width: 34px; height: 34px; border-radius: 50%; background: var(--bleu); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex: 0 0 auto; }
  #hb .rond.gros { width: 52px; height: 52px; font-size: 18px; }
  #hb .trois { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #hb .trois > span { box-shadow: inset 3px 0 0 var(--accent); padding-left: 8px; } #hb .trois b { font-size: 16px; display: block; }
  #hb .barre-rempli { height: 8px; background: var(--bande); border-radius: 4px; overflow: hidden; } #hb .barre-rempli span { display: block; height: 100%; }
  #hb .dep { font-size: 13px; font-weight: 600; }
  #hb .fond-tiroir { position: fixed; inset: 0; background: rgba(20,25,30,.4); display: flex; justify-content: flex-end; z-index: 40; }
  #hb .tiroir { width: min(640px, 100%); height: 100%; overflow: auto; background: var(--fond); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  #hb .ttete b { font-size: 18px; }
  #hb .kpis { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px; }
  #hb .rangee-btn { display: flex; gap: 8px; flex-wrap: wrap; }
  #hb .tiroir h4 { margin: 10px 0 0; font-size: 13px; color: var(--doux); text-transform: uppercase; letter-spacing: .4px; }
  #hb .jour { display: grid; grid-template-columns: 100px 1fr 64px; gap: 10px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 10px; align-items: start; }
  #hb .jn { font-weight: 700; } #hb .jt { text-align: right; font-weight: 800; white-space: nowrap; }
  #hb .ent { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; } #hb .ent + .ent { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ligne); }
  #hb .manque { color: var(--non); font-weight: 600; }
  #hb .recus { display: flex; flex-direction: column; gap: 8px; }
  #hb .recu { display: flex; gap: 10px; align-items: center; border: 1px solid var(--ligne); border-radius: 10px; padding: 8px; background: var(--surface); } #hb .recu .rt { flex: 1; }
  #hb .vignette { width: 52px; height: 70px; border: 1px solid var(--ligne); border-radius: 6px; background: var(--bande); padding: 0; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  #hb .vignette img { width: 100%; height: 100%; object-fit: cover; }
  #hb .fond-panneau { position: fixed; inset: 0; background: rgba(20,25,30,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  #hb .panneau { background: var(--surface); border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  #hb .panneau h3 { margin: 0; font-size: 18px; }
  #hb .panneau .rangee { display: flex; gap: 10px; } #hb .panneau .rangee > * { flex: 1; }
  #hb .panneau img { max-width: 100%; border-radius: 10px; background: var(--bande); }
  #hb .vide { padding: 24px; text-align: center; color: var(--doux); }
  #hb button:focus-visible, #hb select:focus-visible, #hb input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
<div class="entete"><img alt="Bonneville" src="https://ericgloutnez.github.io/LFS/logo-bonneville.png"><span class="sep"></span><span class="titre">Heures &amp; Dépenses</span><span class="version" id="hb-version"></span></div>
<main id="hb-contenu"><div class="aide">Chargement…</div></main>
</div>

<script>
geotab.addin.tempo = function () {
  'use strict';
  var B = window.Bonneville;
  var VERSION = '1.1.2';
  var api = null, G = null, moi = '', acces = false, pret = false;
  var users = [], employes = {}, heures = [], depenses = [];
  var periode = null, onglet = 'heures', filtreEmp = '', ouverts = {}, message = null;
  // Deux façons de voir : par période de paye (14 jours) ou par dates choisies
  var mode = 'paye', perso = null;
  function courtDate(iso) { var d = B.dateDe(iso); return d.getDate() + ' ' + B.MOIS[d.getMonth()]; }
  function plage() {
    if (mode === 'paye') {
      return { paye: true, debut: periode.debut, fin: periode.fin, semaines: [{ nom: 'Semaine 1', court: 'Semaine 1', debut: periode.s1.debut, fin: periode.s1.fin }, { nom: 'Semaine 2', court: 'Semaine 2', debut: periode.s2.debut, fin: periode.s2.fin }] };
    }
    // Personnalisée : découpée en semaines de paye (jeudi au mercredi)
    var p0 = B.periodeDe(perso.debut), j = perso.debut >= p0.s2.debut ? p0.s2.debut : p0.s1.debut, sem = [];
    while (j <= perso.fin && sem.length < 60) {
      var a = j < perso.debut ? perso.debut : j, f = B.ajouterJours(j, 6); if (f > perso.fin) { f = perso.fin; }
      sem.push({ nom: 'Semaine du ' + courtDate(a) + ' au ' + courtDate(f), court: 'Sem. du ' + courtDate(a), debut: a, fin: f });
      j = B.ajouterJours(j, 7);
    }
    return { paye: false, debut: perso.debut, fin: perso.fin, semaines: sem };
  }
  function semaineNom(P, iso) { var s = P.semaines.filter(function (x) { return iso >= x.debut && iso <= x.fin; })[0]; return s ? s.court : ''; }
  function nbJours(P) { return Math.round((B.dateDe(P.fin) - B.dateDe(P.debut)) / 86400000) + 1; }

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nomUser(u) { var x = users.filter(function (y) { return y.user === u; })[0]; return x ? x.nom : (u || ''); }
  function dire(t, e) { message = { t: t, e: !!e }; rendre(); }
  function dansPeriode(l) { var P = plage(); return l.filter(function (x) { return x.d.date >= P.debut && x.d.date <= P.fin && (!filtreEmp || x.d.user === filtreEmp); }); }
  function minutes(l) { return l.reduce(function (s, x) { return s + B.minutesEntree(x.d); }, 0); }
  function argentTotal(l) { return l.reduce(function (s, x) { return s + (Number(x.d.montant) || 0); }, 0); }
  function trier(l) { return l.sort(function (a, b) { return (a.d.date + (a.d.debut || '')).localeCompare(b.d.date + (b.d.debut || '')); }); }
  function montantDe(t) { var n = parseFloat(String(t || '').replace(/\s|\$/g, '').replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; }

  // ---------- Chargement
  // ---------- Actualisation automatique : relecture dans Geotab toutes les 2 minutes
  var AUTO_MS = 2 * 60 * 1000, majHeure = '', majErreur = false, minuterieAuto = null;
  function heureMaintenant() { var d = new Date(); return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); }
  function texteMaj() { return majErreur ? 'Mise à jour impossible, nouvel essai dans 2 min' : (majHeure ? 'Mis à jour à ' + majHeure : ''); }
  function demarrerAuto() {
    clearInterval(minuterieAuto);
    minuterieAuto = setInterval(function () {
      // Pas pendant une saisie dans une fenêtre d'ajout ou de correction, ni quand la page est cachée
      if (!acces || document.hidden || $('hb-panneau')) { return; }
      charger(true);
    }, AUTO_MS);
  }
  function charger(auto) {
    return Promise.all([
      G.utilisateurs(),
      G.lireType('employe').catch(function () { return []; }),
      G.lireType('heure').catch(function () { return []; }),
      G.lireType('depense').catch(function () { return []; })
    ]).then(function (r) {
      users = r[0]; employes = {};
      r[1].forEach(function (l) { employes[l.details.user] = { id: l.id, d: l.details }; });
      heures = trier(r[2].map(function (l) { return { id: l.id, d: l.details }; }));
      depenses = trier(r[3].map(function (l) { return { id: l.id, d: l.details }; }));
      pret = true; majHeure = heureMaintenant(); majErreur = false; rendre();
    }).catch(function (e) {
      pret = true;
      if (auto) { majErreur = true; var m = $('hb-maj'); if (m) { m.textContent = texteMaj(); } return; }
      dire('Lecture impossible : ' + (e && e.message ? e.message : e), true);
    });
  }

  // ---------- Rendu
  function personnes() {
    var vus = {};
    dansPeriode(heures).concat(dansPeriode(depenses)).forEach(function (x) { vus[x.d.user] = true; });
    return Object.keys(vus).sort(function (a, b) { return nomUser(a).localeCompare(nomUser(b), 'fr'); });
  }
  // ---------- Vue en cartes : une carte par employé (ceux qui ont l'accès Heures et ceux qui ont saisi dans la période)
  function gensCartes() {
    var vus = {};
    users.forEach(function (u) { var e = employes[u.user]; if (u.actif && e && e.d.droits && e.d.droits.heures && !e.d.masque) { vus[u.user] = true; } });
    dansPeriode(heures).concat(dansPeriode(depenses)).forEach(function (x) { vus[x.d.user] = true; });
    return Object.keys(vus).filter(function (u) { return !filtreEmp || u === filtreEmp; }).sort(function (a, b) { return nomUser(a).localeCompare(nomUser(b), 'fr'); });
  }
  function joursPeriode() { var P = plage(), l = [], n = nbJours(P); for (var i = 0; i < n; i++) { l.push(B.ajouterJours(P.debut, i)); } return l; }
  function ouvrables() { var auj = B.jourIso(); return joursPeriode().filter(function (j) { var d = B.dateDe(j).getDay(); return j <= auj && d !== 0 && d !== 6; }); }
  function initiales(u) { return nomUser(u).split(/\s+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0].toUpperCase(); }).join('') || '?'; }
  function chiffresDe(u) {
    var P = plage();
    var l = heures.filter(function (x) { return x.d.user === u && x.d.date >= P.debut && x.d.date <= P.fin; });
    var parSem = P.semaines.map(function (s) { return minutes(l.filter(function (x) { return x.d.date >= s.debut && x.d.date <= s.fin; })); });
    var dl = depenses.filter(function (x) { return x.d.user === u && x.d.date >= P.debut && x.d.date <= P.fin; });
    var ouv = ouvrables(), remplis = ouv.filter(function (j) { return l.some(function (x) { return x.d.date === j; }); }).length;
    var jours = {}; l.forEach(function (x) { jours[x.d.date] = true; });
    var total = minutes(l), nbj = Object.keys(jours).length;
    return { P: P, l: l, parSem: parSem, s1: parSem[0] || 0, s2: parSem[1] || 0, total: total, nbJours: nbj, moyenne: nbj ? Math.round(total / nbj) : 0, dl: dl, dTotal: argentTotal(dl), ouv: ouv.length, remplis: remplis };
  }
  // ---------- Tout tient dans la page : on calcule combien de cartes ou de lignes entrent, et on pagine le reste
  var pages = { heures: 0, depenses: 0 }, nbPages = 1;
  function pager(total, par) {
    nbPages = Math.max(1, Math.ceil(total / par));
    if (pages[onglet] > nbPages - 1) { pages[onglet] = nbPages - 1; }
    var p = $('hb-pager');
    if (p) { p.innerHTML = nbPages > 1 ? '<button type="button" class="btn petit" data-a="page" data-v="-1" aria-label="Page précédente"' + (pages[onglet] ? '' : ' disabled') + '>‹</button>Page ' + (pages[onglet] + 1) + ' / ' + nbPages + '<button type="button" class="btn petit" data-a="page" data-v="1" aria-label="Page suivante"' + (pages[onglet] < nbPages - 1 ? '' : ' disabled') + '>›</button>' : ''; }
    return pages[onglet] * par;
  }
  function remplirZone() {
    var z = $('hb-zone'); if (!z) { return; }
    if (onglet === 'depenses') { remplirDepenses(z); } else { remplirCartes(z); }
  }
  function troisChiffres(c) {
    return c.P.paye
      ? '<span class="trois"><span><b>' + B.duree(c.s1) + '</b><small>Semaine 1</small></span><span><b>' + B.duree(c.s2) + '</b><small>Semaine 2</small></span><span><b>' + B.duree(c.total) + '</b><small>Total</small></span></span>'
      : '<span class="trois"><span><b>' + B.duree(c.total) + '</b><small>Total</small></span><span><b>' + c.nbJours + '</b><small>Jour' + (c.nbJours > 1 ? 's' : '') + ' travaillé' + (c.nbJours > 1 ? 's' : '') + '</small></span><span><b>' + B.duree(c.moyenne) + '</b><small>Moyenne par jour</small></span></span>';
  }
  function remplirCartes(z) {
    var gens = gensCartes();
    if (!gens.length) { pager(0, 1); z.innerHTML = '<div class="tableau"><div class="vide">Aucun employé à afficher pour cette période.</div></div>'; return; }
    var cols = Math.max(1, Math.floor((z.clientWidth + 12) / (280 + 12))), rangs = Math.max(1, Math.floor((z.clientHeight + 12) / (150 + 12))), par = cols * rangs;
    var debut = pager(gens.length, par);
    z.innerHTML = '<div class="cartes" style="grid-template-columns:repeat(' + cols + ', 1fr)">' + gens.slice(debut, debut + par).map(function (u) {
      var c = chiffresDe(u), pct = c.ouv ? Math.round(c.remplis / c.ouv * 100) : 0;
      var coul = !c.ouv ? 'var(--bande)' : (pct >= 80 ? 'var(--ok)' : (pct >= 50 ? 'var(--accent)' : 'var(--non)'));
      return '<button type="button" class="carte" data-carte="' + h(u) + '"><span class="tete"><span class="rond">' + h(initiales(u)) + '</span><span><b>' + h(nomUser(u)) + '</b><small>' + h(u) + '</small></span></span>'
        + troisChiffres(c)
        + '<span class="barre-rempli" title="' + (c.ouv ? c.remplis + ' jour(s) sur ' + c.ouv + ' jours ouvrables à ce jour' : 'Période à venir') + '"><span style="width:' + pct + '%;background:' + coul + '"></span></span>'
        + '<span class="dep"><span>' + (c.ouv ? c.remplis + ' / ' + c.ouv + ' jours' : 'À venir') + '</span><span>' + (c.dl.length ? '🧾 ' + c.dl.length + ' · ' + B.argent(c.dTotal) : 'Aucune dépense') + '</span></span></button>';
    }).join('') + '</div>';
  }
  // ---------- Panneau de détail d'un employé (s'ouvre à droite)
  var tiroirUser = null;
  function fermerTiroir() { tiroirUser = null; var t = $('hb-tiroir'); if (t) { t.parentNode.removeChild(t); } }
  function ouvrirTiroir(u) { tiroirUser = u; rendreTiroir(); }
  function rendreTiroir() {
    if (!tiroirUser) { return; }
    var u = tiroirUser, c = chiffresDe(u), auj = B.jourIso(), jours = joursPeriode();
    var html = '<div class="tiroir" role="dialog" aria-label="Détail de ' + h(nomUser(u)) + '"><div class="ttete"><span class="rond gros">' + h(initiales(u)) + '</span><span><b>' + h(nomUser(u)) + '</b><small>' + h(u) + '</small></span><button type="button" class="btn" data-t="fermer" style="margin-left:auto">Fermer</button></div>'
      + troisChiffres(c).replace('class="trois"', 'class="trois kpis"')
      + '<div class="rangee-btn"><button type="button" class="btn" data-t="ajH">+ Ajouter des heures</button><button type="button" class="btn" data-t="ajD">+ Ajouter une dépense</button></div>';
    c.P.semaines.forEach(function (s) {
      var ls = c.l.filter(function (x) { return x.d.date >= s.debut && x.d.date <= s.fin; });
      html += '<h4>' + h(c.P.paye ? s.nom + ' · ' + B.libelleSemaine(s) : s.nom) + ' · ' + B.duree(minutes(ls)) + '</h4>';
      jours.filter(function (j) { return j >= s.debut && j <= s.fin; }).forEach(function (j) {
        var lj = ls.filter(function (x) { return x.d.date === j; }), we = B.dateDe(j).getDay() % 6 === 0;
        if (!lj.length && (j > auj || we)) { return; }
        html += '<div class="jour"><span class="jn' + (lj.length ? '' : ' manque') + '">' + h(B.dateCourte(j)) + '</span><span>'
          + (lj.length ? lj.map(function (x) {
            return '<span class="ent"><span><b>' + h(B.heureFr(x.d.debut)) + ' à ' + h(B.heureFr(x.d.fin)) + '</b> · ' + B.duree(B.minutesEntree(x.d))
              + (x.d.parBureau ? ' <span class="sem">(saisie par le bureau)</span>' : (x.d.corrigeParBureau ? ' <span class="sem">(corrigée par le bureau)</span>' : '')) + '<small>' + h(x.d.description) + '</small></span>'
              + '<button type="button" class="btn petit" data-t="modH" data-id="' + h(x.id) + '">Modifier</button></span>';
          }).join('') : '<span class="manque">Aucune heure</span>') + '</span><span class="jt">' + (lj.length ? B.duree(minutes(lj)) : '') + '</span></div>';
      });
    });
    html += '<h4>Dépenses · ' + B.argent(c.dTotal) + '</h4>' + (c.dl.length ? '<div class="recus">' + c.dl.map(function (x) {
      return '<span class="recu"><button type="button" class="vignette" data-t="recu" data-id="' + h(x.id) + '" aria-label="Voir le reçu">' + (x.d.recu ? '<span class="aide" data-vignette="' + h(x.id) + '">…</span>' : '<span class="aide">Aucun</span>') + '</button>'
        + '<span class="rt"><b>' + B.argent(x.d.montant) + '</b><small>' + h(B.dateCourte(x.d.date)) + ' · ' + h(x.d.description) + '</small></span><button type="button" class="btn petit" data-t="modD" data-id="' + h(x.id) + '">Modifier</button></span>';
    }).join('') + '</div>' : '<div class="aide">Aucune dépense pour cette période.</div>');
    html += '</div>';
    var fond = $('hb-tiroir');
    if (!fond) {
      fond = document.createElement('div'); fond.id = 'hb-tiroir'; fond.className = 'fond-tiroir'; $('hb').appendChild(fond);
      fond.addEventListener('click', function (e) {
        if (e.target === fond) { fermerTiroir(); return; }
        var b = e.target.closest('[data-t]'); if (!b) { return; }
        var t = b.getAttribute('data-t'), id = b.getAttribute('data-id');
        if (t === 'fermer') { fermerTiroir(); }
        else if (t === 'ajH') { panneauHeure(null, tiroirUser); }
        else if (t === 'ajD') { panneauDepense(null, tiroirUser); }
        else if (t === 'modH') { panneauHeure(trouver(heures, id)); }
        else if (t === 'modD') { panneauDepense(trouver(depenses, id)); }
        else if (t === 'recu') { var x = trouver(depenses, id); if (x && x.d.recu) { voirRecu(x); } }
      });
    }
    fond.innerHTML = html;
    // Vignettes des reçus, chargées une à une
    c.dl.forEach(function (x) {
      if (!x.d.recu) { return; }
      if (vignettes[x.d.recu]) { poserVignette(x.id, vignettes[x.d.recu]); return; }
      B.lireRecu(api, x.d.recu).then(function (b) { vignettes[x.d.recu] = URL.createObjectURL(b); poserVignette(x.id, vignettes[x.d.recu]); }).catch(function () {});
    });
  }
  var vignettes = {};
  function poserVignette(id, url) { var z = document.querySelector('[data-vignette="' + id + '"]'); if (z) { z.outerHTML = '<img alt="" src="' + url + '">'; } }
  function remplirDepenses(z) {
    var l = dansPeriode(depenses);
    if (!l.length) { pager(0, 1); z.innerHTML = '<div class="tableau"><div class="vide">Aucune dépense pour cette période.</div></div>'; return; }
    var par = Math.max(1, Math.floor((z.clientHeight - 40 - 46 - 4) / 46)), debut = pager(l.length, par);
    z.innerHTML = '<div class="tableau"><table class="lignes"><thead><tr><th>Sem.</th><th>Date</th><th>Employé</th><th>Description</th><th class="n">Montant</th><th>Reçu</th><th></th></tr></thead><tbody>'
      + l.slice(debut, debut + par).map(function (x) {
        return '<tr><td>' + B.semaineDe(periode, x.d.date) + '</td><td>' + h(B.dateCourte(x.d.date)) + '</td><td><b>' + h(nomUser(x.d.user)) + '</b></td><td class="desc"><span class="coupe">' + h(x.d.description) + '</span></td><td class="n">' + B.argent(x.d.montant) + '</td>'
          + '<td>' + (x.d.recu ? '<button type="button" class="btn petit vert" data-a="recu" data-id="' + h(x.id) + '">Voir le reçu</button>' : '<span class="aide">Aucun</span>') + '</td>'
          + '<td><button type="button" class="btn petit" data-a="modifierDepense" data-id="' + h(x.id) + '">Modifier</button></td></tr>';
      }).join('')
      + '<tr class="total"><td colspan="4">Total de la période (' + l.length + ' dépense' + (l.length > 1 ? 's' : '') + ')</td><td class="n">' + B.argent(argentTotal(l)) + '</td><td colspan="2"></td></tr></tbody></table></div>';
  }
  function rendre() {
    var z = $('hb-contenu'); if (!z) { return; }
    if (!pret) { z.innerHTML = '<div class="aide">Chargement…</div>'; return; }
    if (!acces) { z.innerHTML = '<div class="message erreur" role="alert" style="font-size:16px;padding:20px;text-align:center"><b style="font-size:22px">Accès refusé</b><br>Ton compte (' + h(moi) + ') n’a pas accès à cette application. Communique avec le Gestionnaire Livraison pour obtenir l’accès.</div>' + '<div class="aide" style="text-align:center;font-weight:600;margin-top:8px">Bonneville - Version ' + B.VERSION + '</div>'; return; }
    var cour = B.periodeDe(B.jourIso()), lh = dansPeriode(heures), ld = dansPeriode(depenses);
    var gensAcces = users.filter(function (u) { var e = employes[u.user]; return u.actif && e && e.d.droits && (e.d.droits.heures || e.d.droits.depenses); });
    var html = message ? '<div class="message' + (message.e ? ' erreur' : '') + '" role="status">' + h(message.t) + '</div>' : '';
    html += '<div class="outils"><div class="per"><button type="button" class="btn" data-a="periode" data-v="-1" aria-label="Période précédente">‹</button><b>Période ' + h(B.libellePeriode(periode)) + '<small>' + (periode.n === cour.n ? 'Période en cours' : (periode.n < cour.n ? 'Période terminée' : 'Période à venir')) + '</small></b><button type="button" class="btn" data-a="periode" data-v="1" aria-label="Période suivante">›</button></div>'
      + (periode.n !== cour.n ? '<button type="button" class="btn" data-a="aujourdhui">Période en cours</button>' : '')
      + '<span class="maj" id="hb-maj" aria-live="polite">' + h(texteMaj()) + '</span><span class="droite"><span class="pager" id="hb-pager"></span><button type="button" class="btn discret" data-a="ajouterHeure" title="Ajouter des heures"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Heures</button><button type="button" class="btn discret" data-a="ajouterDepense" title="Ajouter une dépense"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Dépense</button></span></div>';
    html += '<div class="zone" id="hb-zone"></div>';
    z.innerHTML = html + '<div class="pied">Bonneville - Version ' + B.VERSION + '</div>';
    remplirZone();
    rendreTiroir();
  }

  // ---------- Panneaux de saisie (le bureau peut ajouter ou corriger n'importe quelle période)
  function fermer() { var f = $('hb-panneau'); if (f) { f.parentNode.removeChild(f); } }
  function ouvrirPanneau(html, brancherP) {
    fermer();
    var fond = document.createElement('div'); fond.className = 'fond-panneau'; fond.id = 'hb-panneau';
    fond.innerHTML = '<div class="panneau" role="dialog">' + html + '</div>';
    fond.addEventListener('click', function (e) { if (e.target === fond) { fermer(); } });
    $('hb').appendChild(fond); brancherP();
  }
  function optionsEmployes(sel) {
    return users.filter(function (u) { return u.actif || u.user === sel; }).map(function (u) { return '<option value="' + h(u.user) + '"' + (u.user === sel ? ' selected' : '') + '>' + h(u.nom) + '</option>'; }).join('');
  }
  function panneauHeure(x, pourUser) {
    var d = x ? x.d : { user: pourUser || filtreEmp || '', date: B.jourIso() > plage().fin ? plage().fin : (B.jourIso() < plage().debut ? plage().debut : B.jourIso()), debut: '', fin: '', description: '' };
    ouvrirPanneau('<h3>' + (x ? 'Modifier des heures' : 'Ajouter des heures') + '</h3>'
      + '<label class="champ">Employé<select id="ph-user"' + (x ? ' disabled' : '') + '><option value="">Choisir…</option>' + optionsEmployes(d.user) + '</select></label>'
      + '<div class="rangee"><label class="champ">Date<input type="date" id="ph-date" value="' + h(d.date) + '"></label><label class="champ">Début<input type="time" id="ph-debut" value="' + h(d.debut) + '"></label><label class="champ">Fin<input type="time" id="ph-fin" value="' + h(d.fin) + '"></label></div>'
      + '<label class="champ">Projet (description)<textarea id="ph-desc">' + h(d.description) + '</textarea></label>'
      + '<div class="rangee"><button type="button" class="btn jaune" id="ph-ok">Enregistrer</button>' + (x ? '<button type="button" class="btn rouge" id="ph-suppr">Supprimer</button>' : '') + '<button type="button" class="btn" id="ph-annuler">Annuler</button></div>',
      function () {
        $('ph-annuler').onclick = fermer;
        $('ph-ok').onclick = function () {
          var n = { type: 'heure', user: x ? d.user : $('ph-user').value, date: $('ph-date').value, debut: $('ph-debut').value, fin: $('ph-fin').value, description: $('ph-desc').value.trim() };
          if (!n.user) { alert('Choisis l’employé.'); return; }
          if (!n.date || !n.debut || !n.fin || !B.minutesEntree(n)) { alert('Inscris la date, le début et la fin.'); return; }
          if (!n.description) { alert('Inscris le projet.'); return; }
          n.nom = nomUser(n.user); n.creeLe = x ? d.creeLe : new Date().toISOString(); n.majLe = new Date().toISOString(); n.majPar = moi; if (x) { n.parBureau = !!d.parBureau; n.corrigeParBureau = !d.parBureau; } else { n.parBureau = true; }
          G.enregistrer(x ? { id: x.id } : null, n).then(function (id) {
            heures = heures.filter(function (y) { return y.id !== id; }); heures.push({ id: id, d: n }); trier(heures);
            fermer(); ouverts[n.user] = true; onglet = 'heures'; dire('Heures enregistrées pour ' + n.nom + '.');
          }).catch(function (e) { alert('Enregistrement impossible : ' + (e && e.message ? e.message : e)); });
        };
        if (x) {
          $('ph-suppr').onclick = function () {
            if (!confirm('Supprimer cette entrée de ' + nomUser(d.user) + ' ?')) { return; }
            G.retirer(x.id).then(function () { heures = heures.filter(function (y) { return y.id !== x.id; }); fermer(); dire('Entrée supprimée.'); });
          };
        }
      });
  }
  function panneauDepense(x, pourUser) {
    var d = x ? x.d : { user: pourUser || filtreEmp || '', date: B.jourIso() > plage().fin ? plage().fin : (B.jourIso() < plage().debut ? plage().debut : B.jourIso()), montant: '', description: '' }, fichier = null;
    ouvrirPanneau('<h3>' + (x ? 'Modifier une dépense' : 'Ajouter une dépense') + '</h3>'
      + '<label class="champ">Employé<select id="pd-user"' + (x ? ' disabled' : '') + '><option value="">Choisir…</option>' + optionsEmployes(d.user) + '</select></label>'
      + '<div class="rangee"><label class="champ">Date<input type="date" id="pd-date" value="' + h(d.date) + '"></label><label class="champ">Montant ($)<input type="text" inputmode="decimal" id="pd-montant" value="' + h(d.montant !== '' ? String(d.montant).replace('.', ',') : '') + '"></label></div>'
      + '<label class="champ">Description<textarea id="pd-desc">' + h(d.description) + '</textarea></label>'
      + '<label class="champ">' + (x && d.recu ? 'Remplacer la photo du reçu (facultatif)' : 'Photo du reçu') + '<input type="file" id="pd-photo" accept="image/*" style="height:auto;padding:8px"></label>'
      + '<div class="rangee"><button type="button" class="btn jaune" id="pd-ok">Enregistrer</button>' + (x ? '<button type="button" class="btn rouge" id="pd-suppr">Supprimer</button>' : '') + '<button type="button" class="btn" id="pd-annuler">Annuler</button></div>',
      function () {
        $('pd-annuler').onclick = fermer;
        $('pd-photo').onchange = function () { fichier = this.files && this.files[0]; };
        $('pd-ok').onclick = function () {
          var m = montantDe($('pd-montant').value);
          var n = { type: 'depense', user: x ? d.user : $('pd-user').value, date: $('pd-date').value, montant: m, description: $('pd-desc').value.trim(), recu: x ? d.recu : '' };
          if (!n.user) { alert('Choisis l’employé.'); return; }
          if (!n.date || m === null || m <= 0) { alert('Inscris la date et le montant.'); return; }
          if (!n.description) { alert('Inscris la description.'); return; }
          if (!fichier && !n.recu) { alert('Ajoute la photo du reçu.'); return; }
          n.nom = nomUser(n.user); n.creeLe = x ? d.creeLe : new Date().toISOString(); n.majLe = new Date().toISOString(); n.majPar = moi; if (x) { n.parBureau = !!d.parBureau; n.corrigeParBureau = !d.parBureau; } else { n.parBureau = true; }
          $('pd-ok').disabled = true; $('pd-ok').textContent = 'Envoi…';
          var ancien = '';
          var etape = fichier ? B.reduirePhoto(fichier).then(function (blob) { return B.envoyerRecu(api, blob, 'Reçu ' + n.date + ' ' + n.nom + '.jpg', { type: 'recu', user: n.user, date: n.date, montant: m }); }).then(function (id) { ancien = n.recu; n.recu = id; }) : Promise.resolve();
          etape.then(function () { return G.enregistrer(x ? { id: x.id } : null, n); }).then(function (id) {
            if (ancien) { B.retirerRecu(api, ancien); }
            depenses = depenses.filter(function (y) { return y.id !== id; }); depenses.push({ id: id, d: n }); trier(depenses);
            fermer(); onglet = 'depenses'; dire('Dépense enregistrée pour ' + n.nom + '.');
          }).catch(function (e) { $('pd-ok').disabled = false; $('pd-ok').textContent = 'Enregistrer'; alert('Enregistrement impossible : ' + (e && e.message ? e.message : e)); });
        };
        if (x) {
          $('pd-suppr').onclick = function () {
            if (!confirm('Supprimer cette dépense et son reçu ?')) { return; }
            G.retirer(x.id).then(function () { if (d.recu) { B.retirerRecu(api, d.recu); } depenses = depenses.filter(function (y) { return y.id !== x.id; }); fermer(); dire('Dépense supprimée.'); });
          };
        }
      });
  }
  function voirRecu(x) {
    ouvrirPanneau('<h3>Reçu de ' + h(nomUser(x.d.user)) + '</h3><div class="aide">' + h(B.dateCourte(x.d.date)) + ' · ' + B.argent(x.d.montant) + ' · ' + h(x.d.description) + '</div><div id="pr-zone" class="aide">Chargement du reçu…</div><div class="rangee"><button type="button" class="btn" id="pr-fermer">Fermer</button></div>', function () {
      $('pr-fermer').onclick = fermer;
      B.lireRecu(api, x.d.recu).then(function (b) {
        var u = URL.createObjectURL(b), z = $('pr-zone');
        if (z) { z.outerHTML = '<img alt="Photo du reçu" src="' + u + '"><a class="btn" href="' + u + '" download="Reçu ' + h(x.d.date + ' ' + nomUser(x.d.user)) + '.jpg">Télécharger la photo</a>'; }
      }).catch(function (e) { var z = $('pr-zone'); if (z) { z.textContent = 'Reçu illisible : ' + (e && e.message ? e.message : e); } });
    });
  }

  // ---------- Excel
  function exporter() {
    if (!window.XLSX) { dire('La bibliothèque Excel n’a pas été chargée. Fais Ctrl + F5 et réessaie.', true); return; }
    var P = plage(), lh = dansPeriode(heures), ld = dansPeriode(depenses), gens = personnes(), wb = XLSX.utils.book_new();
    function feuille(rows, titre) { XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'Aucune donnée': '' }]), titre); }
    feuille(gens.map(function (u) {
      var l = lh.filter(function (x) { return x.d.user === u; }), ligne = { 'Employé': nomUser(u), 'Courriel': u };
      P.semaines.forEach(function (s) { ligne[s.court + ' (h)'] = B.heuresDecimales(minutes(l.filter(function (x) { return x.d.date >= s.debut && x.d.date <= s.fin; }))); });
      ligne['Total (h)'] = B.heuresDecimales(minutes(l));
      ligne['Dépenses ($)'] = Math.round(argentTotal(ld.filter(function (x) { return x.d.user === u; })) * 100) / 100;
      return ligne;
    }), 'Sommaire');
    feuille(lh.map(function (x) { return { 'Employé': nomUser(x.d.user), 'Semaine': semaineNom(P, x.d.date), 'Date': x.d.date, 'Début': x.d.debut, 'Fin': x.d.fin, 'Heures': B.heuresDecimales(B.minutesEntree(x.d)), 'Projet (description)': x.d.description }; }), 'Heures');
    feuille(ld.map(function (x) { return { 'Employé': nomUser(x.d.user), 'Semaine': semaineNom(P, x.d.date), 'Date': x.d.date, 'Montant ($)': Number(x.d.montant) || 0, 'Description': x.d.description, 'Reçu': x.d.recu ? 'Oui' : 'Non' }; }), 'Dépenses');
    XLSX.writeFile(wb, 'Heures et dépenses ' + P.debut + ' au ' + P.fin + '.xlsx');
  }

  // ---------- Événements
  function trouver(l, id) { return l.filter(function (y) { return y.id === id; })[0]; }
  var minuteur = null;
  window.addEventListener('resize', function () { clearTimeout(minuteur); minuteur = setTimeout(remplirZone, 120); });
  function brancher() {
    $('hb-contenu').addEventListener('click', function (e) {
      var o = e.target.closest('[data-o]'); if (o) { onglet = o.getAttribute('data-o'); pages[onglet] = 0; message = null; rendre(); return; }
      var k = e.target.closest('[data-carte]'); if (k) { ouvrirTiroir(k.getAttribute('data-carte')); return; }
      var b = e.target.closest('[data-a]'); if (!b) { return; }
      var a = b.getAttribute('data-a'), id = b.getAttribute('data-id');
      if (a === 'page') { pages[onglet] = Math.max(0, Math.min(nbPages - 1, pages[onglet] + Number(b.getAttribute('data-v')))); remplirZone(); return; }
      if (false) { mode = b.getAttribute('data-v'); if (mode === 'perso' && !perso) { perso = { debut: periode.debut, fin: periode.fin }; } pages = { heures: 0, depenses: 0 }; message = null; rendre(); return; }
      if (a === 'periode') { periode = B.periodeVoisine(periode, Number(b.getAttribute('data-v'))); pages = { heures: 0, depenses: 0 }; message = null; rendre(); }
      else if (a === 'aujourdhui') { periode = B.periodeDe(B.jourIso()); pages = { heures: 0, depenses: 0 }; message = null; rendre(); }
      else if (a === 'excel') { exporter(); }
      else if (a === 'ajouterHeure') { panneauHeure(null); }
      else if (a === 'ajouterDepense') { panneauDepense(null); }
      else if (a === 'modifierHeure') { panneauHeure(trouver(heures, id)); }
      else if (a === 'modifierDepense') { panneauDepense(trouver(depenses, id)); }
      else if (a === 'recu') { voirRecu(trouver(depenses, id)); }
    });
  }

  window.BonnevilleModule = { aller: function () { onglet = 'heures'; periode = periode || B.periodeDe(B.jourIso()); rendre(); } };
  var branche = false;
  return {
    initialize: function (a, s, callback) {
      api = a; B = window.Bonneville; G = B.creerApi(api); periode = B.periodeDe(B.jourIso());
      if (!branche) { brancher(); branche = true; }
      $('hb-version').textContent = 'version ' + VERSION;
      G.session().then(function (s2) {
        moi = s2.userName || '';
        return Promise.all([G.lireChamp('employe', 'user', moi).catch(function () { return []; }), G.estAdministrateur(moi).catch(function () { return false; })]);
      }).then(function (r) {
        var e = r[0][0]; acces = !!(e && e.details.droits && e.details.droits.admin);
        if (acces) { demarrerAuto(); return charger(); }
        pret = true; rendre();
      });
      callback();
    },
    focus: function () { if (pret && acces) { charger(); demarrerAuto(); } },
    blur: function () { clearInterval(minuterieAuto); }
  };
};
</script>
