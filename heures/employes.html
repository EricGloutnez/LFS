<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bonneville - Employés</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://ericgloutnez.github.io/LFS/heures/heures-commun.js?v=2.0.0"></script>
</head>
<body style="margin:0">
<div id="be">
<style>
  #be { --encre: #14191e; --doux: #4f5963; --ligne: #d3d8dd; --fond: #eef0f2; --surface: #ffffff; --bande: #e3e6e9; --accent: #f2a900; --ok: #1b7f3b; --non: #b42318;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--encre); background: var(--fond); height: 100vh; font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #be * { box-sizing: border-box; }
  #be .entete { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--ligne); }
  #be .entete img { height: 18px; } #be .entete .sep { width: 1px; height: 26px; background: var(--ligne); } #be .entete .titre { font-weight: 700; font-size: 16px; }
  #be .version { margin-left: auto; font-size: 12px; color: var(--doux); }
  #be main { flex: 1; min-height: 0; padding: 14px 24px 8px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  #be .zone { flex: 1; min-height: 0; overflow: hidden; }
  #be .pied { text-align: center; font-size: 12px; font-weight: 600; color: var(--doux); }
  #be .pager { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--doux); margin-right: 10px; }
  #be .btn.petit { height: 30px; padding: 0 10px; font-size: 13px; }
  #be .ligne-aide { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #be td.qui b { margin-right: 8px; } #be .courriel { color: var(--doux); font-size: 12px; }
  #be .droite { display: inline-flex; align-items: center; gap: 10px; }
  #be .outils { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  #be input[type=text] { font: inherit; height: 38px; padding: 0 10px; border: 1px solid var(--ligne); border-radius: 8px; width: 260px; }
  #be label.case { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
  #be input[type=checkbox] { width: 18px; height: 18px; accent-color: #1b7f3b; cursor: pointer; }
  #be .btn { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--surface); color: var(--encre); font: inherit; font-weight: 700; cursor: pointer; }
  #be .btn.jaune { background: var(--accent); border-color: var(--accent); }
  #be .btn:disabled { opacity: .45; cursor: default; }
  #be .droite { margin-left: auto; }
  #be .tableau { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; overflow-x: auto; }
  #be table { width: 100%; border-collapse: collapse; }
  #be th { text-align: left; font-size: 12px; color: var(--doux); font-weight: 700; padding: 0 12px; height: 54px; background: var(--bande); }
  #be th.c, #be td.c { text-align: center; width: 160px; }
  #be th.sel, #be td.sel { width: 44px; text-align: center; }
  #be .outils .btn:disabled { opacity: .45; }
  #be td { padding: 0 12px; height: 46px; border-top: 1px solid var(--ligne); white-space: nowrap; }
  #be tr.modifie td { background: #fff7df; }
  #be tr.inactif td { color: var(--doux); }
  #be .aide { font-size: 13px; color: var(--doux); }
  #be .puce { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--bande); color: var(--doux); margin-left: 6px; }
  #be .message { border-radius: 10px; padding: 10px 14px; font-weight: 600; background: #e7f4ec; color: #14532d; }
  #be .message.erreur { background: #fde8e7; color: #7a1a12; }
  #be select[data-cycle] { font: inherit; font-size: 13px; height: 30px; border: 1px solid var(--ligne); border-radius: 6px; padding: 0 6px; background: var(--surface); }
  #be th.c, #be td.c { width: auto; padding: 0 6px; }
  #be .fond-params { position: fixed; inset: 0; background: rgba(20,25,30,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #be .pparams { background: var(--surface); border-radius: 14px; padding: 18px 20px; width: min(520px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  #be .pparams h3 { margin: 0; } #be .pparams h4 { margin: 8px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--doux); }
  #be .pchamp { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #be .pval { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  #be .pval input { width: 100px; height: 34px; font: inherit; text-align: right; border: 1px solid var(--ligne); border-radius: 8px; padding: 0 8px; }
  #be .rangee-p { display: flex; gap: 10px; margin-top: 8px; }
  #be .refus { background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: 28px; text-align: center; max-width: 620px; margin: 40px auto; }
</style>
<div class="entete"><img alt="Bonneville" src="https://ericgloutnez.github.io/LFS/logo-bonneville.png"><span class="sep"></span><span class="titre">Employés</span><span class="version" id="be-version"></span></div>
<main id="be-contenu"><div class="aide">Chargement…</div></main>
</div>

<script>
geotab.addin.employes = function () {
  'use strict';
  var B = window.Bonneville;
  var VERSION = '2.0.0';
  var G = null, moi = '', users = [], employes = {}, modifies = {}, filtre = { texte: '', inactifs: false, retires: false }, selection = {}, message = null;

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fiche(u) { return modifies[u] || (employes[u] ? employes[u].d : { type: 'employe', user: u, droits: {} }); }
  function dire(t, e) { message = { t: t, e: !!e }; rendre(); }

  function charger() {
    return Promise.all([G.utilisateurs(), G.lireType('employe').catch(function () { return []; }), G.lireType('parametres').catch(function () { return []; })]).then(function (r) {
      paramRec = r[2] && r[2][0] ? { id: r[2][0].id, d: r[2][0].details } : null;
      users = r[0]; employes = {}; modifies = {};
      r[1].forEach(function (l) { if (l.details.user) { employes[l.details.user] = { id: l.id, d: l.details }; } });
      rendre();
    }).catch(function (e) { dire('Lecture impossible : ' + (e && e.message ? e.message : e), true); });
  }
  function visibles() {
    var t = filtre.texte.toLowerCase();
    // Les personnes retirées de la liste n'apparaissent que dans la vue « Personnes retirées »
    return users.filter(function (u) { return !!fiche(u.user).masque === filtre.retires && (filtre.retires || filtre.inactifs || u.actif) && (!t || (u.nom + ' ' + u.user).toLowerCase().indexOf(t) >= 0); });
  }
  // Options par employé : [clé, titre de colonne, explication]
  var OPTIONS = [
    ['heures', 'Heures', 'Saisie des heures dans Geotab Drive'],
    ['depenses', 'Dépenses', 'Ajout de dépenses avec photo du reçu dans Geotab Drive'],
    ['admin', 'Admin.', 'Accès au bureau (Tableau de bord, Rapport, Employés)'],
    ['hos', 'HOS', 'Heures auto : les journaux HOS servent de vérification (triangle jaune) et comptent si rien n’est saisi'],
    ['escorte', 'Escorte', 'Escorte routière : case « Convoi routier » une fois par jour'],
    ['km', 'Km', 'Kilométrage : km aller, chantier et retour dans chaque entrée d’heures'],
    ['repas', 'Repas', 'Prime de repas selon les heures réelles du jour'],
    ['installation', 'Modules', 'Modules installés (prime par module) et case « Installation grand projet »']
  ];
  // Tout tient dans la page : la liste est découpée en pages selon la hauteur disponible
  var page = 0, nbPages = 1;
  function rendre() {
    var z = $('be-contenu'); if (!z) { return; }
    var l = visibles(), nbMod = Object.keys(modifies).length;
    var nbRetires = users.filter(function (u) { return fiche(u.user).masque; }).length;
    Object.keys(selection).forEach(function (u) { if (!l.some(function (x) { return x.user === u; })) { delete selection[u]; } });
    var nbSel = Object.keys(selection).length;
    var avecAcces = users.filter(function (u) { var d = fiche(u.user).droits || {}; return u.actif && (d.heures || d.depenses || d.admin); }).length;
    var html = message ? '<div class="message' + (message.e ? ' erreur' : '') + '" role="status">' + h(message.t) + '</div>' : '';
    html += '<div class="outils"><input type="text" id="be-texte" placeholder="Rechercher un nom ou un courriel" aria-label="Rechercher" value="' + h(filtre.texte) + '">'
      + (filtre.retires ? '' : '<label class="case"><input type="checkbox" id="be-inactifs"' + (filtre.inactifs ? ' checked' : '') + '> Comptes inactifs</label>')
      + '<button type="button" class="btn" id="be-vue">' + (filtre.retires ? '‹ Revenir à la liste' : 'Personnes retirées (' + nbRetires + ')') + '</button>'
      + '<button type="button" class="btn" id="be-retirer"' + (nbSel ? '' : ' disabled') + '>' + (filtre.retires ? 'Remettre dans la liste' : 'Retirer de la liste') + (nbSel ? ' (' + nbSel + ')' : '') + '</button>'
      + '<span class="aide">' + avecAcces + ' avec accès</span>'
      + '<span class="droite"><span class="pager" id="be-pager"></span><button type="button" class="btn" id="be-params">Paramètres</button><button type="button" class="btn jaune" id="be-sauver"' + (nbMod ? '' : ' disabled') + '>Enregistrer les changements' + (nbMod ? ' (' + nbMod + ')' : '') + '</button></span></div>';
    if (filtre.retires) { html += '<div class="message" style="background:var(--bande);color:var(--encre)">Personnes retirées de la liste. Coche celles à remettre, puis clique sur « Remettre dans la liste ».</div>'; }
    html += '<div class="zone" id="be-zone"></div>'
      + '<div class="pied">Bonneville - Version ' + B.VERSION + '</div>';
    z.innerHTML = html;
    var champ = $('be-texte');
    champ.oninput = function () { filtre.texte = this.value; page = 0; var pos = this.value.length; rendre(); var n = $('be-texte'); n.focus(); n.setSelectionRange(pos, pos); };
    if ($('be-inactifs')) { $('be-inactifs').onchange = function () { filtre.inactifs = this.checked; page = 0; rendre(); }; }
    $('be-vue').onclick = function () { filtre.retires = !filtre.retires; selection = {}; page = 0; message = null; rendre(); };
    $('be-retirer').onclick = retirerSelection;
    $('be-sauver').onclick = sauver;
    $('be-params').onclick = ouvrirParams;
    remplirTable(l);
  }
  function remplirTable(l) {
    var zone = $('be-zone'); if (!zone) { return; }
    l = l || visibles();
    var par = Math.max(1, Math.floor((zone.clientHeight - 54 - 4) / 46));
    nbPages = Math.max(1, Math.ceil(l.length / par)); if (page > nbPages - 1) { page = nbPages - 1; }
    var morceau = l.slice(page * par, page * par + par);
    $('be-pager').innerHTML = nbPages > 1 ? '<button type="button" class="btn petit" data-p="-1" aria-label="Page précédente"' + (page ? '' : ' disabled') + '>‹</button>Page ' + (page + 1) + ' / ' + nbPages + '<button type="button" class="btn petit" data-p="1" aria-label="Page suivante"' + (page < nbPages - 1 ? '' : ' disabled') + '>›</button>' : '';
    Array.prototype.forEach.call($('be-pager').querySelectorAll('[data-p]'), function (b) { b.onclick = function () { page = Math.max(0, Math.min(nbPages - 1, page + Number(b.getAttribute('data-p')))); remplirTable(); }; });
    var tousSel = morceau.length && morceau.every(function (u) { return selection[u.user]; });
    zone.innerHTML = '<div class="tableau"><table><thead><tr><th class="sel"><input type="checkbox" id="be-tous" aria-label="Tout sélectionner sur cette page"' + (tousSel ? ' checked' : '') + '></th><th>Employé</th>' + OPTIONS.map(function (o) { return '<th class="c" title="' + h(o[2]) + '">' + o[1] + '</th>'; }).join('') + '<th class="c">Cycle de paye</th></tr></thead><tbody>'
      + morceau.map(function (u) {
        var d = fiche(u.user).droits || {};
        return '<tr data-u="' + h(u.user) + '" class="' + (modifies[u.user] ? 'modifie' : '') + (u.actif ? '' : ' inactif') + '"><td class="sel"><input type="checkbox" class="be-sel" aria-label="Sélectionner ' + h(u.nom) + '"' + (selection[u.user] ? ' checked' : '') + '></td>'
          + '<td class="qui"><b>' + h(u.nom) + '</b>' + (u.actif ? '' : '<span class="puce">Inactif</span>') + '<span class="courriel">' + h(u.user) + '</span></td>'
          + OPTIONS.map(function (o) { return '<td class="c"><input type="checkbox" data-d="' + o[0] + '" aria-label="' + h(o[1].replace(/<br>/g, ' ') + ' : ' + u.nom) + '"' + (d[o[0]] ? ' checked' : '') + '></td>'; }).join('')
          + '<td class="c"><select data-cycle aria-label="Cycle de paye : ' + h(u.nom) + '"><option value="2sem"' + (B.cycleDe(fiche(u.user)) === '2sem' ? ' selected' : '') + '>Aux 2 semaines</option><option value="hebdo"' + (B.cycleDe(fiche(u.user)) === 'hebdo' ? ' selected' : '') + '>Hebdomadaire</option></select></td></tr>';
      }).join('') + (morceau.length ? '' : '<tr><td colspan="12" style="text-align:center;color:var(--doux);padding:24px">' + (filtre.retires ? 'Personne n’a été retiré de la liste.' : 'Aucun employé à afficher.') + '</td></tr>') + '</tbody></table></div>';
    $('be-tous').onchange = function () { var c = this.checked; morceau.forEach(function (u) { if (c) { selection[u.user] = true; } else { delete selection[u.user]; } }); rendre(); };
    Array.prototype.forEach.call(zone.querySelectorAll('input.be-sel'), function (c) {
      c.onchange = function () { var u = c.closest('tr').getAttribute('data-u'); if (c.checked) { selection[u] = true; } else { delete selection[u]; } rendre(); };
    });
    Array.prototype.forEach.call(zone.querySelectorAll('tr[data-u] select[data-cycle]'), function (c) {
      c.onchange = function () {
        var u = c.closest('tr').getAttribute('data-u'), f = JSON.parse(JSON.stringify(fiche(u)));
        f.cycle = c.value; f.droits = f.droits || {};
        var orig = employes[u] ? (employes[u].d.droits || {}) : {};
        if (OPTIONS.every(function (o) { return !!orig[o[0]] === !!f.droits[o[0]]; }) && B.cycleDe(employes[u] ? employes[u].d : null) === B.cycleDe(f)) { delete modifies[u]; } else { modifies[u] = f; }
        message = null; rendre();
      };
    });
    Array.prototype.forEach.call(zone.querySelectorAll('tr[data-u] input[data-d]'), function (c) {
      c.onchange = function () {
        var u = c.closest('tr').getAttribute('data-u'), f = JSON.parse(JSON.stringify(fiche(u)));
        f.droits = f.droits || {}; f.droits[c.getAttribute('data-d')] = c.checked; // false enregistré tel quel : une option décochée reste décochée
        var orig = employes[u] ? (employes[u].d.droits || {}) : {};
        if (OPTIONS.every(function (o) { return !!orig[o[0]] === !!f.droits[o[0]]; }) && B.cycleDe(employes[u] ? employes[u].d : null) === B.cycleDe(f)) { delete modifies[u]; } else { modifies[u] = f; }
        message = null; rendre();
      };
    });
  }
  var minuteur = null;
  window.addEventListener('resize', function () { clearTimeout(minuteur); minuteur = setTimeout(function () { if (users.length) { remplirTable(); } }, 120); });
  // ---------- Paramètres : taux et primes (chaque journée garde les taux en vigueur au moment de la saisie)
  var paramRec = null;
  function ouvrirParams() {
    var p = B.params(paramRec ? paramRec.d : null);
    var champ = function (id, lib, val, pas, unite) { return '<label class="pchamp"><span>' + lib + '</span><span class="pval"><input type="number" id="' + id + '" step="' + pas + '" min="0" value="' + val + '">' + unite + '</span></label>'; };
    var f = document.createElement('div'); f.className = 'fond-params'; f.id = 'be-fond-params';
    f.innerHTML = '<div class="pparams" role="dialog" aria-label="Paramètres"><h3>Paramètres</h3><div class="aide">Les nouveaux taux s’appliquent aux saisies faites à partir de maintenant. Les journées déjà saisies gardent leurs taux.</div>'
      + '<h4>Kilométrage</h4>' + champ('pp-km', 'Taux par km', p.kmTaux, '0.01', '$')
      + '<h4>Prime de repas (heures réelles du jour)</h4>' + champ('pp-s1', 'Seuil 1 (aucune prime jusqu’à)', p.repasSeuil1 / 60, '0.25', 'h') + champ('pp-m1', 'Prime au-delà du seuil 1', p.repasMontant1, '1', '$')
      + champ('pp-s2', 'Seuil 2', p.repasSeuil2 / 60, '0.25', 'h') + champ('pp-m2', 'Prime au-delà du seuil 2', p.repasMontant2, '1', '$')
      + '<h4>Primes</h4>' + champ('pp-mod', 'Prime par module installé', p.moduleMontant, '1', '$') + champ('pp-conv', 'Prime de convoi routier (par jour)', p.convoiMontant, '1', '$')
      + '<div class="rangee-p"><button type="button" class="btn jaune" id="pp-ok">Enregistrer</button><button type="button" class="btn" id="pp-annuler">Annuler</button></div></div>';
    $('be').appendChild(f);
    var fermer = function () { if (f.parentNode) { f.parentNode.removeChild(f); } };
    f.addEventListener('click', function (e) { if (e.target === f) { fermer(); } });
    $('pp-annuler').onclick = fermer;
    $('pp-ok').onclick = function () {
      var v = function (id) { var n = parseFloat(String($(id).value).replace(',', '.')); return isNaN(n) ? null : n; };
      var d = { type: 'parametres', kmTaux: v('pp-km'), repasSeuil1: Math.round(v('pp-s1') * 60), repasMontant1: v('pp-m1'), repasSeuil2: Math.round(v('pp-s2') * 60), repasMontant2: v('pp-m2'), moduleMontant: v('pp-mod'), convoiMontant: v('pp-conv'), majLe: new Date().toISOString(), majPar: moi };
      if (Object.keys(d).some(function (k) { return d[k] === null || (typeof d[k] === 'number' && isNaN(d[k])); })) { alert('Vérifie les montants : un champ est vide.'); return; }
      if (d.repasSeuil2 <= d.repasSeuil1) { alert('Le seuil 2 doit être plus grand que le seuil 1.'); return; }
      G.enregistrer(paramRec, d).then(function (id) { paramRec = { id: id, d: d }; fermer(); dire('Paramètres enregistrés.'); }).catch(function (e) { alert('Enregistrement impossible : ' + (e && e.message ? e.message : e)); });
    };
  }
  // Retire (ou remet) les personnes sélectionnées : enregistré tout de suite
  function retirerSelection() {
    var liste = Object.keys(selection), masquer = !filtre.retires, c = Promise.resolve(), n = 0;
    liste.forEach(function (u) {
      c = c.then(function () {
        var e = JSON.parse(JSON.stringify(fiche(u))); e.type = 'employe'; e.user = u; e.droits = e.droits || {};
        e.masque = !!masquer;
        e.maj = new Date().toISOString(); e.majPar = moi;
        return G.enregistrer(employes[u] || null, e).then(function (id) { employes[u] = { id: id, d: e }; delete modifies[u]; n++; });
      });
    });
    c.then(function () {
      selection = {};
      dire(n + ' personne' + (n > 1 ? 's' : '') + (masquer ? ' retirée' + (n > 1 ? 's' : '') + ' de la liste. Tu peux les remettre avec « Personnes retirées ».' : ' remise' + (n > 1 ? 's' : '') + ' dans la liste.'));
    }).catch(function (e) { dire('Changement interrompu : ' + (e && e.message ? e.message : e), true); });
  }
  function sauver() {
    var liste = Object.keys(modifies), c = Promise.resolve(), n = 0;
    liste.forEach(function (u) {
      c = c.then(function () {
        var e = modifies[u]; e.type = 'employe'; e.user = u; e.maj = new Date().toISOString(); e.majPar = moi;
        return G.enregistrer(employes[u] || null, e).then(function (id) { employes[u] = { id: id, d: e }; delete modifies[u]; n++; });
      });
    });
    c.then(function () { dire(n + ' employé' + (n > 1 ? 's' : '') + ' enregistré' + (n > 1 ? 's' : '') + '.'); })
      .catch(function (e) { dire('Enregistrement interrompu : ' + (e && e.message ? e.message : e), true); });
  }

  window.BonnevilleModule = { aller: function (nom, valeur) { if (valeur === 'sansAcces') { filtre.texte = ''; } message = null; if (users.length) { rendre(); } } };
  return {
    initialize: function (api, s, callback) {
      B = window.Bonneville; G = B.creerApi(api);
      $('be-version').textContent = 'version ' + VERSION;
      G.session().then(function (s2) { moi = s2.userName || ''; return G.estAdministrateur(moi); }).then(function (ok) {
        if (ok) { return charger(); }
        $('be-contenu').innerHTML = '<div class="refus"><div style="font-size:40px">🔒</div><h2>Accès réservé aux administrateurs MyGeotab</h2><p class="aide">L’onglet Employés demande le rôle de sécurité Administrateur dans MyGeotab.</p></div>';
      }).catch(function (e) { $('be-contenu').innerHTML = '<div class="message erreur">' + h(e && e.message ? e.message : e) + '</div>'; });
      callback();
    },
    focus: function () {},
    blur: function () {}
  };
};
</script>
</body>
</html>
