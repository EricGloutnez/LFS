    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--encre); background: var(--fond); min-height: 100vh; -webkit-text-size-adjust: 100%; }

  .bd-entete img { height: 20px; }

  .bd-accueil-btn { display: none; height: 46px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--ligne); background: var(--surface); font-size: 15px; font-weight: 800; align-items: center; gap: 6px; cursor: pointer; }
  #bd.en-module .bd-accueil-btn { display: inline-flex; }
  /* iPhone : le bouton Accueil garde sa taille et le titre tient sur une ligne */
  html, body { scrollbar-width: none; } html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  .bd-accueil-btn { flex: 0 0 auto; width: auto; -webkit-appearance: none; appearance: none; color: var(--encre); }
  .bd-titre { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bd-titre { font-size: 18px; font-weight: 800; display: none; }

  .bd-rond.tel { background: var(--ok); border-color: var(--ok); color: #fff; }
  #bd-accueil { padding: 14px; display: flex; flex-direction: column; gap: 10px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; min-height: calc(100vh - 64px); }

  .bd-puce { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; background: var(--ok); color: #fff; }
  .bd-puce.gris { background: #2c343c; }
  .bd-rangee { display: flex; gap: 8px; }
  .bd-btn { flex: 1; min-height: 52px; border-radius: 12px; border: none; background: var(--accent); color: #14191e !important; font-size: 16px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 10px; }
  .bd-btn.sombre { background: #2c343c; color: #fff !important; flex: 0 0 96px; }
  .bd-section { font-size: 13px; font-weight: 800; color: var(--doux); letter-spacing: .4px; text-transform: uppercase; margin-top: 4px; }
  .bd-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bd-tuile { position: relative; min-height: 112px; border-radius: 16px; border: 1px solid var(--ligne); background: var(--surface); padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer; }
  .bd-tuile .ic { width: 44px; height: 44px; border-radius: 12px; color: #fff; display: flex; align-items: center; justify-content: center; }
  .bd-tuile b { font-size: 17px; display: block; } .bd-tuile small { font-size: 12px; color: var(--doux); }
  .bd-badge { position: absolute; top: 10px; right: 10px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--non); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .bd-refus { margin: 24px 2px; padding: 24px 20px; border-radius: 16px; background: var(--surface); border: 3px solid var(--non); display: flex; flex-direction: column; gap: 14px; text-align: center; }

  #bd #hd { min-height: calc(100vh - 64px); min-height: calc(100dvh - 64px); padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }

<style>
  #hd { --encre: #14191e; --doux: #4f5963; --ligne: #d3d8dd; --fond: #eef0f2; --surface: #ffffff; --bande: #e3e6e9; --accent: #f2a900; --ok: #1b7f3b; --non: #b42318; --noir: #14191e; --champ: #ffffff;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--encre); background: var(--fond); min-height: 100vh; -webkit-text-size-adjust: 100%; padding-bottom: 86px; }

  #hd .periode.claire .fleche { border-color: var(--ligne); color: var(--encre); }

  #hd .bascule { display: grid; grid-template-columns: 1fr 1fr; background: var(--bande); border-radius: 12px; padding: 4px; gap: 4px; }
  #hd .bascule button { min-height: 52px; border: 0; border-radius: 9px; background: transparent; color: var(--doux); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #hd .bascule button small { font-size: 12px; font-weight: 600; }
  #hd .bascule button.on { background: var(--surface); color: var(--encre); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #hd .jour { display: flex; flex-direction: column; gap: 6px; }
  #hd .jour-titre { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--doux); padding: 0 4px; }
  #hd .jour-titre.auj { color: var(--encre); }
  #hd .ligne { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font: inherit; color: var(--encre); }
  #hd button.ligne { cursor: pointer; }
  #hd .ligne .txt { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  #hd .ligne .t { font-weight: 700; font-size: 16px; }
  #hd .ligne .s { font-size: 14px; color: var(--doux); overflow-wrap: anywhere; }
  #hd .ligne .v { font-weight: 800; font-size: 17px; white-space: nowrap; }
  #hd .vide { font-size: 14px; color: var(--doux); padding: 4px 4px 0; }
  #hd .btn { min-height: 54px; border-radius: 12px; border: 1px solid var(--ligne); background: var(--surface); color: var(--encre); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0 16px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  #hd .btn.jaune { background: var(--accent); border-color: var(--accent); color: #14191e; }
  #hd .btn.rouge { color: var(--non); border-color: var(--non); background: transparent; }
  #hd .btn:disabled { opacity: .5; cursor: default; }
  #hd .rangee { display: flex; gap: 10px; }
  #hd label.champ { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: var(--doux); }
  #hd input, #hd textarea { font: inherit; font-size: 18px; color: var(--encre); background: var(--champ); border: 2px solid var(--ligne); border-radius: 12px; padding: 12px; width: 100%; min-height: 54px; }
  #hd textarea { min-height: 96px; resize: vertical; }
  #hd input:focus, #hd textarea:focus { outline: none; border-color: var(--accent); }
  /* iPhone : les champs de date et d'heure gardent leur largeur naturelle et débordent sans ces règles */
  #hd input, #hd textarea { display: block; max-width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; }
  #hd input[type="date"], #hd input[type="time"] { text-align: left; line-height: 1.3; }
  #hd input::-webkit-date-and-time-value { text-align: left; }
  #hd label.champ { min-width: 0; }
  #hd .rangee > * { flex: 1 1 0; min-width: 0; }
  #hd main > h2 { margin-top: 4px; }
  #hd .duree { font-size: 26px; font-weight: 800; }
  #hd .message { border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; background: #e7f4ec; color: #14532d; }
  #hd .message.erreur { background: #fde8e7; color: #7a1a12; }
  /* Formulaires compacts, sans barre de défilement */
  #hd.formulaire main { gap: 8px; padding-top: 10px; padding-bottom: 6px; }
  #hd.formulaire h2 { font-size: 20px; }
  #hd.formulaire .carte { padding: 12px; gap: 8px; }
  #hd.formulaire label.champ { gap: 4px; }
  #hd.formulaire input { min-height: 48px; padding: 10px 12px; }
  #hd.formulaire textarea { min-height: 64px; height: 64px; padding: 10px 12px; }
  #hd.formulaire .carte b { font-size: 15px; }
  #hd.formulaire .rangee label.btn { font-size: 15px; min-height: 48px; text-align: center; }
  #hd.formulaire .btn { min-height: 50px; }
  #hd.formulaire .duree { font-size: 22px; }
  #hd.formulaire .photo { max-height: 140px; }
  #hd, #hd * { scrollbar-width: none; } #hd::-webkit-scrollbar, #hd *::-webkit-scrollbar { display: none; }
  #hd .photo { width: 100%; max-height: 360px; object-fit: contain; border-radius: 12px; background: var(--bande); }
  #hd .fichier { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #hd .onglets-bas { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--ligne); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
  #hd .onglets-bas button { min-height: 66px; border: 0; background: transparent; color: var(--doux); font: inherit; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; border-top: 3px solid transparent; }
  #hd .onglets-bas button.on { color: var(--encre); border-top-color: var(--accent); }
  #hd .refus { border: 3px solid var(--non); text-align: center; } #hd .refus h2 { color: var(--non); font-size: 26px; } #hd .refus div { font-size: 17px; font-weight: 600; }
  #hd .pied { text-align: center; font-size: 13px; font-weight: 600; color: var(--doux); padding: 16px 0 4px; margin-top: auto; }
  #hd .onglets-bas.un { grid-template-columns: 1fr; }
  #hd .hos { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: #1f4f8a; border-radius: 6px; padding: 1px 6px; }
  #hd .attente { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; color: #fff; font-size: 18px; font-weight: 700; }
  #hd button:focus-visible, #hd input:focus-visible, #hd textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
<div class="entete"><img alt="Bonneville" src="https://ericgloutnez.github.io/LFS/logo-bonneville.png"><b>Heures &amp; Dépenses</b></div>

  <button type="button" data-e="depenses"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Dépenses</button>

<script>
(function () {
  'use strict';
  var VERSION = '1.2.0';
  var B = window.Bonneville;
  var api = null, G = null, moi = '', monNom = '', droits = {}, pret = false;
  var heures = [], depenses = [];
  var periode = null, semaine = 1, ecran = 'heures', edition = null, message = null, photo = null, occupe = false;

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lire(c) { try { var v = localStorage.getItem(c); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function ecrire(c, v) { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} }
  function aujour() { return B.jourIso(); }
  function argent(n) { return B.argent(n); }
  function montantDe(t) { var n = parseFloat(String(t || '').replace(/\s|\$/g, '').replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; }
  function dire(t, erreur) { message = { t: String(t).replace(/\.\.$/, '.'), e: !!erreur }; rendre(); }

  // ---------- Règles de saisie
  // Les entrées de la période en cours restent modifiables. Celles d'une période terminée sont fermées (le bureau peut corriger).
  function periodeCourante() { return B.periodeDe(aujour()); }
  function modifiable(date) { return date >= periodeCourante().debut; }
  function dansPeriode(l, p) { return l.filter(function (x) { return x.d.date >= p.debut && x.d.date <= p.fin; }); }
  function totalMinutes(l) { return l.reduce(function (s, x) { return s + B.minutesEntree(x.d); }, 0); }
  function totalArgent(l) { return l.reduce(function (s, x) { return s + (Number(x.d.montant) || 0); }, 0); }
  function trier(l) { return l.sort(function (a, b) { return (a.d.date + a.d.debut).localeCompare(b.d.date + b.d.debut); }); }

  // ---------- Chargement
  function cache() { ecrire('hd-drive-' + moi, { heures: heures.filter(function (x) { return !x.d.hos; }), depenses: depenses, droits: droits, nom: monNom }); }
  // ---------- Heures automatiques (HOS) : lues dans Geotab, l'employé peut ajuster le début et la fin
  var monId = '', ajusts = [], hosPlage = '';
  function chargerHos() {
    if (!droits.hos || !monId || !periode) { return; }
    var p = periode, cle = p.debut + p.fin; hosPlage = cle;
    B.heuresHos(G, [{ id: monId, user: moi, nom: monNom }], p.debut, p.fin, ajusts).then(function (l) {
      if (hosPlage !== cle) { return; }
      heures = trier(heures.filter(function (x) { return !x.d.hos; }).concat(l)); rendre();
    });
  }
  function charger() {
    return G.session().then(function (s) {
      moi = s.userName || '';
      var c = lire('hd-drive-' + moi);
      if (c) { heures = c.heures || []; depenses = c.depenses || []; droits = c.droits || {}; monNom = c.nom || ''; pret = true; rendre(); }
      return Promise.all([
        G.lireChamp('employe', 'user', moi),
        G.lireChamp('heure', 'user', moi),
        G.lireChamp('depense', 'user', moi),
        G.appel('Get', { typeName: 'User', search: { name: moi } }).catch(function () { return []; }),
        G.lireChamp('ajusthos', 'user', moi).catch(function () { return []; })
      ]);
    }).then(function (r) {
      var e = r[0][0]; droits = e ? (e.details.droits || {}) : {};
      heures = trier(r[1].map(function (l) { return { id: l.id, d: l.details }; }));
      depenses = trier(r[2].map(function (l) { return { id: l.id, d: l.details }; }));
      var u = r[3] && r[3][0]; monNom = u ? ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || moi : (monNom || moi);
      monId = u ? u.id : ''; ajusts = (r[4] || []).map(function (l) { return { id: l.id, d: l.details }; });
      pret = true; cache(); rendre(); chargerHos();
    }).catch(function (e) { pret = true; if (!heures.length && !depenses.length) { dire('Lecture impossible : ' + (e && e.message ? e.message : e) + '. Vérifie le réseau.', true); } else { rendre(); } });
  }

  // ---------- Rendu
  function blocPeriode() {
    var p = periode, cour = periodeCourante();
    var hP = dansPeriode(heures, p), s1 = hP.filter(function (x) { return x.d.date <= p.s1.fin; }), s2 = hP.filter(function (x) { return x.d.date >= p.s2.debut; });
    var html = '<section class="periode' + (ecran === 'depenses' ? ' claire' : '') + '"><div class="haut"><button type="button" class="fleche" data-a="periode" data-v="-1" aria-label="Période précédente">‹</button>'
      + '<span class="titre">Période ' + h(B.libellePeriode(p)) + (p.n === cour.n ? '<br><span class="encours">Période en cours</span>' : '') + '</span>'
