<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonneville - Heures &amp; Dépenses (Drive)</title>
<script src="https://ericgloutnez.github.io/LFS/heures/heures-commun.js?v=1.2.7"></script>

<body style="margin:0">
<div id="hd" data-theme="jour">
<style>
  #hd { --encre: #14191e; --doux: #4f5963; --ligne: #d3d8dd; --fond: #eef0f2; --surface: #ffffff; --bande: #e3e6e9; --accent: #f2a900; --ok: #1b7f3b; --non: #b42318; --noir: #14191e; --champ: #ffffff;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--encre); background: var(--fond); min-height: 100vh; -webkit-text-size-adjust: 100%; padding-bottom: 86px; }
  #hd[data-theme="nuit"] { --encre: #eef1f4; --doux: #a9b3bd; --ligne: #3a434c; --fond: #0f1317; --surface: #1b2127; --bande: #262e36; --noir: #000000; --champ: #12171c; }
  #hd * { box-sizing: border-box; }
  #hd .entete { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--ligne); }
  #hd .entete img { height: 18px; } #hd .entete b { font-size: 17px; }
  #hd { display: flex; flex-direction: column; box-sizing: border-box; }
  #hd main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin: 0 auto; width: 100%; flex: 1; }
  #hd h2 { margin: 0; font-size: 22px; }
  #hd .aide { font-size: 14px; color: var(--doux); }
  #hd .carte { background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #hd .periode { background: var(--noir); color: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  #hd .periode .haut { display: flex; align-items: center; gap: 8px; }
  #hd .periode .titre { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
  #hd .fleche { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3a434c; background: transparent; color: #fff; font-size: 22px; cursor: pointer; }
  #hd .fleche:disabled { opacity: .3; }
  #hd .totaux { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #hd .totaux div { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; box-shadow: inset 3px 0 0 var(--accent); }
  #hd .totaux b { font-size: 20px; } #hd .totaux span { font-size: 12px; color: #c4ccd4; font-weight: 600; }
  #hd .periode .encours { font-size: 13px; color: #c4ccd4; }
  /* Dépenses : bloc de période clair */
  #hd .periode.claire { background: var(--surface); color: var(--encre); border: 1px solid var(--ligne); }
  #hd .periode.claire .fleche { border-color: var(--ligne); color: var(--encre); }
  #hd .periode.claire .totaux span, #hd .periode.claire .encours { color: var(--doux); }
  #hd .bascule { display: grid; grid-template-columns: 1fr 1fr; background: var(--bande); border-radius: 12px; padding: 4px; gap: 4px; }
  #hd .bascule button { min-height: 52px; border: 0; border-radius: 9px; background: transparent; color: var(--doux); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #hd .bascule button small { font-size: 12px; font-weight: 600; }
  #hd .bascule button.on { background: var(--surface); color: var(--encre); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #hd .jour { display: flex; flex-direction: column; gap: 6px; }
  #hd .jour-titre { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--doux); padding: 0 4px; }
  #hd .jour-titre.auj { color: var(--encre); }
  #hd .ligne { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font: inherit; color: var(--encre); }
  #hd button.ligne { cursor: pointer; }
  #hd .ligne .txt { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  #hd .ligne .t { font-weight: 700; font-size: 16px; }
  #hd .ligne .s { font-size: 14px; color: var(--doux); overflow-wrap: anywhere; }
  #hd .ligne .v { font-weight: 800; font-size: 17px; white-space: nowrap; }
  #hd .vide { font-size: 14px; color: var(--doux); padding: 4px 4px 0; }
  #hd .btn { min-height: 54px; border-radius: 12px; border: 1px solid var(--ligne); background: var(--surface); color: var(--encre); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0 16px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  #hd .btn.jaune { background: var(--accent); border-color: var(--accent); color: #14191e; }
  #hd .btn.rouge { color: var(--non); border-color: var(--non); background: transparent; }
  #hd .btn:disabled { opacity: .5; cursor: default; }
  #hd .rangee { display: flex; gap: 10px; }
  #hd label.champ { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: var(--doux); }
  #hd input, #hd textarea { font: inherit; font-size: 18px; color: var(--encre); background: var(--champ); border: 2px solid var(--ligne); border-radius: 12px; padding: 12px; width: 100%; min-height: 54px; }
  #hd textarea { min-height: 96px; resize: vertical; }
  #hd input:focus, #hd textarea:focus { outline: none; border-color: var(--accent); }
  /* iPhone : les champs de date et d'heure gardent leur largeur naturelle et débordent sans ces règles */
  #hd input, #hd textarea { display: block; max-width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; }
  #hd input[type="date"], #hd input[type="time"] { text-align: left; line-height: 1.3; }
  #hd input::-webkit-date-and-time-value { text-align: left; }
  #hd label.champ { min-width: 0; }
  #hd .rangee > * { flex: 1 1 0; min-width: 0; }
  #hd main > h2 { margin-top: 4px; }
  #hd .duree { font-size: 26px; font-weight: 800; }
  #hd .message { border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; background: #e7f4ec; color: #14532d; }
  #hd .message.erreur { background: #fde8e7; color: #7a1a12; }
  /* Formulaires compacts, sans barre de défilement */
  #hd.formulaire main { gap: 8px; padding-top: 10px; padding-bottom: 6px; }
  #hd.formulaire h2 { font-size: 20px; }
  #hd.formulaire .carte { padding: 12px; gap: 8px; }
  #hd.formulaire label.champ { gap: 4px; }
  #hd.formulaire input { min-height: 48px; padding: 10px 12px; }
  #hd.formulaire textarea { min-height: 64px; height: 64px; padding: 10px 12px; }
  #hd.formulaire .carte b { font-size: 15px; }
  #hd.formulaire .rangee label.btn { font-size: 15px; min-height: 48px; text-align: center; }
  #hd.formulaire .btn { min-height: 50px; }
  #hd.formulaire .duree { font-size: 22px; }
  #hd.formulaire .photo { max-height: 140px; }
  #hd, #hd * { scrollbar-width: none; } #hd::-webkit-scrollbar, #hd *::-webkit-scrollbar { display: none; }
  #hd .photo { width: 100%; max-height: 360px; object-fit: contain; border-radius: 12px; background: var(--bande); }
  #hd .fichier { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #hd .onglets-bas { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--ligne); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
  #hd .onglets-bas button { min-height: 66px; border: 0; background: transparent; color: var(--doux); font: inherit; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; border-top: 3px solid transparent; }
  #hd .onglets-bas button.on { color: var(--encre); border-top-color: var(--accent); }
  #hd .refus { border: 3px solid var(--non); text-align: center; } #hd .refus h2 { color: var(--non); font-size: 26px; } #hd .refus div { font-size: 17px; font-weight: 600; }
  #hd .pied { text-align: center; font-size: 13px; font-weight: 600; color: var(--doux); padding: 16px 0 4px; margin-top: auto; }
  #hd .onglets-bas.un { grid-template-columns: 1fr; }
  #hd .hos { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: #1f4f8a; border-radius: 6px; padding: 1px 6px; }
  #hd .hos.rouge { background: var(--non); }
  #hd .sous-totaux { font-size: 13px; color: #c4ccd4; font-weight: 600; }
  #hd .extras-jour { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 2px 4px; }
  #hd .ext { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  #hd .mini { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--ligne); background: var(--surface); color: var(--encre); font-size: 20px; font-weight: 800; cursor: pointer; }
  #hd .mini:disabled { opacity: .35; }
  #hd .convoi { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--ligne); background: var(--surface); color: var(--encre); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  #hd .convoi.on { border-color: var(--ok); background: #e7f4ec; color: #14532d; }
  #hd .primes-jour { font-size: 13px; font-weight: 700; color: var(--ok); padding: 0 4px; }
  #hd .gp { color: #9a5b00; font-weight: 700; }
  #hd .case-gp { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  #hd .case-gp input[type="checkbox"] { -webkit-appearance: checkbox; appearance: auto; width: 24px; height: 24px; min-height: 0; padding: 0; flex: 0 0 auto; accent-color: #1b7f3b; }
  #hd .message.verrou { background: #e7f4ec; color: #14532d; }
  #hd .carte.total { gap: 6px; }
  #hd .carte.total .tt { font-size: 15px; }
  #hd .carte.total.fort { border: 2px solid var(--encre); }
  #hd .tl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; }
  #hd .tl small { color: var(--doux); font-size: 13px; }
  #hd .tl.somme { border-top: 1px solid var(--ligne); padding-top: 6px; font-size: 16px; }
  #hd .tl.somme b { color: var(--ok); }
  #hd .carte.soumettre { border: 2px solid var(--accent); }
  #hd .btn:disabled { opacity: .45; }
  #hd .attente { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; color: #fff; font-size: 18px; font-weight: 700; }
  #hd button:focus-visible, #hd input:focus-visible, #hd textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
<div class="entete"><img alt="Bonneville" src="https://ericgloutnez.github.io/LFS/logo-bonneville.png"><b>Heures &amp; Dépenses</b></div>
<main id="hd-ecran"><div class="aide">Chargement…</div></main>
<nav class="onglets-bas" id="hd-onglets" aria-label="Sections">
  <button type="button" data-e="heures" class="on"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Heures</button>
  <button type="button" data-e="depenses"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Dépenses</button>
</nav>
</div>

<script>
(function () {
  'use strict';
  var VERSION = '1.2.7';
  var B = window.Bonneville;
  var api = null, G = null, moi = '', monNom = '', droits = {}, pret = false;
  var heures = [], depenses = [];
  var periode = null, semaine = 1, ecran = 'heures', edition = null, message = null, photo = null, occupe = false;

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lire(c) { try { var v = localStorage.getItem(c); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function ecrire(c, v) { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} }
  function aujour() { return B.jourIso(); }
  function argent(n) { return B.argent(n); }
  function montantDe(t) { var n = parseFloat(String(t || '').replace(/\s|\$/g, '').replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; }
  function dire(t, erreur) { message = { t: String(t).replace(/\.\.$/, '.'), e: !!erreur }; rendre(); }

  // ---------- Règles de saisie
  // Les entrées de la période en cours restent modifiables. Celles d'une période terminée sont fermées (le bureau peut corriger).
  // Cycle de paye de l'employé : aux 2 semaines (jeudi au mercredi) ou hebdomadaire (dimanche au samedi)
  var cycle = '2sem', paramCourant = null, joursRec = [], soumissions = [], ficheRec = null;
  function periodeCourante() { return B.periodeCycle(aujour(), cycle); }
  function soumissionDe(p) { return soumissions.filter(function (x) { return x.d.debut === p.debut; })[0] || null; }
  function verrouillee(p) { var x = soumissionDe(p); return !!(x && x.d.statut === 'soumise'); }
  // Modifiable : période en cours, pas encore soumise
  function modifiable(date) { return date >= periodeCourante().debut && !verrouillee(B.periodeCycle(date, cycle)); }
  function jourDe(j) { return joursRec.filter(function (x) { return x.d.date === j; })[0] || null; }
  function calcul(j) { return B.calculJour(heures.filter(function (x) { return x.d.date === j; }), jourDe(j) ? jourDe(j).d : null, droits, paramCourant); }
  function calculPeriode(p) {
    var l = [], d = p.debut;
    while (d <= p.fin) { l.push(calcul(d)); d = B.ajouterJours(d, 1); }
    return B.sommeJours(l);
  }
  function aDesPrimes() { return !!(droits.km || droits.repas || droits.installation || droits.escorte); }
  function quand(iso) { var d = new Date(iso); return d.getDate() + ' ' + B.MOIS[d.getMonth()] + ' à ' + d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); }
  function dansPeriode(l, p) { return l.filter(function (x) { return x.d.date >= p.debut && x.d.date <= p.fin; }); }
  function totalMinutes(l) { return l.reduce(function (s, x) { return s + B.minutesEntree(x.d); }, 0); }
  function totalArgent(l) { return l.reduce(function (s, x) { return s + (Number(x.d.montant) || 0); }, 0); }
  function trier(l) { return l.sort(function (a, b) { return (a.d.date + a.d.debut).localeCompare(b.d.date + b.d.debut); }); }

  // ---------- Chargement
  function cache() { ecrire('hd-drive-' + moi, { heures: heures.filter(function (x) { return !x.d.hos; }), depenses: depenses, droits: droits, nom: monNom }); }
  // ---------- Heures automatiques (HOS) : lues dans Geotab, l'employé peut ajuster le début et la fin
  var monId = '', ajusts = [], hosPlage = '';
  // Les heures HOS ne s'affichent pas dans Drive : l'employé saisit ses heures (le bureau compare avec les HOS)
  function chargerHos() {
    return;
    var p = periode, cle = p.debut + p.fin; hosPlage = cle;
    B.heuresHos(G, [{ id: monId, user: moi, nom: monNom }], p.debut, p.fin, ajusts).then(function (l) {
      if (hosPlage !== cle) { return; }
      heures = trier(heures.filter(function (x) { return !x.d.hos; }).concat(l)); rendre();
    });
  }
  function charger() {
    return G.session().then(function (s) {
      moi = s.userName || '';
      var c = lire('hd-drive-' + moi);
      if (c) { heures = c.heures || []; depenses = c.depenses || []; droits = c.droits || {}; monNom = c.nom || ''; pret = true; rendre(); }
      return Promise.all([
        G.lireChamp('employe', 'user', moi),
        G.lireChamp('heure', 'user', moi),
        G.lireChamp('depense', 'user', moi),
        G.appel('Get', { typeName: 'User', search: { name: moi } }).catch(function () { return []; }),
        G.lireChamp('ajusthos', 'user', moi).catch(function () { return []; }),
        G.lireType('parametres').catch(function () { return []; }),
        G.lireChamp('jour', 'user', moi).catch(function () { return []; }),
        G.lireChamp('soumission', 'user', moi).catch(function () { return []; }),
        G.lireChamp('fiche', 'user', moi).catch(function () { return []; })
      ]);
    }).then(function (r) {
      var e = r[0][0]; droits = e ? (e.details.droits || {}) : {};
      var nouveauCycle = B.cycleDe(e ? e.details : null); if (nouveauCycle !== cycle) { cycle = nouveauCycle; periode = null; }
      var lst = function (l) { return (l || []).map(function (x) { return { id: x.id, d: x.details }; }); };
      paramCourant = r[5] && r[5][0] ? r[5][0].details : null; joursRec = lst(r[6]); soumissions = lst(r[7]);
      ficheRec = r[8] && r[8][0] ? { id: r[8][0].id, d: r[8][0].details } : null;
      heures = trier(r[1].map(function (l) { return { id: l.id, d: l.details }; }));
      depenses = trier(r[2].map(function (l) { return { id: l.id, d: l.details }; }));
      var u = r[3] && r[3][0]; monNom = u ? ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || moi : (monNom || moi);
      monId = u ? u.id : ''; ajusts = (r[4] || []).map(function (l) { return { id: l.id, d: l.details }; });
      if (ficheRec && ficheRec.d.nom) { monNom = ficheRec.d.nom; }
      pret = true; cache(); rendre(); chargerHos();
    }).catch(function (e) { pret = true; if (!heures.length && !depenses.length) { dire('Lecture impossible : ' + (e && e.message ? e.message : e) + '. Vérifie le réseau.', true); } else { rendre(); } });
  }

  // ---------- Rendu
  function blocPeriode() {
    var p = periode, cour = periodeCourante();
    var hP = dansPeriode(heures, p);
    var titre = p.hebdo ? 'Semaine du ' + B.libelleSemaine(p.s1) : 'Période ' + B.libellePeriode(p);
    var html = '<section class="periode' + (ecran === 'depenses' ? ' claire' : '') + '"><div class="haut"><button type="button" class="fleche" data-a="periode" data-v="-1" aria-label="Période précédente">‹</button>'
      + '<span class="titre">' + h(titre) + (p.n === cour.n ? '<br><span class="encours">' + (p.hebdo ? 'Semaine en cours' : 'Période en cours') + '</span>' : '') + '</span>'
      + '<button type="button" class="fleche" data-a="periode" data-v="1" aria-label="Période suivante"' + (p.n >= cour.n ? ' disabled' : '') + '>›</button></div>';
    if (ecran === 'heures') {
      var cp = calculPeriode(p);
      if (p.hebdo) {
        html += '<div class="totaux"><div><b>' + B.duree(totalMinutes(hP)) + '</b><span>Total</span></div><div><b>' + (cp.paye !== cp.reel ? B.duree(cp.paye) : Object.keys(hP.reduce(function (o, x) { o[x.d.date] = 1; return o; }, {})).length) + '</b><span>' + (cp.paye !== cp.reel ? 'Payées' : 'Jours') + '</span></div>' + (aDesPrimes() ? '<div><b>' + argent(cp.primes) + '</b><span>Primes</span></div>' : '') + '</div>';
      } else {
        var s1 = hP.filter(function (x) { return x.d.date <= p.s1.fin; }), s2 = hP.filter(function (x) { return x.d.date >= p.s2.debut; });
        html += '<div class="totaux"><div><b>' + B.duree(totalMinutes(s1)) + '</b><span>Semaine 1</span></div><div><b>' + B.duree(totalMinutes(s2)) + '</b><span>Semaine 2</span></div><div><b>' + B.duree(totalMinutes(hP)) + '</b><span>Total</span></div></div>';
        if (aDesPrimes() || cp.paye !== cp.reel) { html += '<div class="sous-totaux">' + (cp.paye !== cp.reel ? 'Heures payées ' + B.duree(cp.paye) + ' · ' : '') + (aDesPrimes() ? 'Primes ' + argent(cp.primes) : '') + '</div>'; }
      }
    } else {
      var dP = dansPeriode(depenses, p);
      html += '<div class="totaux"><div><b>' + argent(totalArgent(dP)) + '</b><span>Total</span></div><div><b>' + dP.length + '</b><span>dépense' + (dP.length > 1 ? 's' : '') + '</span></div></div>';
    }
    return html + '</section>';
  }
  function vueHeures() {
    var p = periode, s = p.hebdo || semaine === 1 ? p.s1 : p.s2, html = blocPeriode(), so = soumissionDe(p);
    if (verrouillee(p)) { html += '<div class="message verrou">✓ Feuille de temps soumise le ' + h(quand(so.d.soumisLe)) + '. Elle est verrouillée : pour une correction, appelle le bureau.</div>'; }
    if (!p.hebdo) {
      html += '<div class="bascule" role="group" aria-label="Semaine">'
        + '<button type="button" data-a="semaine" data-v="1"' + (semaine === 1 ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>Semaine 1<small>' + h(B.libelleSemaine(p.s1)) + '</small></button>'
        + '<button type="button" data-a="semaine" data-v="2"' + (semaine === 2 ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>Semaine 2<small>' + h(B.libelleSemaine(p.s2)) + '</small></button></div>';
    }

    if (!modifiable(j)) { return; }
    var jr = jourDe(j), n = jr ? JSON.parse(JSON.stringify(jr.d)) : { type: 'jour', user: moi, date: j };
    changer(n); n.taux = n.taux || B.figer(paramCourant); n.majLe = new Date().toISOString();
    occupe = 'Enregistrement…'; rendre();
    G.enregistrer(jr, n).then(function (id) {
      joursRec = joursRec.filter(function (x) { return x.id !== id; }).concat([{ id: id, d: n }]);
      occupe = false; rendre();
    }).catch(function (e) { occupe = false; dire('Enregistrement impossible : ' + (e && e.message ? e.message : e), true); });
  }
  // Soumission de la feuille de temps : horodatée, puis la période se verrouille
  function soumettre() {
    var p = periode, cp = calculPeriode(p), hP = dansPeriode(heures, p);
    var txt = 'Soumettre ta feuille de temps ' + (p.hebdo ? 'de la semaine du ' + B.libelleSemaine(p.s1) : 'de la période ' + B.libellePeriode(p)) + ' ?\n\n'
      + 'Heures : ' + B.duree(totalMinutes(hP)) + (cp.paye !== cp.reel ? ' (payées : ' + B.duree(cp.paye) + ')' : '') + (aDesPrimes() ? '\nPrimes : ' + argent(cp.primes) : '')
      + '\n\nUne fois soumise, tu ne pourras plus la modifier.';
    if ($('ts-ok') && !$('ts-ok').checked) { return; }
    var so = soumissionDe(p), n = so ? JSON.parse(JSON.stringify(so.d)) : { type: 'soumission', user: moi };
    n.debut = p.debut; n.fin = p.fin; n.cycle = cycle; n.statut = 'soumise'; n.soumisLe = new Date().toISOString(); n.minutes = totalMinutes(hP); n.payees = cp.paye; n.primes = cp.primes;
    occupe = 'Soumission…'; rendre();
    G.enregistrer(so, n).then(function (id) {
      soumissions = soumissions.filter(function (x) { return x.id !== id; }).concat([{ id: id, d: n }]);
      occupe = false; ecran = 'heures'; dire('Feuille de temps soumise le ' + quand(n.soumisLe) + '. Merci !');
    }).catch(function (e) { occupe = false; dire('Soumission impossible : ' + (e && e.message ? e.message : e) + '. Vérifie le réseau et réessaie.', true); });
  }
  // ---------- Total préliminaire de la paye : heures et primes par semaine, puis soumission de la feuille de temps
  function sommePlage(debut, fin) {
    var l = [], d = debut;
    while (d <= fin) { l.push(calcul(d)); d = B.ajouterJours(d, 1); }
    return B.sommeJours(l);
  }
  function lignesPrimes(c) {
    var l = [];
    if (droits.km) { l.push(['Kilométrage', c.km + ' km', c.kmMontant]); }
    if (droits.repas) { l.push(['Primes de repas', '', c.repas]); }
    if (droits.installation) { l.push(['Modules installés', c.modules + ' module' + (c.modules > 1 ? 's' : ''), c.modulesMontant]); }
    if (droits.escorte) { l.push(['Convoi routier', '', c.convoi]); }
    return l;
  }
  function blocTotal(titre, c, fort) {
    var l = lignesPrimes(c);
    return '<section class="carte total' + (fort ? ' fort' : '') + '"><b class="tt">' + h(titre) + '</b>'
      + '<div class="tl"><span>Heures travaillées</span><b>' + B.duree(c.reel) + '</b></div>'
      + (c.paye !== c.reel ? '<div class="tl"><span>Heures payées <small>(grand projet en double)</small></span><b>' + B.duree(c.paye) + '</b></div>' : '')
      + l.map(function (x) { return '<div class="tl"><span>' + h(x[0]) + (x[1] ? ' <small>' + h(x[1]) + '</small>' : '') + '</span><b>' + argent(x[2]) + '</b></div>'; }).join('')
      + (l.length ? '<div class="tl somme"><span>Total des primes</span><b>' + argent(c.primes) + '</b></div>' : '')
      + '</section>';
  }
  function vueTotal() {
    var p = periode, so = soumissionDe(p), html = '<h2>Total préliminaire</h2>'
      + '<div class="aide">' + h(p.hebdo ? 'Semaine du ' + B.libelleSemaine(p.s1) : 'Période ' + B.libellePeriode(p)) + ' · montants avant la validation du bureau</div>';
    if (p.hebdo) { html += blocTotal('Semaine du ' + B.libelleSemaine(p.s1), sommePlage(p.s1.debut, p.s1.fin), true); }
    else {
      html += blocTotal('Semaine 1 · ' + B.libelleSemaine(p.s1), sommePlage(p.s1.debut, p.s1.fin), false)
        + blocTotal('Semaine 2 · ' + B.libelleSemaine(p.s2), sommePlage(p.s2.debut, p.s2.fin), false)
        + blocTotal('Total de la période', sommePlage(p.debut, p.fin), true);
    }
    if (droits.depenses) {
      var dP = dansPeriode(depenses, p);
      html += '<section class="carte total"><div class="tl"><span>Dépenses à rembourser <small>' + dP.length + ' reçu' + (dP.length > 1 ? 's' : '') + '</small></span><b>' + argent(totalArgent(dP)) + '</b></div></section>';
    }
    if (verrouillee(p)) {
      html += '<div class="message verrou">✓ Feuille de temps soumise le ' + h(quand(so.d.soumisLe)) + '. Elle est verrouillée : pour une correction, appelle le bureau.</div>';
    } else if (p.debut <= aujour()) {
      html += '<section class="carte soumettre"><label class="case-gp"><input type="checkbox" id="ts-ok"> Je confirme que mes heures sont complètes et exactes pour cette ' + (p.hebdo ? 'semaine' : 'période') + '.</label>'
        + '<div class="aide">Une fois soumise, ta feuille de temps est verrouillée. Seul le bureau peut la rouvrir.</div></section>'
        + '<button type="button" class="btn jaune" data-a="soumettre" id="ts-btn" disabled>Soumettre ma feuille de temps</button>'
        + (so && so.d.statut === 'rouverte' ? '<div class="aide">Le bureau a rouvert ta feuille le ' + h(quand(so.d.rouverteLe)) + '. Vérifie-la, puis soumets-la de nouveau.</div>' : '');
    }
    return html + '<div class="rangee"><button type="button" class="btn" data-a="retour">Retour à mes heures</button></div>';
  }
  function trouver(l, id) { var x = l.filter(function (y) { return y.id === id; })[0]; return x ? { id: x.id, d: JSON.parse(JSON.stringify(x.d)) } : null; }
  function aller(e) {
    message = null; edition = null; brouillon = null;
    if (photo) { URL.revokeObjectURL(photo.url); photo = null; }
    if (e === 'formHeure' || e === 'formDepense' || e === 'total') { ecran = e; }
    else { ecran = e === 'depenses' ? 'depenses' : 'heures'; }
    rendre(); window.scrollTo(0, 0);
  }

  // ---------- Événements
  function brancher() {
    $('hd-onglets').addEventListener('click', function (ev) { var b = ev.target.closest('[data-e]'); if (b) { aller(b.getAttribute('data-e')); } });
    $('hd-ecran').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-a]'); if (!b || occupe) { return; }
      var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), id = b.getAttribute('data-id');
      if (a === 'periode') { message = null; periode = B.periodeCycleVoisine(periode, Number(v)); semaine = periode.n === periodeCourante().n ? (periode.hebdo ? 1 : B.semaineDe(periode, aujour())) : 1; rendre(); chargerHos(); return; }
      if (a === 'semaine') { message = null; semaine = Number(v); rendre(); return; }
      if (a === 'nouvelleHeure') { aller('formHeure'); return; }
      if (a === 'nouvelleDepense') { aller('formDepense'); return; }
      if (a === 'modifierHeure') { aller('formHeure'); edition = trouver(heures, id); rendre(); return; }
      if (a === 'modifierDepense') { aller('formDepense'); edition = trouver(depenses, id); rendre(); return; }
      if (a === 'retour') { var garde = periode; aller(ecran === 'formDepense' ? 'depenses' : 'heures'); periode = garde; rendre(); return; }
      if (a === 'sauverHeure') { sauverHeure(); return; }
      if (a === 'sauverHos') { sauverHos(); return; }
      if (a === 'modules') { sauverJour(b.getAttribute('data-j'), function (n) { n.modules = Math.max(0, (Number(n.modules) || 0) + Number(v)); }); return; }
      if (a === 'convoi') { sauverJour(b.getAttribute('data-j'), function (n) { n.convoi = !n.convoi; }); return; }
      if (a === 'soumettre') { soumettre(); return; }
      if (a === 'voirTotal') { aller('total'); return; }
      if (a === 'retourHos') { retourHos(); return; }
      if (a === 'supprimerHeure') { supprimerHeure(); return; }
      if (a === 'sauverDepense') { sauverDepense(); return; }
      if (a === 'supprimerDepense') { supprimerDepense(); return; }
    });
  }

  // ---------- Lien avec l'accueil (heures-drive.html)
  window.BonnevilleModule = {
    aller: function (e) { aller(e); },
    theme: function (t) { $('hd').setAttribute('data-theme', t === 'nuit' ? 'nuit' : 'jour'); },
    etat: function () {
      if (!B) { return {}; }
      var p = periodeCourante(), hP = dansPeriode(heures, p), dP = dansPeriode(depenses, p);
      return {
        pret: pret, acces: B.aAcces(droits), heures: !!droits.heures, depensesOk: !!droits.depenses, periode: B.libellePeriode(p),
        s1: totalMinutes(hP.filter(function (x) { return x.d.date <= p.s1.fin; })), s2: p.s2 ? totalMinutes(hP.filter(function (x) { return x.d.date >= p.s2.debut; })) : 0, hebdo: !!p.hebdo,
        total: totalMinutes(hP), aujourdhui: totalMinutes(heures.filter(function (x) { return x.d.date === aujour(); })),
        depenses: totalArgent(dP), nbDepenses: dP.length, semaine: p.hebdo ? 1 : B.semaineDe(p, aujour())
      };
    }
  };

  var branche = false;
  var fabrique = function () {
    return {
      initialize: function (a, s, callback) {
        api = a; B = window.Bonneville; G = B.creerApi(api);
        if (!branche) { brancher(); branche = true; }
        charger(); callback();
      },
      focus: function (a) { api = a; if (G && pret) { charger(); } },
      blur: function () {}
    };
  };
  var cibles = [];
  try { if (typeof geotab !== 'undefined' && geotab && geotab.addin) { cibles.push(geotab.addin); } } catch (e) {}
  window.geotab = window.geotab || {}; window.geotab.addin = window.geotab.addin || {};
  if (cibles.indexOf(window.geotab.addin) < 0) { cibles.push(window.geotab.addin); }
  ['tempoDrive', 'tempo-drive', 'TempoDrive', 'tempodrive', 'bonnevilleTempo'].forEach(function (n) { cibles.forEach(function (c) { try { c[n] = fabrique; } catch (e) {} }); });
})();
</script>
