<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LFS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
geotab.addin.lfs = function () {
  var ORS = 'https://api.heigit.org';
  var carte = null, radarPluie = null, radarNeige = null, coucheActifs = null, coucheTrajet = null, minuterie = null;
  var points = { depart: null, arrivee: null };
  var dernierResultat = null;

  function trouver(id) { return document.getElementById(id); }

  function lire(cle, defaut) {
    try { var v = localStorage.getItem('it511-' + cle); return v === null ? defaut : v; } catch (e) { return defaut; }
  }
  function ecrire(cle, valeur) {
    try { localStorage.setItem('it511-' + cle, valeur); } catch (e) {}
  }

  function chargerStyleLeaflet() {
    if (!trouver('it511-leaflet-css')) {
      var lien = document.createElement('link');
      lien.id = 'it511-leaflet-css';
      lien.rel = 'stylesheet';
      lien.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
      document.head.appendChild(lien);
    }
  }

  function statut(texte) { var el = trouver('it511-statut'); if (el) { el.textContent = texte; } }
  function message(texte, erreur) {
    var el = trouver('it511-message');
    el.textContent = texte || '';
    el.style.display = texte ? 'block' : 'none';
    el.style.background = erreur ? '#fdecea' : '#e8f1fb';
    el.style.color = erreur ? '#8a1c1c' : '#0c447c';
  }

  function nombreFr(n, dec) {
    return n.toLocaleString('fr-CA', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

    function creerCarte() {
    var conteneur = trouver('it511-carte');
    carte = L.map(conteneur).setView([46.2, -72.6], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; contributeurs OpenStreetMap'
    }).addTo(carte);

    var optionsRadar = { format: 'image/png', transparent: true, version: '1.3.0', opacity: 0.6,
      attribution: 'Radar : Environnement et Changement climatique Canada' };
    radarPluie = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', L.extend({ layers: 'RADAR_1KM_RRAI' }, optionsRadar));
    radarNeige = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', L.extend({ layers: 'RADAR_1KM_RSNO' }, optionsRadar));
    radarPluie.addTo(carte);

    coucheActifs = L.layerGroup().addTo(carte);
    coucheTrajet = L.layerGroup().addTo(carte);
    coucheEntraves = L.layerGroup().addTo(carte);
    coucheCameras = L.layerGroup();

    L.control.layers(null, {
      'Trajet': coucheTrajet,
      'Entraves 511': coucheEntraves,
      'Caméras 511': coucheCameras,
      'Radar - pluie': radarPluie,
      'Radar - neige': radarNeige,
      'Actifs Geotab': coucheActifs
    }, { collapsed: false }).addTo(carte);
  }

  function rafraichirRadar() {
    var t = Date.now();
    radarPluie.setParams({ _t: t });
    radarNeige.setParams({ _t: t });
  }

  function chargerActifs(api) {
    api.multiCall([
      ['Get', { typeName: 'Device', search: { fromDate: new Date().toISOString() } }],
      ['Get', { typeName: 'DeviceStatusInfo' }]
    ], function (resultats) {
      var noms = {};
      resultats[0].forEach(function (d) { noms[d.id] = d.name; });
      coucheActifs.clearLayers();
      var nombre = 0;
      resultats[1].forEach(function (s) {
        if (s.latitude && s.longitude && s.device && noms[s.device.id]) {
          var libelle = noms[s.device.id];
          if (s.speed) { libelle += ' - ' + Math.round(s.speed) + ' km/h'; }
          L.circleMarker([s.latitude, s.longitude], {
            radius: 7, color: '#ffffff', weight: 2, fillColor: '#1565c0', fillOpacity: 1
          }).bindTooltip(libelle).addTo(coucheActifs);
          nombre++;
        }
      });
      statut(nombre + ' actifs affichés - mis à jour à ' + new Date().toLocaleTimeString('fr-CA'));
    }, function (erreur) {
      statut('Geotab a refusé la lecture des actifs : ' + (erreur && erreur.message ? erreur.message : erreur));
    });
  }

    function brancherAdresse(champ) {
    var input = trouver('it511-' + champ), liste = trouver('it511-liste-' + champ), delai = null;

    input.addEventListener('input', function () {
      points[champ] = null;
      clearTimeout(delai);
      var texte = input.value.trim();
      if (texte.length < 4) { liste.style.display = 'none'; return; }
      delai = setTimeout(function () { suggerer(texte, liste, champ); }, 350);
    });
    input.addEventListener('blur', function () { setTimeout(function () { liste.style.display = 'none'; }, 250); });
  }

  function suggerer(texte, liste, champ) {
    var cle = lire('cle', '');
    if (!cle) { message('Entre d’abord ta clé OpenRouteService dans les paramètres.', true); return; }
    var url = ORS + '/pelias/v1/autocomplete?text=' + encodeURIComponent(texte) +
      '&boundary.country=CA&focus.point.lat=45.6&focus.point.lon=-73.2&size=6';
    fetch(url, { headers: { 'Authorization': cle } }).then(function (r) { return r.json(); }).then(function (data) {
      while (liste.firstChild) { liste.removeChild(liste.firstChild); }
      var res = (data && data.features) || [];
      if (!res.length) { liste.style.display = 'none'; return; }
      res.forEach(function (f) {
        var item = document.createElement('div');
        item.textContent = f.properties.label;
        item.style.cssText = 'padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #eef0f3;';
        item.addEventListener('mouseenter', function () { item.style.background = '#f0f4f9'; });
        item.addEventListener('mouseleave', function () { item.style.background = ''; });
        item.addEventListener('mousedown', function () {
          trouver('it511-' + champ).value = f.properties.label;
          points[champ] = { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: f.properties.label };
          liste.style.display = 'none';
        });
        liste.appendChild(item);
      });
      liste.style.display = 'block';
    }).catch(function () { liste.style.display = 'none'; });
  }

  function geocoder(texte) {
    var url = ORS + '/pelias/v1/search?text=' + encodeURIComponent(texte) + '&boundary.country=CA&size=1';
    return fetch(url, { headers: { 'Authorization': lire('cle', '') } }).then(function (r) { return r.json(); }).then(function (data) {
      if (!data.features || !data.features.length) { throw new Error('Adresse introuvable : ' + texte); }
      var f = data.features[0];
      return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: f.properties.label };
    });
  }

  function piedsEnMetres(texte) {
    var t = (texte || '').trim().toLowerCase().replace(/,/g, '.');
    if (!t) { return null; }
    var m = t.match(/^(\d+(?:\.\d+)?)\s*(?:'|’|pi|pieds?)?\s*(?:(\d+(?:\.\d+)?)\s*(?:"|”|''|po|pouces?)?)?$/);
    if (!m) { return null; }
    var pieds = parseFloat(m[1]) + (m[2] ? parseFloat(m[2]) / 12 : 0);
    if (isNaN(pieds) || pieds <= 0) { return null; }
    return pieds * 0.3048;
  }

  function lireDimension(id) {
    return piedsEnMetres(trouver(id).value);
  }

  function afficherConversion(id) {
    var m = piedsEnMetres(trouver(id).value);
    trouver(id + '-m').textContent = m ? '= ' + nombreFr(m, 2) + ' m' : '';
  }

  var nbEviteesCourant = 0;
  function optionsTrajet(h, w, depart, arrivee) {
    var o = { vehicle_type: 'hgv', profile_params: { restrictions: { height: h, width: w } } };
    var ev = polygonesAEviter(h, w, depart, arrivee);
    nbEviteesCourant = ev.nombre;
    if (ev.multi) { o.avoid_polygons = ev.multi; }
    return o;
  }

  function calculer() {
    message('');
    var cle = lire('cle', '');
    if (!cle) { message('Entre d’abord ta clé OpenRouteService dans les paramètres (en bas du panneau).', true); return; }
    var h = lireDimension('it511-hauteur'), w = lireDimension('it511-largeur');
    if (!h || !w) { message('Indique la hauteur et la largeur en pieds (ex. 15,5 ou 15\'6").', true); return; }
    if (!trouver('it511-depart').value.trim() || !trouver('it511-arrivee').value.trim()) { message('Indique une adresse de départ et d’arrivée.', true); return; }

    ecrire('hauteurPi', trouver('it511-hauteur').value);
    ecrire('largeurPi', trouver('it511-largeur').value);

    var bouton = trouver('it511-calculer');
    bouton.disabled = true; bouton.textContent = 'Calcul en cours...';

    chargerEntraves(false).then(function () { return Promise.all([
      points.depart ? Promise.resolve(points.depart) : geocoder(trouver('it511-depart').value.trim()),
      points.arrivee ? Promise.resolve(points.arrivee) : geocoder(trouver('it511-arrivee').value.trim())
    ]); }).then(function (p) {
      points.depart = p[0]; points.arrivee = p[1];
      return fetch(ORS + '/openrouteservice/v2/directions/driving-hgv/geojson', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': cle },
        body: JSON.stringify({
          coordinates: [[p[0].lon, p[0].lat], [p[1].lon, p[1].lat]],
          radiuses: [-1, -1],
          units: 'km',
          language: 'fr',
          instructions: true,
          options: optionsTrajet(h, w, p[0], p[1])
        })
      });
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, statut: r.status, data: data }; });
    }).then(function (rep) {
      if (!rep.ok) {
        var code = rep.data && rep.data.error && rep.data.error.code;
        if (rep.statut === 401 || rep.statut === 403) { throw new Error('La clé OpenRouteService est refusée. Vérifie-la dans les paramètres.'); }
        var detail = (rep.data && rep.data.error && rep.data.error.message) ? ' [code ' + code + ' : ' + rep.data.error.message + ']' : ' [code ' + code + ']';
        if (code === 2010) { throw new Error('Une des adresses est trop loin d’une route accessible aux camions.' + detail); }
        if (code === 2009) { throw new Error('Aucun trajet possible avec ces dimensions entre ces deux adresses.' + detail); }
        throw new Error('Le calcul a échoué (' + rep.statut + ') : ' + ((rep.data.error && rep.data.error.message) || 'erreur inconnue'));
      }
      afficherResultat(rep.data, h, w);
    }).catch(function (e) {
      message(e.message || String(e), true);
    }).then(function () {
      bouton.disabled = false; bouton.textContent = 'Calculer le trajet';
    });
  }

  function regrouperRoutes(steps) {
    var routes = [];
    steps.forEach(function (s) {
      if (s.type === 10) { return; }
      var nom = (s.name && s.name !== '-') ? s.name.trim() : '';
      var dernier = routes[routes.length - 1];
      if (!nom) {
        if (dernier) { dernier.km += s.distance; } else { routes.push({ nom: '(voie sans nom)', km: s.distance }); }
        return;
      }
      if (dernier && dernier.nom === nom) { dernier.km += s.distance; }
      else { routes.push({ nom: nom, km: s.distance }); }
    });
    return routes.filter(function (r) { return r.km >= 0.05 || routes.length === 1; });
  }

  function afficherResultat(geo, h, w) {
    var f = geo.features[0];
    var seg = f.properties.segments[0];
    var totalKm = f.properties.summary.distance;
    var duree = f.properties.summary.duration;
    var routes = regrouperRoutes(seg.steps || []);

    coucheTrajet.clearLayers();
    var trace = L.geoJSON(f, { style: { color: '#c2410c', weight: 5, opacity: 0.85 } }).addTo(coucheTrajet);
    L.circleMarker([points.depart.lat, points.depart.lon], { radius: 8, color: '#fff', weight: 2, fillColor: '#15803d', fillOpacity: 1 })
      .bindTooltip('Départ : ' + points.depart.label).addTo(coucheTrajet);
    L.circleMarker([points.arrivee.lat, points.arrivee.lon], { radius: 8, color: '#fff', weight: 2, fillColor: '#b91c1c', fillOpacity: 1 })
      .bindTooltip('Arrivée : ' + points.arrivee.label).addTo(coucheTrajet);
    carte.fitBounds(trace.getBounds(), { padding: [30, 30] });

    var heures = Math.floor(duree / 3600), minutes = Math.round((duree % 3600) / 60);
    trouver('it511-total').textContent = nombreFr(totalKm, 1) + ' km';
    trouver('it511-duree').textContent = heures + ' h ' + (minutes < 10 ? '0' : '') + minutes;

    var tableau = trouver('it511-routes');
    while (tableau.firstChild) { tableau.removeChild(tableau.firstChild); }
    routes.forEach(function (r) {
      var ligne = document.createElement('div');
      ligne.style.cssText = 'display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef0f3;font-size:13px;';
      var nom = document.createElement('span'); nom.textContent = r.nom;
      var km = document.createElement('span'); km.textContent = nombreFr(r.km, 1) + ' km'; km.style.color = '#5a6270'; km.style.whiteSpace = 'nowrap';
      ligne.appendChild(nom); ligne.appendChild(km);
      tableau.appendChild(ligne);
    });

    var enLigne = routes.map(function (r) { return r.nom; }).join(' - ') + ' (' + nombreFr(totalKm, 1) + ' km)';
    trouver('it511-enligne').textContent = enLigne;

    afficherEntravesTrajet(entravesSurTrajet(f.geometry.coordinates), nbEviteesCourant);
    dernierResultat = { routes: routes, totalKm: totalKm, enLigne: enLigne, hauteur: h, largeur: w };
    trouver('it511-resultat').style.display = 'block';
  }

  function copier(texte) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte).then(function () {
        message('Copié dans le presse-papiers.');
        setTimeout(function () { message(''); }, 2500);
      }, function () {
        message('La copie automatique est bloquée par le navigateur.', true);
      });
    } else {
      message('La copie automatique est bloquée par le navigateur.', true);
    }
  }

  var URL_QC = 'https://ws.mapserver.transports.gouv.qc.ca/swtq?service=wfs&version=2.0.0&request=getfeature&typename=ms:chantiers_mtmdet&srsname=EPSG:4326&outputformat=geojson';
  var URL_ON = 'https://511on.ca/api/v2/get/event?format=json&lang=fr&key=';
  var DEPART_DEFAUT = '601 Rue de l’Industrie, Beloeil, QC J3G 0S5';
  var entraves = [];
  var etatSources = { qc: 'chargement', on: 'chargement' };
  var coucheEntraves = null;
  var dernierChargementEntraves = 0;

  function nombre(texte) { return parseFloat(String(texte).replace(',', '.')); }

  function valeursMetres(texte, motCle) {
    var vals = [], m, reste = texte;
    var apres = new RegExp('(\\d+(?:[.,]\\d+)?)\\s*m\\S*\\s+de\\s+' + motCle, 'gi');
    while ((m = apres.exec(texte)) !== null) { vals.push(nombre(m[1])); }
    reste = texte.replace(/(\d+(?:[.,]\d+)?)\s*m\S*\s+de\s+[a-zéè]+/gi, ' ');
    var avant = new RegExp(motCle + '[^\\n]{0,60}?(\\d+(?:[.,]\\d+)?)\\s*m(?:è|e|\\b)', 'gi');
    while ((m = avant.exec(reste)) !== null) { vals.push(nombre(m[1])); }
    vals = vals.filter(function (v) { return v > 1.5 && v < 12; });
    return vals.length ? Math.min.apply(null, vals) : null;
  }

  function dateQc(texte) {
    if (!texte) { return null; }
    var d = new Date(texte.replace(/\//g, '-').replace(' ', 'T'));
    return isNaN(d.getTime()) ? null : d.getTime();
  }

  function normaliserQc(f) {
    var p = f.properties || {}, g = f.geometry;
    if (!g) { return null; }
    var lignes = g.type === 'LineString' ? [g.coordinates] : (g.type === 'MultiLineString' ? g.coordinates : (g.type === 'Point' ? [[g.coordinates]] : []));
    var maintenant = Date.now(), debut = dateQc(p.debut), fin = dateQc(p.fin);
    var texteDim = (p.entravesLieesAuxChargesEtDimensions || '') + String.fromCharCode(10) + (p.entrave || '');
    var direction = (p.direction || '').toLowerCase();
    var deuxSens = direction.indexOf(' et ') >= 0 || direction.indexOf('deux directions') >= 0;
    var fermeture = /(fermeture compl[eè]te|pont ferm[ée]|route ferm[ée]e|autoroute ferm[ée]e|tunnel ferm[ée]|rue ferm[ée]e)/i.test(p.entrave || '') && !/contresens/i.test(p.entrave || '');
    return {
      source: 'Québec',
      id: 'qc' + p.identifiant,
      titre: p.identificationDesTravaux || 'Travaux',
      lieu: p.localisation || '',
      detail: p.descriptionFrancais || '',
      lignes: lignes.map(function (l) { return l.map(function (c) { return [c[1], c[0]]; }); }),
      actif: (!debut || debut <= maintenant) && (!fin || fin >= maintenant),
      largeurMax: valeursMetres(texteDim, 'largeur'),
      hauteurMax: valeursMetres(texteDim, 'hauteur'),
      fermeture: fermeture && deuxSens,
      fermeturePartielle: fermeture && !deuxSens
    };
  }

  function decoderPolyligne(code) {
    var points = [], index = 0, lat = 0, lng = 0;
    while (index < code.length) {
      var b, decalage = 0, resultat = 0;
      do { b = code.charCodeAt(index++) - 63; resultat |= (b & 31) << decalage; decalage += 5; } while (b >= 32);
      lat += (resultat & 1) ? ~(resultat >> 1) : (resultat >> 1);
      decalage = 0; resultat = 0;
      do { b = code.charCodeAt(index++) - 63; resultat |= (b & 31) << decalage; decalage += 5; } while (b >= 32);
      lng += (resultat & 1) ? ~(resultat >> 1) : (resultat >> 1);
      points.push([lat / 1e5, lng / 1e5]);
    }
    return points;
  }

  function normaliserOn(e) {
    var ligne = [];
    if (e.EncodedPolyline) { try { ligne = decoderPolyligne(e.EncodedPolyline); } catch (x) { ligne = []; } }
    if (!ligne.length && e.Latitude && e.Longitude) {
      ligne = [[e.Latitude, e.Longitude]];
      if (e.LatitudeSecondary && e.LongitudeSecondary) { ligne.push([e.LatitudeSecondary, e.LongitudeSecondary]); }
    }
    if (!ligne.length) { return null; }
    var maintenant = Date.now() / 1000;
    var r = e.Restrictions || {};
    var dir = e.DirectionOfTravel || '';
    var deuxSens = /All Directions|Both Directions|Toutes|Deux/i.test(dir);
    return {
      source: 'Ontario',
      id: 'on' + e.ID,
      titre: (e.RoadwayName || 'Route') + (e.EventType ? ' (' + e.EventType + ')' : ''),
      lieu: dir,
      detail: [e.Description, e.Comment, e.Impact].filter(Boolean).join(String.fromCharCode(10)),
      lignes: [ligne],
      actif: (!e.StartDate || e.StartDate <= maintenant) && (!e.PlannedEndDate || e.PlannedEndDate >= maintenant),
      largeurMax: r.Width ? r.Width * 0.3048 : null,
      hauteurMax: r.Height ? r.Height * 0.3048 : null,
      fermeture: !!e.IsFullClosure && deuxSens,
      fermeturePartielle: !!e.IsFullClosure && !deuxSens
    };
  }

  function afficherEtatSources() {
    var t = { ok: 'chargées', erreur: 'indisponibles', chargement: 'chargement...', sanscle: 'clé 511 Ontario manquante' };
    var actives = entraves.filter(function (e) { return e.actif; }).length;
    var el = trouver('it511-sources');
    if (el) {
      el.textContent = 'Entraves : Québec ' + (t[etatSources.qc] || etatSources.qc) + ', Ontario ' + (t[etatSources.on] || etatSources.on) + ' - ' + actives + ' actives';
    }
  }

  function couleurEntrave(e) {
    if (e.fermeture) { return '#b91c1c'; }
    if (e.largeurMax || e.hauteurMax) { return '#d97706'; }
    return '#6b7280';
  }

  function dessinerEntraves() {
    coucheEntraves.clearLayers();
    entraves.forEach(function (e) {
      if (!e.actif) { return; }
      var texte = '<strong>' + echapper(e.titre) + '</strong><br>' + echapper(e.detail).split(String.fromCharCode(10)).join('<br>');
      e.lignes.forEach(function (l) {
        var objet = l.length > 1
          ? L.polyline(l, { color: couleurEntrave(e), weight: 6, opacity: 0.85 })
          : L.circleMarker(l[0], { radius: 6, color: '#fff', weight: 1, fillColor: couleurEntrave(e), fillOpacity: 1 });
        objet.bindPopup(texte, { maxWidth: 320 }).addTo(coucheEntraves);
      });
    });
  }

  function echapper(t) {
    var d = document.createElement('div');
    d.textContent = t || '';
    return d.textContent.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function chargerEntraves(forcer) {
    if (!forcer && Date.now() - dernierChargementEntraves < 15 * 60 * 1000 && entraves.length) { return Promise.resolve(); }
    dernierChargementEntraves = Date.now();
    etatSources.qc = 'chargement';
    var cleOn = lire('cle511on', '');
    etatSources.on = cleOn ? 'chargement' : 'sanscle';
    afficherEtatSources();

    var pQc = fetch(URL_QC).then(function (r) { return r.json(); }).then(function (data) {
      etatSources.qc = 'ok';
      return (data.features || []).map(normaliserQc).filter(Boolean);
    }).catch(function () { etatSources.qc = 'erreur'; return []; });

    var pOn = cleOn ? fetch(URL_ON + encodeURIComponent(cleOn)).then(function (r) { return r.json(); }).then(function (data) {
      etatSources.on = 'ok';
      return (Array.isArray(data) ? data : []).map(normaliserOn).filter(Boolean);
    }).catch(function () { etatSources.on = 'erreur'; return []; }) : Promise.resolve([]);

    return Promise.all([pQc, pOn]).then(function (r) {
      entraves = r[0].concat(r[1]);
      dessinerEntraves();
      afficherEtatSources();
    });
  }

  function bloquante(e, h, w) {
    if (!e.actif) { return false; }
    if (e.fermeture) { return true; }
    if (e.largeurMax && w > e.largeurMax) { return true; }
    if (e.hauteurMax && h > e.hauteurMax) { return true; }
    return false;
  }

  function dansZone(e, zone) {
    return e.lignes.some(function (l) {
      return l.some(function (p) { return p[0] >= zone.s && p[0] <= zone.n && p[1] >= zone.o && p[1] <= zone.e; });
    });
  }

  function rectangleCorridor(a, b, demiLargeurM) {
    var latMoy = (a[0] + b[0]) / 2;
    var mLat = 111320, mLon = 111320 * Math.cos(latMoy * Math.PI / 180);
    var dx = (b[1] - a[1]) * mLon, dy = (b[0] - a[0]) * mLat;
    var long = Math.sqrt(dx * dx + dy * dy);
    if (long < 1) { dx = 1; dy = 0; long = 1; }
    var ux = dx / long, uy = dy / long;
    var px = -uy * demiLargeurM, py = ux * demiLargeurM;
    var ex = ux * demiLargeurM, ey = uy * demiLargeurM;
    function pt(lat, lon, ox, oy) { return [lon + ox / mLon, lat + oy / mLat]; }
    var p1 = pt(a[0], a[1], px - ex, py - ey), p2 = pt(b[0], b[1], px + ex, py + ey);
    var p3 = pt(b[0], b[1], -px + ex, -py + ey), p4 = pt(a[0], a[1], -px - ex, -py - ey);
    return [[p1, p2, p3, p4, p1]];
  }

  function polygonesAEviter(h, w, depart, arrivee) {
    var marge = 0.6;
    var zone = {
      s: Math.min(depart.lat, arrivee.lat) - marge, n: Math.max(depart.lat, arrivee.lat) + marge,
      o: Math.min(depart.lon, arrivee.lon) - marge, e: Math.max(depart.lon, arrivee.lon) + marge
    };
    var polys = [], nb = 0;
    entraves.forEach(function (e) {
      if (!bloquante(e, h, w) || !dansZone(e, zone)) { return; }
      nb++;
      e.lignes.forEach(function (l) {
        if (l.length === 1) { l = [l[0], [l[0][0] + 0.0003, l[0][1]]]; }
        var pas = Math.max(1, Math.ceil((l.length - 1) / 40));
        for (var i = 0; i < l.length - 1; i += pas) {
          var j = Math.min(i + pas, l.length - 1);
          polys.push(rectangleCorridor(l[i], l[j], 30));
        }
      });
    });
    return { nombre: nb, multi: polys.length ? { type: 'MultiPolygon', coordinates: polys } : null };
  }

  function distanceM(a, b) {
    var mLon = 111320 * Math.cos(a[0] * Math.PI / 180);
    var dx = (b[1] - a[1]) * mLon, dy = (b[0] - a[0]) * 111320;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function entravesSurTrajet(coordsLonLat) {
    var trace = coordsLonLat.map(function (c) { return [c[1], c[0]]; });
    var s = 90, n = -90, o = 180, e = -180;
    trace.forEach(function (p) { s = Math.min(s, p[0]); n = Math.max(n, p[0]); o = Math.min(o, p[1]); e = Math.max(e, p[1]); });
    var zone = { s: s - 0.01, n: n + 0.01, o: o - 0.01, e: e + 0.01 };
    var pas = Math.max(1, Math.floor(trace.length / 3000));
    var echantillon = trace.filter(function (p, i) { return i % pas === 0; });
    return entraves.filter(function (en) {
      if (!en.actif || !dansZone(en, zone)) { return false; }
      return en.lignes.some(function (l) {
        return l.some(function (p) {
          for (var i = 0; i < echantillon.length; i++) { if (distanceM(p, echantillon[i]) < 120) { return true; } }
          return false;
        });
      });
    });
  }

  function afficherEntravesTrajet(liste, nbEvitees) {
    var boite = trouver('it511-entraves');
    while (boite.firstChild) { boite.removeChild(boite.firstChild); }
    var entete = document.createElement('div');
    entete.style.cssText = 'font-size:13px;margin-bottom:6px;color:#5a6270;';
    entete.textContent = nbEvitees + ' entrave(s) bloquante(s) contournée(s) - ' + liste.length + ' entrave(s) sur le trajet';
    boite.appendChild(entete);
    liste.forEach(function (en) {
      var item = document.createElement('div');
      item.style.cssText = 'border-left:4px solid ' + couleurEntrave(en) + ';padding:4px 8px;margin-bottom:6px;font-size:12px;background:#f8f9fb;';
      var t = document.createElement('div'); t.style.fontWeight = '600'; t.textContent = en.titre + ' (' + en.source + ')';
      var d = document.createElement('div'); d.style.whiteSpace = 'pre-line'; d.textContent = en.detail;
      item.appendChild(t); item.appendChild(d);
      boite.appendChild(item);
    });
  }

  var URL_CAM_QC = 'https://ws.mapserver.transports.gouv.qc.ca/swtq?service=wfs&version=2.0.0&request=getfeature&typename=ms:infos_cameras&srsname=EPSG:4326&outputformat=geojson';
  var URL_CAM_ON = 'https://511on.ca/api/v2/get/cameras?format=json&lang=fr&key=';
  var coucheCameras = null;
  var camerasChargees = 0;

  function popupCamera(titre, lien, image) {
    var boite = document.createElement('div');
    boite.style.cssText = 'max-width:300px;font-size:12px;';
    var t = document.createElement('div');
    t.style.cssText = 'font-weight:600;margin-bottom:4px;';
    t.textContent = titre;
    boite.appendChild(t);
    if (image) {
      var img = document.createElement('img');
      img.src = image + (image.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      img.alt = titre;
      img.style.cssText = 'width:100%;border-radius:4px;display:block;margin-bottom:4px;';
      boite.appendChild(img);
    }
    if (lien) {
      var a = document.createElement('a');
      a.href = lien; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Voir la caméra';
      boite.appendChild(a);
    }
    return boite;
  }

  function ajouterCamera(lat, lon, titre, lien, image) {
    L.circleMarker([lat, lon], { radius: 5, color: '#ffffff', weight: 1, fillColor: '#7c3aed', fillOpacity: 1 })
      .bindTooltip(titre)
      .bindPopup(function () { return popupCamera(titre, lien, image); }, { maxWidth: 320 })
      .addTo(coucheCameras);
  }

  function chargerCameras() {
    if (Date.now() - camerasChargees < 60 * 60 * 1000) { return; }
    camerasChargees = Date.now();
    coucheCameras.clearLayers();
    fetch(URL_CAM_QC).then(function (r) { return r.json(); }).then(function (data) {
      (data.features || []).forEach(function (f) {
        if (!f.geometry || f.geometry.type !== 'Point') { return; }
        var p = f.properties || {};
        ajouterCamera(f.geometry.coordinates[1], f.geometry.coordinates[0], p.DescriptionLocalisationFr || 'Caméra', p.URL_FLUX_DONNEE, null);
      });
    }).catch(function () { camerasChargees = 0; });
    var cleOn = lire('cle511on', '');
    if (!cleOn) { return; }
    fetch(URL_CAM_ON + encodeURIComponent(cleOn)).then(function (r) { return r.json(); }).then(function (data) {
      (Array.isArray(data) ? data : []).forEach(function (c) {
        if (!c.Latitude || !c.Longitude) { return; }
        var vues = c.Views || [];
        var image = vues.length ? vues[0].Url : null;
        ajouterCamera(c.Latitude, c.Longitude, c.Location || c.Name || 'Caméra (Ontario)', image, image);
      });
    }).catch(function () {});
  }

  function brancherParametres() {
    trouver('it511-cle').value = lire('cle', '');
    trouver('it511-cle-on').value = lire('cle511on', '');
    trouver('it511-sauver-cle-on').addEventListener('click', function () {
      ecrire('cle511on', trouver('it511-cle-on').value.trim());
      message('Clé 511 Ontario enregistrée sur ce poste.');
      chargerEntraves(true);
      camerasChargees = 0;
      chargerCameras();
    });
    if (!trouver('it511-depart').value) { trouver('it511-depart').value = DEPART_DEFAUT; }
    trouver('it511-hauteur').value = lire('hauteurPi', '');
    trouver('it511-largeur').value = lire('largeurPi', '');
    ['it511-hauteur', 'it511-largeur'].forEach(function (id) {
      trouver(id).addEventListener('input', function () { afficherConversion(id); });
      afficherConversion(id);
    });
    trouver('it511-sauver-cle').addEventListener('click', function () {
      ecrire('cle', trouver('it511-cle').value.trim());
      message('Clé enregistrée sur ce poste.');
    });
    trouver('it511-calculer').addEventListener('click', calculer);
    trouver('it511-copier-ligne').addEventListener('click', function () { if (dernierResultat) { copier(dernierResultat.enLigne); } });
    trouver('it511-copier-liste').addEventListener('click', function () {
      if (!dernierResultat) { return; }
      var t = dernierResultat.routes.map(function (r) { return r.nom + ' : ' + nombreFr(r.km, 1) + ' km'; }).join(String.fromCharCode(10));
      copier(t + String.fromCharCode(10) + 'Total : ' + nombreFr(dernierResultat.totalKm, 1) + ' km');
    });
    brancherAdresse('depart');
    brancherAdresse('arrivee');
  }

  return {
    initialize: function (api, state, callback) {
      chargerStyleLeaflet();
      creerCarte();
      brancherParametres();
      callback();
    },
    focus: function (api, state) {
      setTimeout(function () { carte.invalidateSize(); }, 300);
      setTimeout(function () { carte.invalidateSize(); }, 1500);
      chargerActifs(api);
      rafraichirRadar();
      chargerEntraves(false);
      chargerCameras();
      minuterie = setInterval(function () { chargerActifs(api); rafraichirRadar(); chargerEntraves(false); }, 120000);
    },
    blur: function (api, state) {
      if (minuterie) { clearInterval(minuterie); minuterie = null; }
    }
  };
};
</script>

<body>
<div id="it511-wrap" style="padding:12px 16px;box-sizing:border-box;">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:10px;">
    <span style="font-size:18px;font-weight:600;">LFS - version test 0.4.1</span>
    <span id="it511-statut" style="font-size:13px;color:#5a6270;">Démarrage...</span>
    <span id="it511-sources" style="font-size:13px;color:#5a6270;"></span>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;">
    <div style="flex:0 0 360px;max-width:100%;border:1px solid #c9ced6;border-radius:6px;padding:14px;box-sizing:border-box;background:#fff;">

      <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Départ</label>
      <div style="position:relative;margin-bottom:10px;">
        <input id="it511-depart" type="text" autocomplete="off" placeholder="125 rue de l’Usine, Beloeil" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        <div id="it511-liste-depart" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;border:1px solid #c9ced6;border-radius:4px;max-height:240px;overflow:auto;"></div>
      </div>

      <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Arrivée</label>
      <div style="position:relative;margin-bottom:10px;">
        <input id="it511-arrivee" type="text" autocomplete="off" placeholder="450 rue King O, Sherbrooke" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        <div id="it511-liste-arrivee" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;border:1px solid #c9ced6;border-radius:4px;max-height:240px;overflow:auto;"></div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:12px;">
        <div style="flex:1;">
          <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Hauteur (pi)</label>
          <input id="it511-hauteur" type="text" placeholder="15'6&quot; ou 15,5" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <div id="it511-hauteur-m" style="font-size:11px;color:#5a6270;margin-top:2px;min-height:14px;"></div>
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Largeur (pi)</label>
          <input id="it511-largeur" type="text" placeholder="16' ou 16,0" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <div id="it511-largeur-m" style="font-size:11px;color:#5a6270;margin-top:2px;min-height:14px;"></div>
        </div>
      </div>

      <button id="it511-calculer" type="button" style="width:100%;padding:9px;border:none;border-radius:4px;background:#1565c0;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">Calculer le trajet</button>

      <div id="it511-message" style="display:none;margin-top:10px;padding:8px 10px;border-radius:4px;font-size:13px;"></div>

      <div id="it511-resultat" style="display:none;margin-top:14px;">
        <div style="display:flex;gap:10px;margin-bottom:12px;">
          <div style="flex:1;background:#f3f5f8;border-radius:4px;padding:8px 10px;">
            <div style="font-size:12px;color:#5a6270;">Distance totale</div>
            <div id="it511-total" style="font-size:20px;font-weight:600;"></div>
          </div>
          <div style="flex:1;background:#f3f5f8;border-radius:4px;padding:8px 10px;">
            <div style="font-size:12px;color:#5a6270;">Durée estimée</div>
            <div id="it511-duree" style="font-size:20px;font-weight:600;"></div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Routes empruntées</div>
        <div id="it511-routes" style="border-top:1px solid #eef0f3;margin-bottom:10px;"></div>
        <div style="font-size:13px;font-weight:600;margin-bottom:4px;">En ligne</div>
        <div id="it511-enligne" style="font-size:13px;background:#f3f5f8;border-radius:4px;padding:8px 10px;margin-bottom:10px;line-height:1.5;"></div>
        <div style="display:flex;gap:8px;">
          <button id="it511-copier-ligne" type="button" style="flex:1;padding:7px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Copier la ligne</button>
          <button id="it511-copier-liste" type="button" style="flex:1;padding:7px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Copier la liste</button>
        </div>
        <div style="font-size:13px;font-weight:600;margin:12px 0 4px;">Entraves 511</div>
        <div id="it511-entraves"></div>
      </div>

      <details style="margin-top:16px;border-top:1px solid #eef0f3;padding-top:10px;">
        <summary style="font-size:13px;cursor:pointer;color:#5a6270;">Paramètres</summary>
        <label style="display:block;font-size:12px;color:#5a6270;margin:8px 0 3px;">Clé OpenRouteService</label>
        <div style="display:flex;gap:8px;">
          <input id="it511-cle" type="text" autocomplete="off" style="flex:1;min-width:0;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <button id="it511-sauver-cle" type="button" style="padding:7px 12px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Enregistrer</button>
        </div>
        <label style="display:block;font-size:12px;color:#5a6270;margin:8px 0 3px;">Clé 511 Ontario (facultative)</label>
        <div style="display:flex;gap:8px;">
          <input id="it511-cle-on" type="text" autocomplete="off" style="flex:1;min-width:0;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <button id="it511-sauver-cle-on" type="button" style="padding:7px 12px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Enregistrer</button>
        </div>
      </details>
    </div>

    <div style="flex:1 1 480px;min-width:300px;">
      <div id="it511-carte" style="height:78vh;min-height:460px;width:100%;border:1px solid #c9ced6;border-radius:6px;"></div>
    </div>
  </div>
</div>
</body>
