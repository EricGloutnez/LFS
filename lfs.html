<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LFS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
geotab.addin.lfs = function () {
  var ORS = 'https://api.heigit.org';
  var carte = null, radarPluie = null, radarNeige = null, coucheActifs = null, coucheTrajet = null, minuterie = null;
  var points = { depart: null, arrivee: null };
  var dernierResultat = null;

  function trouver(id) { return document.getElementById(id); }

  function lire(cle, defaut) {
    if (parametres && parametres[cle]) { return parametres[cle]; }
    try { var v = localStorage.getItem('it511-' + cle); return v === null ? defaut : v; } catch (e) { return defaut; }
  }
  function ecrire(cle, valeur) {
    try { localStorage.setItem('it511-' + cle, valeur); } catch (e) {}
    if (['cle', 'cle511on', 'hauteurPi', 'largeurPi'].indexOf(cle) >= 0 && parametres[cle] !== valeur) {
      parametres[cle] = valeur;
      sauverParametresPartages();
    }
  }

  function chargerStyleLeaflet() {
    if (!trouver('it511-leaflet-css')) {
      var lien = document.createElement('link');
      lien.id = 'it511-leaflet-css';
      lien.rel = 'stylesheet';
      lien.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
      document.head.appendChild(lien);
    }
  }

  function statut(texte) { var el = trouver('it511-statut'); if (el) { el.textContent = texte; } }
  function message(texte, erreur) {
    var el = trouver('it511-message');
    el.textContent = texte || '';
    el.style.display = texte ? 'block' : 'none';
    el.style.background = erreur ? '#fdecea' : '#e8f1fb';
    el.style.color = erreur ? '#8a1c1c' : '#0c447c';
  }

  function nombreFr(n, dec) {
    return n.toLocaleString('fr-CA', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

    function creerCarte() {
    var conteneur = trouver('it511-carte');
    carte = L.map(conteneur).setView([46.2, -72.6], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; contributeurs OpenStreetMap'
    }).addTo(carte);

    var optionsRadar = { format: 'image/png', transparent: true, version: '1.3.0', opacity: 0.6,
      attribution: 'Radar : Environnement et Changement climatique Canada' };
    radarPluie = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', L.extend({ layers: 'RADAR_1KM_RRAI' }, optionsRadar));
    radarNeige = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', L.extend({ layers: 'RADAR_1KM_RSNO' }, optionsRadar));
    radarPluie.addTo(carte);

    coucheActifs = L.layerGroup().addTo(carte);
    coucheTrajet = L.layerGroup().addTo(carte);
    coucheEntraves = L.layerGroup().addTo(carte);
    coucheCameras = L.layerGroup();
    coucheReel = L.layerGroup().addTo(carte);
    var alertes = L.tileLayer.wms('https://geo.weather.gc.ca/geomet', L.extend({ layers: 'ALERTS' }, optionsRadar));

    L.control.layers(null, {
      'Trajet': coucheTrajet,
      'Entraves 511': coucheEntraves,
      'Caméras 511': coucheCameras,
      'Avertissements météo': alertes,
      'Trajet réel': coucheReel,
      'Radar - pluie': radarPluie,
      'Radar - neige': radarNeige,
      'Actifs Geotab': coucheActifs
    }, { collapsed: false }).addTo(carte);
  }

  function rafraichirRadar() {
    var t = Date.now();
    radarPluie.setParams({ _t: t });
    radarNeige.setParams({ _t: t });
  }

  function chargerActifs(api) {
    api.multiCall([
      ['Get', { typeName: 'Device', search: { fromDate: new Date().toISOString() } }],
      ['Get', { typeName: 'DeviceStatusInfo' }]
    ], function (resultats) {
      var noms = {};
      resultats[0].forEach(function (d) { noms[d.id] = d.name; });
      coucheActifs.clearLayers();
      listeActifs = [];
      resultats[0].forEach(function (d) { listeActifs.push({ id: d.id, nom: d.name, lat: null, lon: null }); });
      resultats[1].forEach(function (s) {
        var a = s.device ? listeActifs.filter(function (x) { return x.id === s.device.id; })[0] : null;
        if (a) { a.lat = s.latitude; a.lon = s.longitude; }
      });
      remplirListeActifs();
      mettreAJourSuivi();
      var nombre = 0;
      resultats[1].forEach(function (s) {
        if (s.latitude && s.longitude && s.device && noms[s.device.id]) {
          var libelle = noms[s.device.id];
          if (s.speed) { libelle += ' - ' + Math.round(s.speed) + ' km/h'; }
          L.circleMarker([s.latitude, s.longitude], {
            radius: 7, color: '#ffffff', weight: 2, fillColor: '#1565c0', fillOpacity: 1
          }).bindTooltip(libelle).addTo(coucheActifs);
          nombre++;
        }
      });
      statut(nombre + ' actifs affichés - mis à jour à ' + new Date().toLocaleTimeString('fr-CA'));
    }, function (erreur) {
      statut('Geotab a refusé la lecture des actifs : ' + (erreur && erreur.message ? erreur.message : erreur));
    });
  }

    function brancherAdresse(champ) {
    var input = trouver('it511-' + champ), liste = trouver('it511-liste-' + champ), delai = null;

    input.addEventListener('input', function () {
      points[champ] = null;
      clearTimeout(delai);
      var texte = input.value.trim();
      if (texte.length < 4) { liste.style.display = 'none'; return; }
      delai = setTimeout(function () { suggerer(texte, liste, champ); }, 350);
    });
    input.addEventListener('blur', function () { setTimeout(function () { liste.style.display = 'none'; }, 250); });
  }

  function suggerer(texte, liste, champ) {
    var cle = lire('cle', '');
    if (!cle) { message('Entre d’abord ta clé OpenRouteService dans les paramètres.', true); return; }
    var url = ORS + '/pelias/v1/autocomplete?text=' + encodeURIComponent(texte) +
      '&boundary.country=CA&focus.point.lat=45.6&focus.point.lon=-73.2&size=6';
    fetch(url, { headers: { 'Authorization': cle } }).then(function (r) { return r.json(); }).then(function (data) {
      while (liste.firstChild) { liste.removeChild(liste.firstChild); }
      var res = (data && data.features) || [];
      if (!res.length) { liste.style.display = 'none'; return; }
      res.forEach(function (f) {
        var item = document.createElement('div');
        item.textContent = f.properties.label;
        item.style.cssText = 'padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #eef0f3;';
        item.addEventListener('mouseenter', function () { item.style.background = '#f0f4f9'; });
        item.addEventListener('mouseleave', function () { item.style.background = ''; });
        item.addEventListener('mousedown', function () {
          trouver('it511-' + champ).value = f.properties.label;
          points[champ] = { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: f.properties.label };
          liste.style.display = 'none';
        });
        liste.appendChild(item);
      });
      liste.style.display = 'block';
    }).catch(function () { liste.style.display = 'none'; });
  }

  function geocoder(texte) {
    var url = ORS + '/pelias/v1/search?text=' + encodeURIComponent(texte) + '&boundary.country=CA&size=1';
    return fetch(url, { headers: { 'Authorization': lire('cle', '') } }).then(function (r) { return r.json(); }).then(function (data) {
      if (!data.features || !data.features.length) { throw new Error('Adresse introuvable : ' + texte); }
      var f = data.features[0];
      return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: f.properties.label };
    });
  }

  function piedsEnMetres(texte) {
    var t = (texte || '').trim().toLowerCase().replace(/,/g, '.');
    if (!t) { return null; }
    var m = t.match(/^(\d+(?:\.\d+)?)\s*(?:'|’|pi|pieds?)?\s*(?:(\d+(?:\.\d+)?)\s*(?:"|”|''|po|pouces?)?)?$/);
    if (!m) { return null; }
    var pieds = parseFloat(m[1]) + (m[2] ? parseFloat(m[2]) / 12 : 0);
    if (isNaN(pieds) || pieds <= 0) { return null; }
    return pieds * 0.3048;
  }

  function lireDimension(id) {
    return piedsEnMetres(trouver(id).value);
  }

  function afficherConversion(id) {
    return id;
  }

  var nbEviteesCourant = 0;
  function optionsTrajet(h, w, depart, arrivee) {
    var o = { vehicle_type: 'hgv', profile_params: { restrictions: { height: h, width: w } } };
    var ev = polygonesAEviter(h, w, depart, arrivee);
    nbEviteesCourant = ev.nombre;
    if (ev.multi) { o.avoid_polygons = ev.multi; }
    return o;
  }

  function calculer() {
    message('');
    var cle = lire('cle', '');
    if (!cle) { message('Entre d’abord ta clé OpenRouteService dans les paramètres (en bas du panneau).', true); return; }
    var h = lireDimension('it511-hauteur'), w = lireDimension('it511-largeur');
    if (!h || !w) { message('Indique la hauteur et la largeur en pieds (ex. 15,5 ou 15\'6").', true); return; }
    if (!trouver('it511-depart').value.trim() || !trouver('it511-arrivee').value.trim()) { message('Indique une adresse de départ et d’arrivée.', true); return; }

    ecrire('hauteurPi', trouver('it511-hauteur').value);
    ecrire('largeurPi', trouver('it511-largeur').value);

    var bouton = trouver('it511-calculer');
    bouton.disabled = true; bouton.textContent = 'Calcul en cours...';

    chargerEntraves(false).then(function () { return Promise.all([
      points.depart ? Promise.resolve(points.depart) : geocoder(trouver('it511-depart').value.trim()),
      points.arrivee ? Promise.resolve(points.arrivee) : geocoder(trouver('it511-arrivee').value.trim())
    ]); }).then(function (p) {
      points.depart = p[0]; points.arrivee = p[1];
      return fetch(ORS + '/openrouteservice/v2/directions/driving-hgv/geojson', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': cle },
        body: JSON.stringify({
          coordinates: [[p[0].lon, p[0].lat], [p[1].lon, p[1].lat]],
          radiuses: [-1, -1],
          units: 'km',
          language: 'fr',
          instructions: true,
          options: optionsTrajet(h, w, p[0], p[1])
        })
      });
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, statut: r.status, data: data }; });
    }).then(function (rep) {
      if (!rep.ok) {
        var code = rep.data && rep.data.error && rep.data.error.code;
        if (rep.statut === 401 || rep.statut === 403) { throw new Error('La clé OpenRouteService est refusée. Vérifie-la dans les paramètres.'); }
        var detail = (rep.data && rep.data.error && rep.data.error.message) ? ' [code ' + code + ' : ' + rep.data.error.message + ']' : ' [code ' + code + ']';
        if (code === 2010) { throw new Error('Une des adresses est trop loin d’une route accessible aux camions.' + detail); }
        if (code === 2009) { throw new Error('Aucun trajet possible avec ces dimensions entre ces deux adresses.' + detail); }
        throw new Error('Le calcul a échoué (' + rep.statut + ') : ' + ((rep.data.error && rep.data.error.message) || 'erreur inconnue'));
      }
      var f0 = rep.data.features[0];
      trouver('it511-calculer').textContent = 'Identification des routes...';
      return enrichirReferences(f0.properties.segments[0].steps || [], f0.geometry.coordinates).then(function () {
        afficherResultat(rep.data, h, w);
      });
    }).catch(function (e) {
      message(e.message || String(e), true);
    }).then(function () {
      bouton.disabled = false; bouton.textContent = 'Calculer le trajet';
    });
  }

  function capCardinal(a, b) {
    var dy = b[1] - a[1];
    var dx = (b[0] - a[0]) * Math.cos(a[1] * Math.PI / 180);
    if (Math.abs(dx) >= Math.abs(dy)) { return dx >= 0 ? 'E' : 'O'; }
    return dy >= 0 ? 'N' : 'S';
  }

  function referenceRoute(nom) {
    var m;
    if ((m = nom.match(/\b(?:A|Aut\.?|Autoroute)\s*-?\s*(\d{1,3})\b/i))) { return { type: 'A', num: m[1] }; }
    if ((m = nom.match(/\b(?:R|Rte|Route)\s*-?\s*(\d{2,3})\b/i))) { return { type: 'R', num: m[1] }; }
    if ((m = nom.match(/\b(?:Highway|Hwy|ON|Autoroute de l.Ontario)\s*-?\s*(\d{1,3})\b/i))) { return { type: 'Hwy', num: m[1] }; }
    return null;
  }

  var OVERPASS = 'https://overpass-api.de/api/interpreter';

  function refDepuisTags(tags) {
    var ref = String(tags.ref || '').split(';')[0].trim();
    if (!ref) { return null; }
    var deja = referenceRoute(ref);
    var num = (ref.match(/\d{1,3}/) || [])[0];
    if (!num) { return null; }
    var reseau = String(tags.network || '');
    if (/ON/i.test(reseau)) { return { type: 'Hwy', num: num }; }
    if (deja) { return deja; }
    if (/^motorway/.test(tags.highway || '')) { return { type: 'A', num: num }; }
    return { type: 'R', num: num };
  }

  function enrichirReferences(steps, coords) {
    var cibles = [];
    steps.forEach(function (s, i) {
      if (s.type === 10 || s.distance < 0.3) { return; }
      var nom = (s.name && s.name !== '-') ? s.name : '';
      if (nom && referenceRoute(nom)) { return; }
      if (nom && s.distance < 3) { return; }
      var wp = s.way_points || [0, 0];
      var a = wp[0], b = wp[1];
      [1 / 3, 2 / 3].forEach(function (f) {
        var k = Math.round(a + (b - a) * f);
        if (coords[k]) { cibles.push({ etape: i, lat: coords[k][1], lon: coords[k][0] }); }
      });
    });
    if (!cibles.length) { return Promise.resolve(); }
    var q = '[out:json][timeout:25];';
    cibles.forEach(function (c, k) {
      q += 'way(around:25,' + c.lat.toFixed(6) + ',' + c.lon.toFixed(6) + ')["highway"~"^(motorway|trunk|primary|secondary|motorway_link|trunk_link|primary_link)$"]["ref"];out tags;make m k=' + k + ';out;';
    });
    return fetch(OVERPASS, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var tampon = [], votes = {};
        (data.elements || []).forEach(function (el) {
          if (el.type === 'm') {
            var c = cibles[parseInt(el.tags.k, 10)];
            var principales = tampon.filter(function (t) { return !/_link$/.test(t.highway || ''); });
            var choix = (principales.length ? principales : tampon)[0];
            if (c && choix) {
              var ref = refDepuisTags(choix);
              if (ref) {
                votes[c.etape] = votes[c.etape] || {};
                var cle = ref.type + ref.num;
                votes[c.etape][cle] = votes[c.etape][cle] || { ref: ref, n: 0 };
                votes[c.etape][cle].n++;
              }
            }
            tampon = [];
          } else if (el.tags) {
            tampon.push(el.tags);
          }
        });
        Object.keys(votes).forEach(function (i) {
          var meilleur = null;
          Object.keys(votes[i]).forEach(function (k) { if (!meilleur || votes[i][k].n > meilleur.n) { meilleur = votes[i][k]; } });
          if (meilleur) { steps[i].refOsm = meilleur.ref; }
        });
      })
      .catch(function () {});
  }

  function regrouperRoutes(steps, coords) {
    var routes = [];
    derniersSteps = steps;
    steps.forEach(function (s) {
      if (s.type === 10) { return; }
      var brut = (s.name && s.name !== '-') ? s.name.trim() : '';
      var ref = brut ? referenceRoute(brut) : null;
      if (!ref && s.refOsm) { ref = s.refOsm; }
      if (!ref && s.instruction) { ref = referenceRoute(s.instruction); }
      var cle = ref ? ref.type + ref.num : brut;
      var wp = s.way_points || [0, 0];
      var dernier = routes[routes.length - 1];
      if (!cle) {
        if (dernier && (dernier.cle === '' || s.distance < 0.5)) { dernier.km += s.distance; dernier.fin = wp[1]; }
        else { routes.push({ cle: '', brut: '(route sans nom)', ref: null, km: s.distance, debut: wp[0], fin: wp[1] }); }
        return;
      }
      if (dernier && dernier.cle === cle) { dernier.km += s.distance; dernier.fin = wp[1]; }
      else { routes.push({ cle: cle, brut: brut || (ref.type + ' ' + ref.num), ref: ref, km: s.distance, debut: wp[0], fin: wp[1] }); }
    });
    routes = routes.filter(function (r) { return r.km >= 0.05 || routes.length === 1; });
    afficherDiagnostic();
    return routes.map(function (r) {
      var nom = r.brut;
      if (r.ref) {
        var dir = (coords && coords[r.debut] && coords[r.fin]) ? ' ' + capCardinal(coords[r.debut], coords[r.fin]) : '';
        nom = (r.ref.type === 'Hwy' ? 'Hwy ' : r.ref.type + '-') + r.ref.num + dir;
      } else if (!r.cle && r.km < 1.5) {
        return { nom: 'Bretelle', km: r.km, bretelle: true };
      } else if (nom.indexOf(',') > 0) {
        nom = nom.split(',')[0].trim();
      }
      return { nom: nom, km: r.km };
    });
  }

  var derniersSteps = [];
  function afficherDiagnostic() {
    var boite = trouver('it511-diagnostic');
    if (!boite) { return; }
    while (boite.firstChild) { boite.removeChild(boite.firstChild); }
    derniersSteps.forEach(function (s, i) {
      var l = document.createElement('div');
      l.style.cssText = 'font-size:11px;border-bottom:1px solid #eef0f3;padding:2px 0;';
      l.textContent = (i + 1) + '. [' + (s.name || '') + (s.refOsm ? ' / OSM ' + s.refOsm.type + '-' + s.refOsm.num : '') + '] ' + (s.instruction || '') + ' - ' + nombreFr(s.distance || 0, 2) + ' km (type ' + s.type + ')';
      boite.appendChild(l);
    });
  }

  function simplifier(points, tol) {
    if (points.length < 3) { return points.slice(); }
    var garder = new Array(points.length); garder[0] = garder[points.length - 1] = true;
    var pile = [[0, points.length - 1]];
    while (pile.length) {
      var seg = pile.pop(), a = points[seg[0]], b = points[seg[1]], max = 0, idx = -1;
      for (var i = seg[0] + 1; i < seg[1]; i++) {
        var p = points[i];
        var dx = b[1] - a[1], dy = b[0] - a[0];
        var d = (dx === 0 && dy === 0) ? Math.hypot(p[1] - a[1], p[0] - a[0])
          : Math.abs(dy * p[1] - dx * p[0] + b[1] * a[0] - b[0] * a[1]) / Math.hypot(dx, dy);
        if (d > max) { max = d; idx = i; }
      }
      if (max > tol && idx > 0) { garder[idx] = true; pile.push([seg[0], idx], [idx, seg[1]]); }
    }
    return points.filter(function (p, i) { return garder[i]; });
  }

  function encoderPolyligne(points) {
    var sortie = '', pLat = 0, pLon = 0;
    function code(v) {
      v = v < 0 ? ~(v << 1) : (v << 1);
      var s = '';
      while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
      return s + String.fromCharCode(v + 63);
    }
    points.forEach(function (p) {
      var lat = Math.round(p[0] * 1e5), lon = Math.round(p[1] * 1e5);
      sortie += code(lat - pLat) + code(lon - pLon);
      pLat = lat; pLon = lon;
    });
    return sortie;
  }

  function traceCompacte(latlngs) {
    var tol = 0.00005, enc = encoderPolyligne(latlngs);
    while (enc.length > 5500 && tol < 0.05) { tol *= 2; enc = encoderPolyligne(simplifier(latlngs, tol)); }
    return enc;
  }

  function afficherDonnees(d) {
    coucheTrajet.clearLayers();
    if (d.latlngs && d.latlngs.length) {
      var trace = L.polyline(d.latlngs, { color: '#c2410c', weight: 5, opacity: 0.85 }).addTo(coucheTrajet);
      carte.fitBounds(trace.getBounds(), { padding: [30, 30] });
    }
    if (d.depart) {
      L.circleMarker([d.depart.lat, d.depart.lon], { radius: 8, color: '#fff', weight: 2, fillColor: '#15803d', fillOpacity: 1 })
        .bindTooltip('Départ : ' + d.depart.label).addTo(coucheTrajet);
    }
    if (d.arrivee) {
      L.circleMarker([d.arrivee.lat, d.arrivee.lon], { radius: 8, color: '#fff', weight: 2, fillColor: '#b91c1c', fillOpacity: 1 })
        .bindTooltip('Arrivée : ' + d.arrivee.label).addTo(coucheTrajet);
    }
    var duree = d.dureeS || 0;
    var heures = Math.floor(duree / 3600), minutes = Math.round((duree % 3600) / 60);
    trouver('it511-total').textContent = nombreFr(d.totalKm || 0, 1) + ' km';
    trouver('it511-duree').textContent = heures + ' h ' + (minutes < 10 ? '0' : '') + minutes;
    var tableau = trouver('it511-routes');
    while (tableau.firstChild) { tableau.removeChild(tableau.firstChild); }
    d.routes.forEach(function (r) {
      var ligne = document.createElement('div');
      ligne.style.cssText = 'display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef0f3;font-size:13px;';
      var nom = document.createElement('span'); nom.textContent = r.nom;
      if (r.bretelle || r.nom === 'Bretelle') { nom.style.color = '#8a8f98'; nom.style.fontStyle = 'italic'; }
      var km = document.createElement('span'); km.textContent = nombreFr(r.km, 1) + ' km'; km.style.color = '#5a6270'; km.style.whiteSpace = 'nowrap';
      ligne.appendChild(nom); ligne.appendChild(km);
      tableau.appendChild(ligne);
    });
    trouver('it511-enligne').textContent = d.enLigne;
    trouver('it511-resultat').style.display = 'block';
  }

  function afficherResultat(geo, h, w) {
    var f = geo.features[0];
    var seg = f.properties.segments[0];
    var coords = f.geometry.coordinates;
    var totalKm = f.properties.summary.distance;
    var routes = regrouperRoutes(seg.steps || [], coords);
    var latlngs = coords.map(function (c) { return [c[1], c[0]]; });

    clearTimeout(minuterieSauvegarde);
    minuterieSauvegarde = setTimeout(function () {
      var details = { type: 'parametres', cle: parametres.cle || '', cle511on: parametres.cle511on || '', hauteurPi: parametres.hauteurPi || '', largeurPi: parametres.largeurPi || '' };
      var entite = { addInId: ADDIN_ID, groups: [{ id: 'GroupCompanyId' }], details: details };
      if (parametresId) {
        entite.id = parametresId;
        appelGeotab('Set', { typeName: 'AddInData', entity: entite }).catch(function () {});
      } else {
        appelGeotab('Add', { typeName: 'AddInData', entity: entite }).then(function (id) { parametresId = id; }).catch(function () {});
      }
    }, 1200);
  }

  function referenceValide(ref) { return /^\d{5}(-\d{1,2})?$/.test(ref); }

  function sauverVoyage() {
    if (!dernierResultat) { message('Calcule d’abord un trajet.', true); return; }
    var ref = trouver('it511-ref').value.trim();
    if (!referenceValide(ref)) { message('Référence invalide : 5 chiffres, ou 5 chiffres, un tiret et le numéro du module (ex. 17513 ou 17513-2).', true); return; }
    var sel = trouver('it511-actif');
    var details = {
      type: 'voyage', ref: ref, maison: ref.split('-')[0], module: ref.split('-')[1] || '',
      date: new Date().toISOString(),
      depart: dernierResultat.depart, arrivee: dernierResultat.arrivee,
      hauteurPi: trouver('it511-hauteur').value, largeurPi: trouver('it511-largeur').value,
      totalKm: Math.round(dernierResultat.totalKm * 10) / 10, dureeS: Math.round(dernierResultat.dureeS),
      routes: dernierResultat.routes.map(function (r) { return { n: r.nom, k: Math.round(r.km * 10) / 10 }; }),
      enLigne: dernierResultat.enLigne,
      trace: dernierResultat.traceEnc,
      actifId: sel.value || '', actifNom: sel.value ? sel.options[sel.selectedIndex].text : ''
    };
    var taille = JSON.stringify(details).length;
    if (taille > 9800) { details.routes = details.routes.slice(0, 40); details.trace = traceCompacte(decoderPolyligne(details.trace).filter(function (p, i) { return i % 2 === 0; })); }
    var entite = { addInId: ADDIN_ID, groups: [{ id: 'GroupCompanyId' }], details: details };
    var promesse;
    if (voyageEnEdition) {
      entite.id = voyageEnEdition;
      var ancien = voyages.filter(function (v) { return v.id === voyageEnEdition; })[0];
      if (ancien && ancien.d.date) { details.dateCreation = ancien.d.dateCreation || ancien.d.date; }
      promesse = appelGeotab('Set', { typeName: 'AddInData', entity: entite });
    } else {
      promesse = appelGeotab('Add', { typeName: 'AddInData', entity: entite });
    }
    promesse.then(function () {
      message(voyageEnEdition ? 'Voyage ' + ref + ' mis à jour.' : 'Voyage ' + ref + ' enregistré.');
      voyageEnEdition = null;
      trouver('it511-sauver-voyage').textContent = 'Enregistrer le voyage';
      return chargerStockage();
    }).catch(function (e) {
      message('Enregistrement impossible : ' + (e && e.message ? e.message : e), true);
    });
  }

  function supprimerVoyage(v) {
    if (!window.confirm('Supprimer le voyage ' + v.d.ref + ' ? Cette action est définitive.')) { return; }
    appelGeotab('Remove', { typeName: 'AddInData', entity: { id: v.id } }).then(function () {
      message('Voyage ' + v.d.ref + ' supprimé.');
      if (voyageAffiche && voyageAffiche.id === v.id) { voyageAffiche = null; }
      return chargerStockage();
    }).catch(function (e) { message('Suppression impossible : ' + (e && e.message ? e.message : e), true); });
  }

  function modifierVoyage(v) {
    var d = v.d;
    trouver('it511-ref').value = d.ref;
    trouver('it511-depart').value = d.depart ? d.depart.label : '';
    trouver('it511-arrivee').value = d.arrivee ? d.arrivee.label : '';
    points.depart = d.depart || null; points.arrivee = d.arrivee || null;
    trouver('it511-hauteur').value = d.hauteurPi || ''; afficherConversion('it511-hauteur');
    trouver('it511-largeur').value = d.largeurPi || ''; afficherConversion('it511-largeur');
    trouver('it511-actif').value = d.actifId || '';
    voyageEnEdition = v.id;
    trouver('it511-sauver-voyage').textContent = 'Mettre à jour le voyage ' + d.ref;
    message('Modification du voyage ' + d.ref + ' : ajuste les champs, recalcule le trajet, puis clique sur « Mettre à jour ».');
    trouver('it511-wrap').scrollIntoView({ behavior: 'smooth' });
  }

  function ouvrirVoyage(v) {
    var d = v.d;
    voyageAffiche = v;
    var latlngs = d.trace ? decoderPolyligne(d.trace) : [];
    afficherDonnees({
      routes: (d.routes || []).map(function (r) { return { nom: r.n, km: r.k }; }),
      totalKm: d.totalKm, dureeS: d.dureeS, enLigne: d.enLigne,
      latlngs: latlngs, depart: d.depart, arrivee: d.arrivee
    });
    trouver('it511-titre-resultat').textContent = 'Voyage ' + d.ref + ' du ' + new Date(d.date).toLocaleDateString('fr-CA') + (d.actifNom ? ' - ' + d.actifNom : '');
    afficherEntravesTrajet(entravesSurTrajet(latlngs.map(function (p) { return [p[1], p[0]]; })), 0);
    if (coucheReel) { coucheReel.clearLayers(); }
    trouver('it511-zone-suivi').style.display = d.actifId ? 'block' : 'none';
    trouver('it511-cmp-debut').value = versChampDate(new Date(d.date));
    trouver('it511-cmp-fin').value = versChampDate(new Date());
    trouver('it511-suivi').textContent = '';
    trouver('it511-comparaison').textContent = '';
    mettreAJourSuivi();
  }

  function versChampDate(dt) {
    var z = function (n) { return (n < 10 ? '0' : '') + n; };
    return dt.getFullYear() + '-' + z(dt.getMonth() + 1) + '-' + z(dt.getDate()) + 'T' + z(dt.getHours()) + ':' + z(dt.getMinutes());
  }

  function bouton(texte, action, danger) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = texte;
    b.style.cssText = 'padding:3px 8px;border:1px solid ' + (danger ? '#e5a3a3' : '#c9ced6') + ';border-radius:4px;background:#fff;font-size:12px;cursor:pointer;color:' + (danger ? '#8a1c1c' : 'inherit') + ';';
    b.addEventListener('click', action);
    return b;
  }

  function afficherListeVoyages() {
    var filtre = (trouver('it511-recherche').value || '').trim();
    var boite = trouver('it511-liste-voyages');
    while (boite.firstChild) { boite.removeChild(boite.firstChild); }
    var liste = voyages.filter(function (v) { return !filtre || (v.d.ref || '').indexOf(filtre) === 0; });
    if (!filtre) { liste = liste.slice(0, 15); }
    if (!liste.length) {
      var vide = document.createElement('div');
      vide.style.cssText = 'font-size:12px;color:#5a6270;';
      vide.textContent = voyages.length ? 'Aucun voyage ne correspond à cette référence.' : 'Aucun voyage enregistré pour l’instant.';
      boite.appendChild(vide);
      return;
    }
    liste.forEach(function (v) {
      var d = v.d;
      var item = document.createElement('div');
      item.style.cssText = 'border:1px solid #e3e6eb;border-radius:4px;padding:6px 8px;margin-bottom:6px;font-size:12px;';
      var t = document.createElement('div');
      t.style.fontWeight = '600';
      t.textContent = d.ref + ' - ' + nombreFr(d.totalKm || 0, 1) + ' km - ' + new Date(d.date).toLocaleDateString('fr-CA');
      var s = document.createElement('div');
      s.style.color = '#5a6270';
      s.textContent = ((d.depart && d.depart.label) || '?') + ' → ' + ((d.arrivee && d.arrivee.label) || '?') + (d.actifNom ? ' - ' + d.actifNom : '');
      var actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;';
      actions.appendChild(bouton('Ouvrir', function () { ouvrirVoyage(v); }));
      actions.appendChild(bouton('Modifier', function () { modifierVoyage(v); }));
      actions.appendChild(bouton('Supprimer', function () { supprimerVoyage(v); }, true));
      item.appendChild(t); item.appendChild(s); item.appendChild(actions);
      boite.appendChild(item);
    });
  }

  function brancherRecherche() {
    var input = trouver('it511-recherche'), sugg = trouver('it511-sugg-voyages');
    input.addEventListener('input', function () {
      var f = input.value.trim();
      afficherListeVoyages();
      while (sugg.firstChild) { sugg.removeChild(sugg.firstChild); }
      if (!f) { sugg.style.display = 'none'; return; }
      var refs = {};
      voyages.forEach(function (v) {
        var r = v.d.ref || '';
        if (r.indexOf(f) === 0) { refs[r] = true; refs[r.split('-')[0]] = refs[r.split('-')[0]] || (r.split('-')[0].indexOf(f) === 0); }
      });
      var cles = Object.keys(refs).filter(function (k) { return refs[k] && k.indexOf(f) === 0; }).sort().slice(0, 12);
      cles.forEach(function (k) {
        var it = document.createElement('div');
        it.textContent = k;
        it.style.cssText = 'padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #eef0f3;';
        it.addEventListener('mousedown', function () { input.value = k; sugg.style.display = 'none'; afficherListeVoyages(); });
        sugg.appendChild(it);
      });
      sugg.style.display = cles.length ? 'block' : 'none';
    });
    input.addEventListener('blur', function () { setTimeout(function () { sugg.style.display = 'none'; }, 250); });
  }

  function remplirListeActifs() {
    var sel = trouver('it511-actif'), valeur = sel.value;
    while (sel.options.length > 1) { sel.remove(1); }
    listeActifs.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom); }).forEach(function (a) {
      var o = document.createElement('option'); o.value = a.id; o.textContent = a.nom; sel.appendChild(o);
    });
    sel.value = valeur;
  }

  function cumulKm(latlngs) {
    var c = [0];
    for (var i = 1; i < latlngs.length; i++) { c.push(c[i - 1] + distanceM(latlngs[i - 1], latlngs[i]) / 1000); }
    return c;
  }

  function mettreAJourSuivi() {
    if (!voyageAffiche || !voyageAffiche.d.actifId) { return; }
    var a = listeActifs.filter(function (x) { return x.id === voyageAffiche.d.actifId; })[0];
    var zone = trouver('it511-suivi');
    if (!a || !a.lat) { zone.textContent = 'Position de l’actif indisponible.'; return; }
    var trace = decoderPolyligne(voyageAffiche.d.trace || '');
    if (!trace.length) { return; }
    var cumul = cumulKm(trace), meilleur = 0, dMin = Infinity;
    for (var i = 0; i < trace.length; i++) {
      var dd = distanceM([a.lat, a.lon], trace[i]);
      if (dd < dMin) { dMin = dd; meilleur = i; }
    }
    var total = cumul[cumul.length - 1];
    var fait = cumul[meilleur];
    var texte;
    if (dMin > 5000) {
      texte = a.nom + ' n’est pas sur ce trajet : il se trouve à ' + nombreFr(dMin / 1000, 1) + ' km du trajet prévu.';
    } else {
      texte = a.nom + ' : environ ' + nombreFr(fait, 1) + ' km parcourus, ' + nombreFr(Math.max(0, total - fait), 1) + ' km restants';
      texte += dMin > 500 ? ' - ATTENTION : à ' + nombreFr(dMin / 1000, 1) + ' km du trajet prévu.' : ' - sur le trajet prévu.';
    }
    zone.textContent = texte;
    zone.style.color = dMin > 500 ? '#8a1c1c' : '#14532d';
  }

  function comparerReel() {
    if (!voyageAffiche || !voyageAffiche.d.actifId) { return; }
    var debut = new Date(trouver('it511-cmp-debut').value), fin = new Date(trouver('it511-cmp-fin').value);
    if (isNaN(debut.getTime()) || isNaN(fin.getTime()) || fin <= debut) { message('Période de comparaison invalide.', true); return; }
    var zone = trouver('it511-comparaison');
    zone.textContent = 'Lecture du trajet réel dans Geotab...';
    appelGeotab('Get', { typeName: 'LogRecord', resultsLimit: 50000, search: { deviceSearch: { id: voyageAffiche.d.actifId }, fromDate: debut.toISOString(), toDate: fin.toISOString() } })
      .then(function (logs) {
        var pts = (logs || []).filter(function (l) { return l.latitude && l.longitude && (l.latitude !== 0 || l.longitude !== 0); })
          .map(function (l) { return [l.latitude, l.longitude]; });
        if (pts.length < 2) { zone.textContent = 'Aucune position enregistrée pour cet actif durant cette période.'; return; }
        coucheReel.clearLayers();
        L.polyline(pts, { color: '#7c3aed', weight: 4, opacity: 0.8, dashArray: '6 6' }).bindTooltip('Trajet réel').addTo(coucheReel);
        var kmReel = cumulKm(pts); kmReel = kmReel[kmReel.length - 1];
        var trace = decoderPolyligne(voyageAffiche.d.trace || '');
        var pas = Math.max(1, Math.floor(pts.length / 1500)), horsTrajet = 0, testes = 0, ecartMax = 0;
        for (var i = 0; i < pts.length; i += pas) {
          var dMin = Infinity;
          for (var j = 0; j < trace.length; j++) { var d = distanceM(pts[i], trace[j]); if (d < dMin) { dMin = d; } }
          testes++; if (dMin > 400) { horsTrajet++; } if (dMin > ecartMax) { ecartMax = dMin; }
        }
        var prevu = voyageAffiche.d.totalKm || 0;
        var pct = testes ? Math.round(100 * (testes - horsTrajet) / testes) : 0;
        zone.textContent = 'Prévu : ' + nombreFr(prevu, 1) + ' km - Réel : ' + nombreFr(kmReel, 1) + ' km (écart ' +
          (kmReel - prevu >= 0 ? '+' : '') + nombreFr(kmReel - prevu, 1) + ' km). ' + pct + ' % des positions sur le trajet prévu; écart maximal ' + nombreFr(ecartMax / 1000, 1) + ' km.';
        zone.style.color = pct < 90 ? '#8a1c1c' : '#14532d';
      }).catch(function (e) { zone.textContent = 'Lecture impossible : ' + (e && e.message ? e.message : e); });
  }

  function brancherParametres() {
    trouver('it511-cle').value = lire('cle', '');
    trouver('it511-cle-on').value = lire('cle511on', '');
    trouver('it511-sauver-cle-on').addEventListener('click', function () {
      ecrire('cle511on', trouver('it511-cle-on').value.trim());
      message('Clé 511 Ontario enregistrée pour toute l’équipe.');
      chargerEntraves(true);
      camerasChargees = 0;
      chargerCameras();
    });
    if (!trouver('it511-depart').value) { trouver('it511-depart').value = DEPART_DEFAUT; }
    trouver('it511-hauteur').value = lire('hauteurPi', '');
    trouver('it511-largeur').value = lire('largeurPi', '');
    ['it511-hauteur', 'it511-largeur'].forEach(function (id) {
      trouver(id).addEventListener('input', function () { afficherConversion(id); });
      afficherConversion(id);
    });
    trouver('it511-sauver-cle').addEventListener('click', function () {
      ecrire('cle', trouver('it511-cle').value.trim());
      message('Clé enregistrée pour toute l’équipe.');
    });
    trouver('it511-calculer').addEventListener('click', calculer);
    trouver('it511-copier-ligne').addEventListener('click', function () { if (dernierResultat) { copier(dernierResultat.enLigne); } });
    trouver('it511-copier-liste').addEventListener('click', function () {
      if (!dernierResultat) { return; }
      var t = dernierResultat.routes.map(function (r) { return r.nom + ' : ' + nombreFr(r.km, 1) + ' km'; }).join(String.fromCharCode(10));
      copier(t + String.fromCharCode(10) + 'Total : ' + nombreFr(dernierResultat.totalKm, 1) + ' km');
    });
    brancherAdresse('depart');
    brancherAdresse('arrivee');
    brancherRecherche();
    trouver('it511-sauver-voyage').addEventListener('click', sauverVoyage);
    trouver('it511-comparer').addEventListener('click', comparerReel);
  }

  return {
    initialize: function (api, state, callback) {
      apiGeotab = api;
      chargerStyleLeaflet();
      creerCarte();
      brancherParametres();
      callback();
    },
    focus: function (api, state) {
      setTimeout(function () { carte.invalidateSize(); }, 300);
      setTimeout(function () { carte.invalidateSize(); }, 1500);
      apiGeotab = api;
      chargerStockage();
      chargerActifs(api);
      rafraichirRadar();
      chargerEntraves(false);
      chargerCameras();
      minuterie = setInterval(function () { chargerActifs(api); rafraichirRadar(); chargerEntraves(false); }, 120000);
    },
    blur: function (api, state) {
      fermerModaleCamera();
      if (minuterie) { clearInterval(minuterie); minuterie = null; }
    }
  };
};
</script>
</head>
<body>
<div id="it511-wrap" style="padding:12px 16px;box-sizing:border-box;">
  <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:10px;">
    <span style="font-size:18px;font-weight:600;">LFS</span>
    <span style="font-size:12px;color:#8a8f98;">version 1.0.3</span>
    <span id="it511-statut" style="font-size:13px;color:#5a6270;">Démarrage...</span>
    <span id="it511-sources" style="font-size:13px;color:#5a6270;"></span>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;">
    <div style="flex:0 0 360px;max-width:100%;border:1px solid #c9ced6;border-radius:6px;padding:14px;box-sizing:border-box;background:#fff;">

      <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Départ</label>
      <div style="position:relative;margin-bottom:10px;">
        <input id="it511-depart" type="text" autocomplete="off" placeholder="125 rue de l’Usine, Beloeil" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        <div id="it511-liste-depart" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;border:1px solid #c9ced6;border-radius:4px;max-height:240px;overflow:auto;"></div>
      </div>

      <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Arrivée</label>
      <div style="position:relative;margin-bottom:10px;">
        <input id="it511-arrivee" type="text" autocomplete="off" placeholder="450 rue King O, Sherbrooke" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        <div id="it511-liste-arrivee" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;border:1px solid #c9ced6;border-radius:4px;max-height:240px;overflow:auto;"></div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:12px;">
        <div style="flex:1;">
          <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Hauteur (pi)</label>
          <input id="it511-hauteur" type="text" placeholder="15'6&quot; ou 15,5" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Largeur (pi)</label>
          <input id="it511-largeur" type="text" placeholder="16' ou 16,0" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:12px;">
        <div style="flex:1;">
          <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Référence</label>
          <input id="it511-ref" type="text" placeholder="17513 ou 17513-2" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:12px;color:#5a6270;margin-bottom:3px;">Actif (facultatif)</label>
          <select id="it511-actif" style="width:100%;box-sizing:border-box;padding:7px 6px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;background:#fff;"><option value="">Aucun</option></select>
        </div>
      </div>

      <button id="it511-calculer" type="button" style="width:100%;padding:9px;border:none;border-radius:4px;background:#1565c0;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">Calculer le trajet</button>

      <div id="it511-message" style="display:none;margin-top:10px;padding:8px 10px;border-radius:4px;font-size:13px;"></div>

      <div id="it511-resultat" style="display:none;margin-top:14px;">
        <div id="it511-titre-resultat" style="font-size:13px;font-weight:600;margin-bottom:8px;"></div>
        <div style="display:flex;gap:10px;margin-bottom:12px;">
          <div style="flex:1;background:#f3f5f8;border-radius:4px;padding:8px 10px;">
            <div style="font-size:12px;color:#5a6270;">Distance totale</div>
            <div id="it511-total" style="font-size:20px;font-weight:600;"></div>
          </div>
          <div style="flex:1;background:#f3f5f8;border-radius:4px;padding:8px 10px;">
            <div style="font-size:12px;color:#5a6270;">Durée estimée</div>
            <div id="it511-duree" style="font-size:20px;font-weight:600;"></div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Routes empruntées</div>
        <div id="it511-routes" style="border-top:1px solid #eef0f3;margin-bottom:10px;"></div>
        <div style="font-size:13px;font-weight:600;margin-bottom:4px;">En ligne</div>
        <div id="it511-enligne" style="font-size:13px;background:#f3f5f8;border-radius:4px;padding:8px 10px;margin-bottom:10px;line-height:1.5;"></div>
        <div style="display:flex;gap:8px;">
          <button id="it511-copier-ligne" type="button" style="flex:1;padding:7px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Copier la ligne</button>
          <button id="it511-copier-liste" type="button" style="flex:1;padding:7px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Copier la liste</button>
        </div>
        <div style="font-size:13px;font-weight:600;margin:12px 0 4px;">Entraves 511</div>
        <div id="it511-entraves"></div>
        <button id="it511-sauver-voyage" type="button" style="width:100%;margin-top:10px;padding:8px;border:none;border-radius:4px;background:#15803d;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Enregistrer le voyage</button>
        <div id="it511-zone-suivi" style="display:none;margin-top:12px;border-top:1px solid #eef0f3;padding-top:10px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Suivi de l’actif</div>
          <div id="it511-suivi" style="font-size:12px;margin-bottom:8px;"></div>
          <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Prévu comparé au réel</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
            <input id="it511-cmp-debut" type="datetime-local" style="flex:1;min-width:140px;padding:5px;border:1px solid #c9ced6;border-radius:4px;font-size:12px;">
            <input id="it511-cmp-fin" type="datetime-local" style="flex:1;min-width:140px;padding:5px;border:1px solid #c9ced6;border-radius:4px;font-size:12px;">
          </div>
          <button id="it511-comparer" type="button" style="width:100%;padding:6px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:12px;cursor:pointer;">Comparer avec le trajet réel</button>
          <div id="it511-comparaison" style="font-size:12px;margin-top:6px;"></div>
        </div>
      </div>

      <div style="margin-top:16px;border-top:1px solid #eef0f3;padding-top:10px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:6px;">Voyages enregistrés</div>
        <div style="position:relative;margin-bottom:8px;">
          <input id="it511-recherche" type="text" autocomplete="off" placeholder="Rechercher une référence (ex. 175)" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <div id="it511-sugg-voyages" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;border:1px solid #c9ced6;border-radius:4px;max-height:220px;overflow:auto;"></div>
        </div>
        <div id="it511-liste-voyages"></div>
      </div>

      <details style="margin-top:16px;border-top:1px solid #eef0f3;padding-top:10px;">
        <summary style="font-size:13px;cursor:pointer;color:#5a6270;">Paramètres</summary>
        <label style="display:block;font-size:12px;color:#5a6270;margin:8px 0 3px;">Clé OpenRouteService</label>
        <div style="display:flex;gap:8px;">
          <input id="it511-cle" type="text" autocomplete="off" style="flex:1;min-width:0;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <button id="it511-sauver-cle" type="button" style="padding:7px 12px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Enregistrer</button>
        </div>
        <label style="display:block;font-size:12px;color:#5a6270;margin:8px 0 3px;">Clé 511 Ontario (facultative)</label>
        <div style="display:flex;gap:8px;">
          <input id="it511-cle-on" type="text" autocomplete="off" style="flex:1;min-width:0;padding:7px 9px;border:1px solid #c9ced6;border-radius:4px;font-size:13px;">
          <button id="it511-sauver-cle-on" type="button" style="padding:7px 12px;border:1px solid #c9ced6;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;">Enregistrer</button>
        </div>
      </details>
      <details style="margin-top:8px;">
        <summary style="font-size:12px;cursor:pointer;color:#5a6270;">Détail technique du trajet (soutien)</summary>
        <div id="it511-diagnostic" style="max-height:260px;overflow:auto;margin-top:6px;"></div>
      </details>
    </div>

    <div style="flex:1 1 480px;min-width:300px;">
      <div id="it511-carte" style="height:78vh;min-height:460px;width:100%;border:1px solid #c9ced6;border-radius:6px;"></div>
    </div>
  </div>
</div>
</body>
</html>
