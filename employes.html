<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bonneville - Employés</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://ericgloutnez.github.io/LFS/bonneville-commun.js?v=1.1.0"></script>
</head>
<body>
<div id="be">
<style>
  #be { --encre: #14191e; --doux: #4f5963; --ligne: #d3d8dd; --fond: #eef0f2; --surface: #ffffff; --bande: #e3e6e9; --accent: #f2a900; --ok: #1b7f3b; --non: #b42318; --orange: #9a5b00; --bleu: #1f4f8a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--encre); background: var(--fond); min-height: 100vh; }
  #be * { box-sizing: border-box; }
  #be button, #be input, #be select { font-family: inherit; }
  #be .entete { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--ligne); position: sticky; top: 0; z-index: 20; }
  #be .entete img { height: 18px; }
  #be .entete .sep { width: 1px; height: 26px; background: var(--ligne); }
  #be .entete .titre { font-size: 19px; font-weight: 800; }
  #be .onglets { display: flex; gap: 4px; margin-left: 16px; }
  #be .onglets button { height: 38px; padding: 0 14px; border: none; border-radius: 8px; background: transparent; color: var(--doux); font-size: 14px; font-weight: 700; cursor: pointer; }
  #be .onglets button.on { background: var(--bande); color: var(--encre); }
  #be .version { margin-left: auto; font-size: 12px; color: var(--doux); }
  #be main { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  #be .barre { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  #be label.champ { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--doux); }
  #be input[type=text], #be input[type=date], #be input[type=number], #be select { height: 38px; border: 1px solid var(--ligne); border-radius: 8px; padding: 0 10px; font-size: 14px; color: var(--encre); background: var(--surface); }
  #be .btn { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--surface); color: var(--encre); font-size: 14px; font-weight: 700; cursor: pointer; }
  #be .btn.noir { background: var(--encre); color: #fff; border-color: var(--encre); }
  #be .btn.jaune { background: var(--accent); border-color: var(--accent); color: var(--encre); }
  #be .btn.rouge { color: var(--non); border-color: var(--non); }
  #be .btn:disabled { opacity: .5; cursor: default; }
  #be .tableau { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; overflow: auto; }
  #be table { border-collapse: collapse; width: 100%; font-size: 14px; }
  #be th { background: var(--bande); color: var(--doux); font-size: 12px; font-weight: 700; text-align: left; padding: 9px 10px; position: sticky; top: 0; }
  #be th.c, #be td.c { text-align: center; }
  #be td { border-top: 1px solid var(--ligne); padding: 8px 10px; vertical-align: middle; }
  #be tr.modifie td { background: #fffaf0; }
  #be td input[type=checkbox], #be th input[type=checkbox] { width: 17px; height: 17px; }
  #be .puce { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  #be .puce.gris { background: var(--bande); color: var(--encre); }
  #be .puce.orange { background: #fff3dc; color: var(--orange); }
  #be .puce.vert { background: #e6f2ea; color: var(--ok); }
  #be .puce.noir { background: var(--encre); color: #fff; }
  #be .aide { font-size: 13px; color: var(--doux); }
  #be .message { padding: 10px 14px; border-radius: 10px; background: #e6f2ea; color: var(--ok); font-weight: 600; font-size: 14px; }
  #be .message.erreur { background: #fdecea; color: var(--non); }
  #be .refus { margin: 80px auto; max-width: 520px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 16px; padding: 28px; text-align: center; }
  #be .refus h2 { margin: 10px 0; font-size: 22px; }
  #be .fond-panneau { position: fixed; inset: 0; background: rgba(10,14,18,.45); z-index: 50; display: flex; justify-content: flex-end; }
  #be .panneau { width: min(900px, 100%); height: 100%; overflow: auto; background: var(--fond); padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  #be .grille2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 900px) { #be .grille2 { grid-template-columns: 1fr; } }
  #be .carte { background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #be .carte.conf { border: 2px solid var(--orange); }
  #be .carte h3 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #be .conf-badge { font-size: 12px; color: var(--orange); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
  #be .ligne-case { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  #be .liste-cases { border: 1px solid var(--ligne); border-radius: 8px; padding: 6px; max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  #be .liste-cases label { display: flex; align-items: center; gap: 8px; padding: 4px; font-size: 14px; }
  #be .liste-cases .note { margin-left: auto; font-size: 12px; color: var(--doux); }
  #be .mini { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--ligne); border-radius: 8px; overflow: hidden; }
  #be .mini th { position: static; }
  #be .jours7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  #be .jours7 input { width: 100%; }
  #be .btn.be-note { background: #ffffff; }
  #be .btn.be-note.pleine { background: #c9ced4; border-color: #a7aeb6; color: var(--encre); }
  #be .fond-modale { position: fixed; inset: 0; z-index: 60; background: rgba(10,14,18,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #be .modale { width: min(560px, 100%); background: var(--surface); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  #be .modale h2 { margin: 0; font-size: 20px; }
  #be .modale textarea { width: 100%; min-height: 180px; border: 1px solid var(--ligne); border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; resize: vertical; }
  #be .profils { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
</style>

<div class="entete">
  <img id="be-logo" alt="Bonneville" src="https://ericgloutnez.github.io/LFS/logo-bonneville.png">
  <span class="sep"></span>
  <span class="titre">Employés</span>
  <nav class="onglets" id="be-onglets">
    <button type="button" data-o="employes" class="on">Employés</button>
    <button type="button" data-o="profils">Profils</button>
    <button type="button" data-o="regles">Règles de rémunération</button>
    <button type="button" data-o="parametres">Paramètres</button>
  </nav>
  <span class="version" style="margin-left:auto;margin-right:12px;">Réservé au rôle Administrateur de MyGeotab</span>
  <span class="version" id="be-version" style="margin-left:0"></span>
</div>
<div id="be-contenu"><main><div class="aide">Chargement…</div></main></div>
</div>

<script>
geotab.addin.employes = function () {
  'use strict';
  var B = window.Bonneville;
  var VERSION = '1.1.0';
  var G = null, moi = '', onglet = 'employes';
  var users = [], employes = {}, profils = [], paies = {}, param = null, groupesGeotab = [];
  var modifies = {}, filtre = { texte: '', profil: '', inactifs: false, masques: false }, message = null, notes = {};

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nomUser(u) { var x = users.filter(function (y) { return y.user === u; })[0]; return x ? x.nom : u; }
  function profilDe(pid) { return profils.filter(function (p) { return p.d.pid === pid; })[0]; }
  function profilsD() { return profils.map(function (p) { return p.d; }); }
  function empD(u) { return (modifies[u]) || (employes[u] ? employes[u].d : null); }
  function droits(u) { return B.droitsEffectifs(empD(u), profilsD()); }
  function dire(t, erreur) { message = { t: t, e: !!erreur }; rendre(); }

  // ---------- Chargement
  function charger() {
    return Promise.all([
      G.utilisateurs(),
      G.lireTypes(['employe', 'profil', 'parametresEmployes', 'acces', 'reglesPaie']),
      G.lireType('paie').catch(function () { return []; }),
      G.appel('Get', { typeName: 'Group' }).catch(function () { return []; }),
      G.lireType('noteEmploye').catch(function () { return []; })
    ]).then(function (r) {
      users = r[0]; employes = {}; profils = []; param = null; paies = {}; notes = {};
      (r[4] || []).forEach(function (l) { var su = l.details.sujet || l.details.user; if (su) { notes[su] = { id: l.id, d: l.details }; } });
      r[1].forEach(function (l) {
        var d = l.details;
        if (d.type === 'employe' && d.user) { employes[d.user] = { id: l.id, d: d }; }
        else if (d.type === 'profil') { profils.push({ id: l.id, d: d }); }
        else if (d.type === 'parametresEmployes') { param = { id: l.id, d: d }; }
        else if (d.type === 'acces') { ancienAcces = { id: l.id, d: d }; }
        else if (d.type === 'reglesPaie') { reglesRec = { id: l.id, d: d }; }
      });
      r[2].forEach(function (l) { if (l.details.user) { paies[l.details.user] = { id: l.id, d: l.details, groups: l.groups }; } });
      groupesGeotab = (r[3] || []).filter(function (g) { return g.name && g.id; }).map(function (g) { return { id: g.id, nom: g.name }; })
        .sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
      if (!profils.length) { return creerProfilsDefaut().then(charger); }
      var ancienAdmin = profils.filter(function (p) { return p.d.pid === 'administrateur' && (p.d.nom === 'Administrateur' || p.d.nom === 'Administrateur Tempo'); })[0];
      if (ancienAdmin) {
        var na = JSON.parse(JSON.stringify(ancienAdmin.d)); na.nom = 'Administrateur Heures & Dépenses';
        return G.modifier(ancienAdmin.id, na).then(charger);
      }
      if (!profils.some(function (p) { return p.d.pid === 'administrateur' || p.d.role === 'administrateur'; })) {
        var pa = B.PROFILS_DEFAUT[0];
        return G.ajouter({ type: 'profil', pid: pa.pid, nom: pa.nom, role: pa.role, droits: pa.droits }).then(charger);
      }
      modifies = {};
      rendre();
    });
  }
  var ancienAcces = null, reglesRec = null, reglesEdition = null, reglesDepuis = '';
  function creerProfilsDefaut() {
    var c = Promise.resolve();
    B.PROFILS_DEFAUT.forEach(function (p) {
      c = c.then(function () { return G.ajouter({ type: 'profil', pid: p.pid, nom: p.nom, role: p.role, droits: p.droits }); });
    });
    return c;
  }

  // ---------- Rendu général
  function rendre() {
    Array.prototype.forEach.call(document.querySelectorAll('#be-onglets button'), function (b) { b.className = b.getAttribute('data-o') === onglet ? 'on' : ''; });
    var html = '<main>' + (message ? '<div class="message' + (message.e ? ' erreur' : '') + '">' + h(message.t) + '</div>' : '');
    if (onglet === 'employes') { html += vueEmployes(); }
    else if (onglet === 'profils') { html += vueProfils(); }
    else if (onglet === 'regles') { html += vueRegles(); }
    else { html += vueParametres(); }
    $('be-contenu').innerHTML = html + '</main>';
    brancherVue();
  }

  // ---------- Employés
  function usersFiltres() {
    var t = filtre.texte.toLowerCase();
    return users.filter(function (u) {
      if (!filtre.inactifs && !u.actif) { return false; }
      var em = empD(u.user);
      if (!filtre.masques && em && em.masque) { return false; }
      if (t && u.nom.toLowerCase().indexOf(t) < 0 && u.user.toLowerCase().indexOf(t) < 0) { return false; }
      if (filtre.profil) { var e = empD(u.user); if (filtre.profil === '-') { return !e || !e.profil; } if (!e || e.profil !== filtre.profil) { return false; } }
      return true;
    });
  }
  function optionsProfils(sel, vide) {
    return (vide ? '<option value="">' + h(vide) + '</option>' : '') + profils.map(function (p) { return '<option value="' + h(p.d.pid) + '"' + (p.d.pid === sel ? ' selected' : '') + '>' + h(p.d.nom) + '</option>'; }).join('');
  }
  function vueEmployes() {
    var nbMod = Object.keys(modifies).length;
    var html = '<div class="barre">'
      + '<label class="champ">Rechercher<input type="text" id="be-f-texte" value="' + h(filtre.texte) + '" placeholder="Nom ou courriel"></label>'
      + '<label class="champ">Profil<select id="be-f-profil"><option value="">Tous</option><option value="-"' + (filtre.profil === '-' ? ' selected' : '') + '>Sans profil</option>' + optionsProfils(filtre.profil) + '</select></label>'
      + '<label class="ligne-case" style="height:38px"><input type="checkbox" id="be-f-inactifs"' + (filtre.inactifs ? ' checked' : '') + '> Comptes inactifs</label>'
      + '<label class="ligne-case" style="height:38px"><input type="checkbox" id="be-f-masques"' + (filtre.masques ? ' checked' : '') + '> Personnes masquées (' + Object.keys(employes).filter(function (k) { return employes[k].d.masque; }).length + ')</label>'
      + '<button type="button" class="btn" id="be-masquer-lot" style="align-self:flex-end">Masquer la sélection</button>'
      + '<span style="margin-left:auto"></span>'
      + '<label class="champ">Appliquer un profil à la sélection<span style="display:flex;gap:6px"><select id="be-profil-lot">' + optionsProfils('', 'Choisir…') + '</select><button type="button" class="btn" id="be-appliquer">Appliquer</button></span></label>'
      + '<button type="button" class="btn jaune" id="be-sauver"' + (nbMod ? '' : ' disabled') + '>Enregistrer les changements' + (nbMod ? ' (' + nbMod + ')' : '') + '</button></div>';
    html += '<div class="tableau"><table><thead><tr><th class="c"><input type="checkbox" id="be-tout" aria-label="Tout sélectionner"></th><th>Employé</th><th>Profil</th>'
      + B.DROITS.map(function (d) { return '<th class="c" style="min-width:70px">' + h(d.nom.replace(/ \(.*\)$/, '')) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>';
    usersFiltres().forEach(function (u) {
      var e = empD(u.user), dr = droits(u.user), perso = e && e.droits;
      html += '<tr data-u="' + h(u.user) + '"' + (modifies[u.user] ? ' class="modifie"' : '') + '>'
        + '<td class="c"><input type="checkbox" class="be-sel" aria-label="Sélectionner ' + h(u.nom) + '"></td>'
        + '<td><b>' + h(u.nom) + '</b>' + (e && e.masque ? ' <span class="puce gris">Masqué</span>' : '') + '<div class="aide">' + h(u.user) + '</div></td>'
        + '<td><select class="be-profil">' + optionsProfils(e ? e.profil : '', 'Aucun') + '</select>' + (perso ? ' <span class="puce orange" title="Droits modifiés par rapport au profil">Personnalisé</span>' : '') + '</td>'
        + B.DROITS.map(function (d) { return '<td class="c"><input type="checkbox" class="be-droit" data-d="' + d.cle + '" aria-label="' + h(d.nom) + ' : ' + h(u.nom) + '"' + (dr[d.cle] ? ' checked' : '') + '></td>'; }).join('')
        + '<td style="white-space:nowrap"><button type="button" class="btn be-fiche">Fiche</button> '
        + '<button type="button" class="btn be-note' + (notes[u.user] && notes[u.user].d.texte ? ' pleine' : '') + '" title="' + (notes[u.user] && notes[u.user].d.texte ? 'Une note est inscrite' : 'Aucune note') + '">Notes</button> '
        + '<br><button type="button" class="btn be-masquer" style="height:auto;border:none;background:none;color:var(--bleu);text-decoration:underline;padding:4px 0 0;font-size:12px">' + (e && e.masque ? 'Afficher' : 'Masquer') + '</button></td></tr>';
    });
    html += '</tbody></table></div><div class="aide">Ces accès sont lus par Bonneville - Logistique, Bonneville Transport Drive et Heures &amp; Dépenses. Un droit modifié à la main rend l’employé « Personnalisé » : il ne suit plus les changements de son profil.</div>';
    return html;
  }
  function modifierEmploye(u, f) {
    var base = empD(u) ? JSON.parse(JSON.stringify(empD(u))) : { type: 'employe', user: u, profil: '', tauxKm: [] };
    f(base);
    modifies[u] = base;
  }

  // ---------- Fiche
  var ficheUser = null, ficheEmp = null, fichePaie = null;
  function ouvrirFiche(u) {
    ficheUser = u;
    ficheEmp = JSON.parse(JSON.stringify(empD(u) || { type: 'employe', user: u, profil: '', tauxKm: [] }));
    ficheEmp.tauxKm = ficheEmp.tauxKm || [];
    fichePaie = JSON.parse(JSON.stringify(paies[u] ? paies[u].d : { type: 'paie', user: u, mode: 'unique', unique: [], jours: [], exceptions: [] }));
    rendreFiche();
  }
  function fermerFiche() { var f = $('be-fiche'); if (f) { f.parentNode.removeChild(f); } ficheUser = null; }
  function equipeDe(chefUser) { return (chefUser === ficheUser ? ficheEmp.equipe : (empD(chefUser) || {}).equipe) || []; }
  function rendreFiche() {
    fermerFicheDom();
    var u = ficheUser, dr = B.droitsEffectifs(ficheEmp, profilsD());
    var aujour = B.jourIso();
    var html = '<div class="panneau" role="dialog" aria-label="Fiche de ' + h(nomUser(u)) + '">'
      + '<div class="barre" style="align-items:center"><button type="button" class="btn" id="bf-fermer">‹ Fermer</button><span style="font-size:22px;font-weight:800">' + h(nomUser(u)) + '</span><span class="aide">' + h(u) + '</span><span style="margin-left:auto"></span><button type="button" class="btn jaune" id="bf-sauver">Enregistrer la fiche</button></div>'
      + '<div class="grille2"><div style="display:flex;flex-direction:column;gap:14px">'
      + '<section class="carte"><h3>Profil et accès</h3><label class="champ">Profil<select id="bf-profil">' + optionsProfils(ficheEmp.profil, 'Aucun') + '</select></label>'
      + B.DROITS.map(function (d) { return '<label class="ligne-case"><input type="checkbox" class="bf-droit" data-d="' + d.cle + '"' + (dr[d.cle] ? ' checked' : '') + '>' + h(d.nom) + '</label>'; }).join('')
      + (ficheEmp.droits ? '<button type="button" class="btn" id="bf-profil-retour">Revenir aux droits du profil</button>' : '') + '</section>';
    if (dr.chef) {
      var eq = ficheEmp.equipe || [];
      html += '<section class="carte"><h3>Son équipe</h3><input type="text" id="bf-eq-filtre" placeholder="Rechercher un employé"><div class="liste-cases" id="bf-equipe">'
        + users.filter(function (x) { return x.actif && x.user !== u; }).map(function (x) {
          var autre = Object.keys(employes).filter(function (k) { return k !== u && (empD(k) && (empD(k).equipe || []).indexOf(x.user) >= 0); })[0];
          return '<label data-nom="' + h(x.nom.toLowerCase()) + '"><input type="checkbox" class="bf-membre" value="' + h(x.user) + '"' + (eq.indexOf(x.user) >= 0 ? ' checked' : '') + '>' + h(x.nom) + (autre ? '<span class="note">équipe de ' + h(nomUser(autre)) + '</span>' : '') + '</label>';
        }).join('') + '</div><div class="aide">Un employé ne peut appartenir qu’à une équipe : le cocher ici le retire de son autre équipe à l’enregistrement.</div>'
        + '<label class="champ">Remplaçant pendant une absence (facultatif)<select id="bf-remplacant"><option value="">Aucun</option>'
        + users.filter(function (x) { return x.user !== u && droits(x.user).chef; }).map(function (x) { return '<option value="' + h(x.user) + '"' + (ficheEmp.remplacant === x.user ? ' selected' : '') + '>' + h(x.nom) + '</option>'; }).join('')
        + '</select></label></section>';
    }
    html += '<section class="carte"><h3>Taux kilométrage ($/km)</h3>' + tableTaux(ficheEmp.tauxKm, 'km')
      + '<div class="barre"><label class="champ">Taux ($/km)<input type="number" step="0.01" min="0" id="bf-km-taux" style="width:120px"></label><label class="champ">En vigueur à partir du<input type="date" id="bf-km-depuis" value="' + aujour + '"></label><button type="button" class="btn noir" id="bf-km-ajouter">Ajouter ce taux</button></div>'
      + '<div class="aide">Visible par l’employé dans Drive pour calculer son remboursement. Chaque journée utilise le taux en vigueur à sa date.</div></section>';
    html += '</div><div style="display:flex;flex-direction:column;gap:14px">' + carteRemun() + carteConfidentielle() + '</div></div></div>';
    var fond = document.createElement('div');
    fond.className = 'fond-panneau'; fond.id = 'be-fiche'; fond.innerHTML = html;
    $('be').appendChild(fond);
    brancherFiche();
  }
  function fermerFicheDom() { var f = $('be-fiche'); if (f) { f.parentNode.removeChild(f); } }
  function tableTaux(liste, quoi) {
    if (!liste || !liste.length) { return '<div class="aide">Aucun taux inscrit.</div>'; }
    return '<table class="mini"><thead><tr><th>Taux</th><th>En vigueur depuis</th><th></th></tr></thead><tbody>'
      + liste.slice().sort(function (a, b) { return String(b.depuis).localeCompare(String(a.depuis)); }).map(function (t) {
        return '<tr><td><b>' + h(Number(t.taux).toLocaleString('fr-CA', { minimumFractionDigits: 2, maximumFractionDigits: 4 })) + ' $' + (quoi === 'km' ? '/km' : '/h') + '</b></td><td>' + h(t.depuis) + '</td><td><button type="button" class="btn rouge bf-retirer-taux" data-q="' + quoi + '" data-depuis="' + h(t.depuis) + '">Retirer</button></td></tr>';
      }).join('') + '</tbody></table>';

    };
  }

  window.BonnevilleModule = { aller: function (nom, valeur) { onglet = nom || 'employes'; if (onglet === 'regles') { reglesEdition = null; } if (valeur === 'sansProfil') { filtre.profil = '-'; } message = null; if (users.length) { rendre(); } } };
  function refuser() {
    $('be-onglets').style.display = 'none';
    $('be-contenu').innerHTML = '<div class="refus"><div style="font-size:40px">🔒</div><h2>Accès réservé aux administrateurs MyGeotab</h2><p class="aide">Bonneville - Employés demande le rôle de sécurité <b>Administrateur dans MyGeotab</b> (Utilisateurs → Autorisation de sécurité). Le profil « Administrateur Heures &amp; Dépenses » ne suffit pas. Adresse-toi à un administrateur Geotab de Bonneville.</p></div>';
  }

  return {
    initialize: function (api, state, callback) {
      try {
        G = B.creerApi(api);
        $('be-version').textContent = 'version ' + VERSION;
        Array.prototype.forEach.call(document.querySelectorAll('#be-onglets button'), function (b) {
          b.onclick = function () { onglet = b.getAttribute('data-o'); message = null; rendre(); };
        });
      } catch (e) { console.warn(e); }
      callback();
    },
    focus: function (api) {
      G = B.creerApi(api);
      G.session().then(function (s) {
        moi = s.userName || '';
        return G.estAdministrateur(moi);
      }).then(function (admin) {
        if (!admin) { refuser(); return; }
        $('be-onglets').style.display = '';
        return charger();
      }).catch(function (e) {
        $('be-contenu').innerHTML = '<main><div class="message erreur">Lecture impossible : ' + h(e && e.message ? e.message : e) + '</div></main>';
      });
    },
    blur: function () {}
  };
};

// Noms possibles donnés par MyGeotab ou Drive selon la configuration (nom de l'extension ou du fichier)
(function (noms, f) {
  var vus = {};
  noms.forEach(function (n) {
    var sans = n.normalize ? n.normalize('NFD').replace(/[\u0300-\u036f]/g, '') : n;
    [n, sans].forEach(function (x) {
      var mots = x.split(/[^A-Za-z0-9\u00C0-\u00FF]+/).filter(Boolean);
      if (!mots.length) { return; }
      var camel = mots[0].charAt(0).toLowerCase() + mots[0].slice(1) + mots.slice(1).map(function (m) { return m.charAt(0).toUpperCase() + m.slice(1); }).join('');
      var camelBas = mots[0].toLowerCase() + mots.slice(1).map(function (m) { return m.charAt(0).toUpperCase() + m.slice(1).toLowerCase(); }).join('');
      [x, camel, camelBas, camel.charAt(0).toUpperCase() + camel.slice(1), camel.toLowerCase(), mots.join(''), mots.join('-'), mots.join('-').toLowerCase(), mots.join('_').toLowerCase(), mots.join(' ')].forEach(function (v) { vus[v] = 1; });
    });
  });
  Object.keys(vus).forEach(function (v) { if (!window.geotab.addin[v]) { window.geotab.addin[v] = f; } });
})(["Bonneville - Employés", "Bonneville Employés", "Bonneville - Employes", "employes", "employés"], geotab.addin.employes);
