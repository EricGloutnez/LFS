<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonneville - Tempo</title>
<script src="https://ericgloutnez.github.io/LFS/bonneville-commun.js?v=1.0.4"></script>
</head>
<body>
<div id="bh" data-theme="jour">
<style>
  #bh { --encre: #14191e; --doux: #4f5963; --ligne: #d3d8dd; --fond: #eef0f2; --surface: #ffffff; --bande: #e3e6e9; --accent: #f2a900; --ok: #1b7f3b; --non: #b42318; --orange: #9a5b00; --bleu: #1f4f8a; --carte-noire: #14191e;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--encre); background: var(--fond); min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); -webkit-text-size-adjust: 100%; }
  #bh[data-theme="nuit"] { --encre: #edf0f3; --doux: #a3adb7; --fond: #12161a; --surface: #1d2329; --ligne: #2f3842; --bande: #2a323a; --carte-noire: #000000; }
  #bh * { box-sizing: border-box; }
  #bh button, #bh input, #bh select { font-family: inherit; color: inherit; }
  #bh .entete { position: sticky; top: 0; z-index: 20; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--ligne); }
  #bh .entete img { height: 20px; }
  #bh[data-theme="nuit"] .entete img { filter: invert(1); }
  #bh .pastille { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--ok); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
  #bh .pastille.hors { background: var(--non); } #bh .pastille.attente { background: #b26b00; }
  #bh .rond { width: 46px; height: 46px; border-radius: 23px; border: 2px solid var(--ligne); background: var(--surface); display: flex; align-items: center; justify-content: center; padding: 0; text-decoration: none; color: var(--encre); }
  #bh .rond.tel { background: var(--ok); border-color: var(--ok); color: #fff; }
  #bh .ecran { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  #bh .carte { background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #bh .carte h2 { margin: 0; font-size: 17px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #bh .noire { background: var(--carte-noire); color: #fff; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #bh .noire .sous { color: #c9d1d8; font-size: 15px; }
  #bh .grand { font-size: 52px; font-weight: 800; line-height: 1; }
  #bh .moyen { font-size: 32px; font-weight: 800; line-height: 1.05; }
  #bh .rangee { display: flex; gap: 10px; align-items: center; }
  #bh .btn { flex: 1; min-height: 54px; border-radius: 12px; border: 2px solid var(--ligne); background: var(--surface); font-size: 17px; font-weight: 800; cursor: pointer; padding: 6px 12px; }
  #bh .btn.jaune { background: var(--accent); border-color: var(--accent); color: #14191e; }
  #bh .btn.sombre { background: #2c343c; border-color: #2c343c; color: #fff; }
  #bh .btn.noir { background: var(--encre); border-color: var(--encre); color: var(--fond); }
  #bh .btn.rouge { color: var(--non); border-color: var(--non); }
  #bh .btn.lien { flex: 0 0 auto; min-height: 40px; font-size: 14px; border-width: 1px; }
  #bh .btn:disabled { opacity: .45; }
  #bh .noire .btn.lien { background: transparent; border-color: #5b6672; color: #fff; }
  #bh .puce { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  #bh .puce.gris { background: var(--bande); color: var(--encre); } #bh .puce.orange { background: #fff3dc; color: var(--orange); }
  #bh .puce.vert { background: #e6f2ea; color: var(--ok); } #bh .puce.rouge { background: #fdecea; color: var(--non); }
  #bh .puce.ok { background: var(--ok); color: #fff; } #bh .puce.sombre { background: #2c343c; color: #fff; }
  #bh .aide { font-size: 13px; color: var(--doux); line-height: 1.35; }
  #bh .ligne { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ligne); align-items: center; }
  #bh .ligne:last-child { border-bottom: none; }
  #bh .barre-couleur { width: 6px; align-self: stretch; border-radius: 3px; background: var(--bleu); flex: 0 0 auto; }
  #bh .barre-couleur.ok { background: var(--ok); } #bh .barre-couleur.gris { background: var(--doux); }
  #bh .t { font-weight: 800; font-size: 17px; } #bh .s { font-size: 13px; color: var(--doux); }
  #bh .lien-a { color: var(--bleu); font-weight: 700; font-size: 13px; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  #bh[data-theme="nuit"] .lien-a { color: #8fb8ea; }
  #bh .alerte { border-radius: 12px; background: #fdecea; color: var(--non); padding: 12px; font-weight: 700; font-size: 14px; line-height: 1.35; }
  #bh .ok-msg { border-radius: 12px; background: #e6f2ea; color: var(--ok); padding: 12px; font-weight: 700; font-size: 14px; }
  #bh .chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  #bh .chiffre { padding-left: 8px; box-shadow: inset 4px 0 0 var(--accent); display: flex; flex-direction: column; }
  #bh .chiffre b { font-size: 20px; } #bh .chiffre span { font-size: 12px; color: var(--doux); }
  #bh input.champ { height: 52px; border: 2px solid var(--ligne); border-radius: 10px; padding: 0 12px; font-size: 18px; font-weight: 700; background: var(--surface); width: 100%; }
  #bh input.gros { height: 72px; border: 2px solid var(--encre); border-radius: 12px; padding: 0 16px; font-size: 32px; font-weight: 800; background: var(--surface); width: 100%; }
  #bh .case-h { width: 96px; height: 76px; border: 3px solid var(--encre); border-radius: 14px; text-align: center; font-size: 40px; font-weight: 800; background: var(--surface); }
  #bh .choix { flex: 1; min-height: 52px; border-radius: 12px; border: 2px solid var(--ligne); background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; }
  #bh .choix.on { border: 3px solid var(--encre); background: #fff7df; color: #14191e; }
  #bh .voyage-btn { width: 100%; min-height: 54px; border-radius: 12px; border: 1px solid var(--ligne); background: var(--surface); text-align: left; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
  #bh .voyage-btn.on { border: 3px solid var(--encre); background: #fff7df; color: #14191e; }
  #bh .onglets { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface); border-top: 1px solid var(--ligne); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #bh .onglets button { flex: 1; height: 70px; border: none; background: var(--surface); color: var(--doux); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; cursor: pointer; position: relative; }
  #bh .onglets button.on { color: var(--encre); font-weight: 800; box-shadow: inset 0 4px 0 var(--accent); }
  #bh .onglets .badge { position: absolute; top: 6px; right: calc(50% - 26px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--non); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  #bh .fond-feuille { position: fixed; inset: 0; z-index: 60; background: rgba(10,14,18,.55); display: flex; align-items: flex-end; }
  #bh .feuille { width: 100%; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  #bh .feuille h1 { margin: 0; font-size: 22px; }
  #bh .poignee { width: 44px; height: 5px; border-radius: 3px; background: var(--ligne); align-self: center; }
  #bh .semaine-l { display: grid; grid-template-columns: 70px 1fr 1fr 0.8fr auto; gap: 6px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--ligne); font-size: 15px; font-weight: 600; width: 100%; background: none; border-left: none; border-right: none; border-top: none; text-align: left; cursor: pointer; }
  #bh .semaine-l.titre { font-size: 12px; color: var(--doux); font-weight: 700; cursor: default; }
  #bh .bas-fixe { position: sticky; bottom: 70px; background: var(--surface); border-top: 1px solid var(--ligne); padding: 12px 14px; display: flex; gap: 10px; margin: 0 -14px -14px; }
  @media (min-width: 700px) { #bh .ecran, #bh .entete { max-width: 720px; margin-left: auto; margin-right: auto; } }
</style>

<div class="entete">
  <img id="bh-logo" alt="Bonneville" src="https://ericgloutnez.github.io/LFS/logo-bonneville.png">
  <span id="bh-pastille" class="pastille">En ligne</span>
  <button type="button" class="rond" id="bh-theme" aria-label="Mode nuit"><svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg></button>
  <a class="rond tel" href="tel:4389782162" aria-label="Appeler Bonneville au (438) 978-2162"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path></svg></a>
</div>
<div id="bh-contenu"><div class="ecran"><div class="aide">Chargement…</div></div></div>
<nav class="onglets" id="bh-onglets"></nav>
</div>

<script>
(function () {
  'use strict';
  var VERSION = '1.1.0';
  var B = window.Bonneville;
  var G = null, api = null, moi = '', monNom = '';
  var employes = {}, profils = [], monEmp = null, droits = {}, voyages = [], journees = {}, equipeJ = [], maPaie = lire('bh-paie') || null;
  var ecran = 'journee', dateSel = null, semaineSel = null, feuille = null, horsReseau = false, pret = false, branche = false;
  var CLE_CACHE = 'bh-cache', CLE_THEME = 'bh-theme';
  var minuterie = null;

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lire(c) { try { var v = localStorage.getItem(c); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function ecrire(c, v) { try { localStorage.setItem(c, JSON.stringify(v)); } catch (e) {} }
  function aujour() { return B.jourIso(); }
  function nomUser(u) { var e = employes[u]; return (e && e.nom) || u; }
  function estCommissionnaire() { return !!droits.tousVoyages; }
  function voyageDe(serie) { return voyages.filter(function (v) { return String(v.d.ref).split('-')[0] === serie || v.d.ref === serie; })[0]; }
  function libelleVoyage(serie) {
    if (!serie) { return 'Sans voyage (temps général)'; }
    var v = voyageDe(serie);
    return v ? ((v.d.depart && v.d.depart.label ? String(v.d.depart.label).split(',')[0] : '?') + ' vers ' + (v.d.arrivee && v.d.arrivee.label ? String(v.d.arrivee.label).split(',')[0] : '?')) : '';
  }

  // ---------- Thème
  function appliquerTheme(t) { var r = $('bh'); if (r) { r.setAttribute('data-theme', t); } }
  function themeInitial() {
    var t = lire(CLE_THEME);
    if (t !== 'jour' && t !== 'nuit') { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'nuit' : 'jour'; }
    appliquerTheme(t);
  }

  // ---------- Pastille et file d'envoi
  function enAttente() { return Object.keys(journees).filter(function (k) { return journees[k]._attente; }).length; }
  function majPastille() {
    var p = $('bh-pastille'); if (!p) { return; }
    var n = enAttente();
    if (n) { p.className = 'pastille attente'; p.textContent = n + ' envoi' + (n > 1 ? 's' : '') + ' en attente'; }
    else if (horsReseau || navigator.onLine === false) { p.className = 'pastille hors'; p.textContent = 'Hors réseau'; }
    else { p.className = 'pastille'; p.textContent = 'En ligne'; }
  }
  function garderCache() {
    var limite = B.ajouterJours(aujour(), -30), garde = {};
    Object.keys(journees).forEach(function (k) {
      var j = journees[k];
      if (j.d.statut === 'approuvee' && String(j.d.approuveLe || k).slice(0, 10) < limite) { return; }
      garde[k] = j;
    });
    ecrire(CLE_CACHE, { date: new Date().toISOString(), employes: employes, profils: profils, voyages: voyages, journees: garde, moi: moi });
  }
  var enCours = {};
  function sauver(date) {
    var j = journees[date]; if (!j) { return Promise.resolve(); }
    j.d.maj = new Date().toISOString();
    j._attente = true; garderCache(); majPastille();
    if (enCours[date]) { enCours[date].encore = true; return enCours[date].p; }
    var etat = { encore: false };
    etat.p = G.enregistrer(j.id ? { id: j.id } : null, j.d).then(function (id) {
      j.id = id; j._attente = false; horsReseau = false;
    }).catch(function () { horsReseau = true; }).then(function () {
      delete enCours[date]; garderCache(); majPastille();
      if (etat.encore) { return sauver(date); }
    });
    enCours[date] = etat;
    return etat.p;
  }
  function viderFile() { Object.keys(journees).forEach(function (k) { if (journees[k]._attente && !enCours[k]) { sauver(k); } }); }

  // ---------- Chargement
  function charger() {
    var lu = Promise.all([
      G.lireTypes(['employe', 'profil', 'voyage']),
      G.lireChamp('journee', 'user', moi)
    ]).then(function (r) {
      employes = {}; profils = []; voyages = [];
      r[0].forEach(function (l) {
        var d = l.details;
        if (d.type === 'employe' && d.user) { employes[d.user] = d; }
        else if (d.type === 'profil') { profils.push(d); }
        else if (d.type === 'voyage' && !d.archive) { voyages.push({ id: l.id, d: d }); }
      });
      var serveur = {};
      r[1].forEach(function (l) { serveur[l.details.date] = { id: l.id, d: l.details }; });
      // Les journées locales en attente d'envoi gardent la priorité
      Object.keys(journees).forEach(function (k) { if (journees[k]._attente) { serveur[k] = journees[k]; } });
      journees = serveur;
      horsReseau = false;
    }).catch(function () {
      horsReseau = true;
      var c = lire(CLE_CACHE);
      if (c && c.moi === moi) { employes = c.employes || {}; profils = c.profils || []; voyages = c.voyages || []; journees = c.journees || {}; }
    });
    return lu.then(function () {
      monEmp = employes[moi] || null;
      droits = B.droitsEffectifs(monEmp, profils);
      var tous = voyages;
      voyages = droits.tousVoyages ? tous : tous.filter(function (v) { return (v.d.assignes || []).indexOf(moi) >= 0; });
      voyages.sort(function (a, b) { return String(a.d.departDate || a.d.date || '').localeCompare(String(b.d.departDate || b.d.date || '')); });
      garderCache();
      return chargerMaPaie().then(function () { if (droits.chef) { return chargerEquipe(); } });
    }).then(function () { pret = true; viderFile(); rendre(); });
  }
  // Mon taux horaire : on ne lit QUE mon enregistrement (jamais ceux des autres).
  function chargerMaPaie() {
    return G.appel('Get', { typeName: 'AddInData', search: { addInId: B.ADDIN_ID, whereClause: 'user = "' + moi + '"' } }).then(function (l) {
      var x = (l || []).filter(function (y) { return y.details && y.details.type === 'paie' && y.details.user === moi; })[0];
      maPaie = x ? x.details : null; ecrire('bh-paie', maPaie);
    }).catch(function () {});
  }
  function payeBrute(j) {
    if (!maPaie || !j) { return null; }
    var t = j.d.tauxHoraireApplique !== undefined ? j.d.tauxHoraireApplique : B.tauxHoraireA(maPaie, j.d.date);
    if (t === null || isNaN(t)) { return null; }
    return B.calculer(j.d).total / 60 * t;
  }

  function chargerEquipe() {
    return G.lireChamp('journee', 'statut', 'attente_chef').then(function (l) {
      equipeJ = l.filter(function (x) { return (x.details.approbateursChef || []).indexOf(moi) >= 0; }).map(function (x) { return { id: x.id, d: x.details }; });
    }).catch(function () { equipeJ = []; });
  }

  // ---------- Journée : actions
  function jour(date) { return journees[date || dateSel]; }
  function nouvelleJournee(date, voyage, debut, fin) {
    var d = {
      type: 'journee', user: moi, nom: monNom, date: date, debut: debut, fin: fin || null, debutOrigine: debut,
      voyage: voyage || '', pauses: [], segments: [], ajouts: [], repas: [], km: [], vehicule: 'personnel',
      statut: fin ? 'terminee' : 'ouverte', historique: [{ quand: new Date().toISOString(), qui: moi, action: 'creee' }]
    };
    if (estCommissionnaire()) { d.segments = [{ serie: voyage || '', debut: debut, fin: fin || null }]; d.commissionnaire = true; }
    journees[date] = { id: null, d: d };
    return sauver(date);
  }
  function commencer(serie) {
    var hm = B.heureMaintenant();
    nouvelleJournee(aujour(), serie, hm, null);
    if (serie) { var j = jour(aujour()); j.d.checkin = { serie: serie, heure: hm }; sauver(aujour()); }
    rendre();
  }
  function enPause(j) { var p = (j.d.pauses || [])[j.d.pauses.length - 1]; return p && !p.fin; }
  function basculerPause() {
    var j = jour(); var hm = B.heureMaintenant();
    if (enPause(j)) { j.d.pauses[j.d.pauses.length - 1].fin = hm; } else { j.d.pauses.push({ debut: hm, fin: null }); }
    sauver(dateSel); rendre();
  }
  function terminer() {
    if (!confirm('Terminer la journée maintenant ?')) { return; }
    var j = jour(); var hm = B.heureMaintenant();
    if (enPause(j)) { j.d.pauses[j.d.pauses.length - 1].fin = hm; }
    var s = j.d.segments || []; if (s.length && !s[s.length - 1].fin) { s[s.length - 1].fin = hm; }
    j.d.fin = hm; if (j.d.statut === 'ouverte') { j.d.statut = 'terminee'; }
    j.d.historique.push({ quand: new Date().toISOString(), qui: moi, action: 'terminee' });
    sauver(dateSel); rendre();
  }
  function reprendre() {
    var j = jour(); j.d.fin = null; j.d.statut = 'ouverte';
    var s = j.d.segments || []; if (s.length) { s[s.length - 1].fin = null; }
    sauver(dateSel); rendre();
  }
  function changerVoyage(serie) {
    var j = jour(); var hm = B.heureMaintenant();
    if (estCommissionnaire()) {
      var s = j.d.segments; var der = s[s.length - 1];
      if (der && !der.fin) {
        if (der.debut === hm) { der.serie = serie; } else { der.fin = hm; s.push({ serie: serie, debut: hm, fin: null }); }
      } else { s.push({ serie: serie, debut: hm, fin: j.d.fin ? j.d.fin : null }); }
    } else { j.d.voyage = serie; }
    sauver(dateSel);
  }

  // ---------- Rendu
  function svg(d, t) { return '<svg width="' + (t || 24) + '" height="' + (t || 24) + '" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>'; }
  var IC = {
    jour: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>',
    repas: '<path d="M7 3v8 M5 3v5a2 2 0 0 0 4 0V3 M7 11v10 M16 3c-2 1-3 4-3 7h3v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>',
    km: '<path d="M4 17l4-10h8l4 10 M8 13h8 M6 17v3 M18 17v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>',
    semaine: '<path d="M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>',
    equipe: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>',
    swap: '<path d="M4 8h13l-3-3 M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>'
  };
  function rendreOnglets() {
    var items = [['journee', 'Journée', 'jour'], ['repas', 'Repas', 'repas'], ['km', 'Kilomètres', 'km'], ['semaine', 'Semaine', 'semaine']];
    if (droits.chef) { items.push(['equipe', 'Mon équipe', 'equipe']); }
    $('bh-onglets').innerHTML = items.map(function (x) {
      var badge = x[0] === 'equipe' && equipeJ.length ? '<span class="badge">' + equipeJ.length + '</span>' : '';
      return '<button type="button" data-a="onglet" data-v="' + x[0] + '" class="' + (ecran === x[0] ? 'on' : '') + '">' + svg(IC[x[2]], 23) + x[1] + badge + '</button>';
    }).join('');
  }
  function puceStatut(s) {
    var st = B.STATUTS[s] || { nom: s, couleur: 'gris' };
    return '<span class="puce ' + st.couleur + '">' + h(st.nom) + '</span>';
  }
  function rendre() {
    if (!pret) { return; }

  function soumettre() {
