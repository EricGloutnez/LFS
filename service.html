<style>

  #sv .semaine-t { width: 100%; border-collapse: collapse; min-width: 860px; }
  #sv .semaine-t th { background: var(--surf2); border-bottom: 1px solid var(--bord); padding: 10px; text-align: left; font-size: 12px; color: var(--t2); }
  #sv .semaine-t td { border-bottom: 1px solid var(--ligne); border-left: 1px solid var(--ligne); padding: 6px; vertical-align: top; }
  #sv .puce { display: block; font-size: 11px; border-radius: 4px; padding: 3px 6px; margin-bottom: 4px; text-align: left; border: none; width: 100%; cursor: pointer; }
  #sv .lien { color: var(--bleu); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }
  @media (max-width: 1000px) { #sv .corps { flex-direction: column; } #sv .file { width: 100%; } }
</style>
<header class="entete sv-entete"><span class="logo" aria-hidden="true">B</span><span><small>Bonneville</small><b>Service</b></span></header>

<script>
geotab.addin.service = function () {
  'use strict';
  var VERSION = '1.1.0';
  var B = window.Bonneville, G = null, api = null, moi = '';
  var TRAVAUX = ['SAV', 'SAV · porte-patio', 'Porte & fenêtre', 'Échangeur d’air', 'Installation échangeur d’air', 'Correctifs après F5', 'Conseiller terrain', 'Ramassage matériaux', 'Autre'];
  var H0 = 7, H1 = 17, PAS = 15; // grille de 7 h à 17 h, par tranches de 15 min
  var onglet = 'horaire';
  var mode = 'jour', jourSel = null, afficher = 'brouillon', recherche = '', vue = 'horaire';
  var users = [], employes = {}, profils = [], techs = [], blocs = [], appels = [], absences = [], publications = [];
  var carteChoisie = null, message = null, glisse = null, choixPublier = {};
  var IC_OK = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var IC_HORLOGE = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  var IC_POIGNEE = '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></g></svg>';
  var MOIS_LONGS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  function $(id) { return document.getElementById(id); }
  function h(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nomUserGeotab(u) { var x = users.filter(function (y) { return y.user === u; })[0]; return x ? x.nom : u; }
  function nomUser(u) { var t = techniciens.filter(function (y) { return y.d.cle === u; })[0]; return t ? t.d.nom : nomUserGeotab(u); }
  function mn(hhmm) { return B.minutesDe(hhmm); }
  function hFr(m) { var hh = Math.floor(m / 60), mm = m % 60; return hh + ' h' + (mm ? ' ' + ('0' + mm).slice(-2) : ''); }
  function plage(v) { return hFr(mn(v.debut)) + '–' + hFr(mn(v.fin)); }
  function lundiDe(iso) { var d = B.dateDe(iso), j = d.getDay(); d.setDate(d.getDate() - (j === 0 ? 6 : j - 1)); return B.jourIso(d); }
  function ferie(iso) { return B.feriesQuebec(+iso.slice(0, 4))[iso] || null; }
  function dateCourte(iso) { var d = B.dateDe(iso); return B.JOURS_COURTS[d.getDay()].toLowerCase() + '. ' + d.getDate() + ' ' + B.MOIS[d.getMonth()]; }
  function dateLongue(iso) { var d = B.dateDe(iso); return B.JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_LONGS[d.getMonth()] + ' ' + d.getFullYear(); }
  function dire(t, erreur) { message = { t: t, e: !!erreur }; rendre(); }

  // ---------- Données
  function charger() {
    return Promise.all([
      G.lireTypes(['employe', 'profil', 'srvBloc', 'srvAppel', 'srvAbsence', 'srvPublication', 'srvTechnicien', 'srvParametres', 'parametres']),
      G.utilisateurs().catch(function () { return []; })
    ]).then(function (r) {
      employes = {}; profils = []; blocs = []; appels = []; absences = []; publications = []; techniciens = []; parametresSv = null;
      users = r[1];
      r[0].forEach(function (l) {
        var d = l.details;
        if (d.type === 'employe' && d.user) { employes[d.user] = d; }
        else if (d.type === 'profil') { profils.push(d); }
        else if (d.type === 'srvBloc') { blocs.push({ id: l.id, d: d }); }
        else if (d.type === 'srvAppel') { appels.push({ id: l.id, d: d }); }
        else if (d.type === 'srvAbsence') { absences.push({ id: l.id, d: d }); }
        else if (d.type === 'srvPublication') { publications.push({ id: l.id, d: d }); }
        else if (d.type === 'srvTechnicien') { techniciens.push({ id: l.id, d: d }); }
        else if (d.type === 'srvParametres') { parametresSv = { id: l.id, d: d }; }
        else if (d.type === 'parametres' && d.cle) { cleOrs = d.cle; }
      });
      publications.sort(function (a, b) { return String(b.d.le).localeCompare(String(a.d.le)); });
      return creerTechniciensDepart();
    });
  }
  // ===================== Techniciens de Service et coûts =====================
  // Les techniciens sont propres au Service (aucun lien avec les fournisseurs de Finition).
  var techniciens = [], parametresSv = null, creationTechs = false, cleOrs = '';
  var DEPART_TECHS = [
    { nom: 'Philippe Major', statut: 'Employé Bonneville', taux: 43.70, personnes: 1, vehicule: 'compagnie', tauxVehicule: 0, perDiemQC: 0, perDiemON: 0, remorque: 0, tauxSupp: 53.70, notes: 'Per diem, hébergement et matériaux sur carte compagnie · pont remboursé · cellulaire 50 $/mois · temps supplémentaire 53,70 $/h' },
    { nom: 'Martin Vaillancourt', statut: 'À son compte / CCQ', taux: 50.00, personnes: 1, vehicule: 'km', tauxVehicule: 0.74, perDiemQC: 60, perDiemON: 65, remorque: 0, notes: 'Kilométrage 0,68 $ + 0,06 $ de surcharge · hébergement, matériaux et pont remboursés' },
    { nom: 'Olivier & Maxime Gaboriault', statut: 'À leur compte', taux: 67.50, personnes: 2, vehicule: 'jour', tauxVehicule: 225, perDiemQC: 60, perDiemON: 65, remorque: 0, notes: 'Taux et per diem par personne · remorque remboursée si utilisée · hébergement, matériaux et pont remboursés' },
    { nom: 'Patrick Boucher', statut: 'À son compte', taux: 55.00, personnes: 1, vehicule: 'compagnie', tauxVehicule: 0, perDiemQC: 60, perDiemON: 65, remorque: 75, notes: 'Pickup compagnie, essence remboursée · remorque 75 $ si utilisée · hébergement, matériaux et pont remboursés' },
    { nom: 'Sébastien Senay', statut: 'À son compte / CCQ', taux: 75.00, personnes: 1, vehicule: 'km', tauxVehicule: 0.72, perDiemQC: 60, perDiemON: 65, remorque: 0, notes: 'Hébergement, matériaux et pont remboursés' }
  ];
  function paramSv() { return Object.assign({ essenceKm: 0.30, perDiemRegle: 'toujours', perDiemKm: 80 }, (parametresSv && parametresSv.d) || {}); }
  function techDe(cle) { return techniciens.filter(function (t) { return t.d.cle === cle; })[0]; }
  function compteDe(cle) { var t = techDe(cle); if (t) { return t.d.user || ''; } return String(cle).indexOf('@') > 0 ? cle : ''; }
  function listeTechs() {
    techs = techniciens.filter(function (t) { return t.d.actif !== false; }).map(function (t) { return { user: t.d.cle, nom: t.d.nom }; }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
  }
  function creerTechniciensDepart() {
    if (techniciens.length || creationTechs) { listeTechs(); return Promise.resolve(); }
    creationTechs = true;
    var nouveaux = DEPART_TECHS.map(function (x, i) { return Object.assign({ type: 'srvTechnicien', cle: 't-' + Date.now().toString(36) + i, codePostal: '', user: '', actif: true }, x); });
    // Les techniciens qui ont déjà un compte Geotab (profil Technicien) gardent leurs interventions
    Object.keys(employes).filter(function (u) { return !employes[u].masque && B.droitsEffectifs(employes[u], profils).service; }).forEach(function (u) {
      nouveaux.push({ type: 'srvTechnicien', cle: u, nom: nomUserGeotab(u), statut: '', taux: 0, personnes: 1, vehicule: 'compagnie', tauxVehicule: 0, perDiemQC: 0, perDiemON: 0, remorque: 0, notes: '', codePostal: '', user: u, actif: true });
    });
    var c = Promise.resolve();
    nouveaux.forEach(function (d) { c = c.then(function () { return G.ajouter(d).then(function (id) { techniciens.push({ id: id, d: d }); }); }); });
    return c.then(listeTechs);
  }
  // ----- Positions : code postal → coordonnées (OpenRouteService, mémorisé)
  var geoCache = (function () { try { return JSON.parse(localStorage.getItem('sv-geo') || '{}'); } catch (e) { return {}; } })();
  function normCP(cp) { var x = String(cp || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return /^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(x) ? x.slice(0, 3) + ' ' + x.slice(3) : (/^[A-Z]\d[A-Z]$/.test(x) ? x : ''); }
  function provinceDe(cp) { var l = String(cp || '').toUpperCase().charAt(0); return 'KLMNP'.indexOf(l) >= 0 ? 'ON' : ('GHJ'.indexOf(l) >= 0 ? 'QC' : ''); }
  function geocoderCP(cp) {
    var n = normCP(cp); if (!n) { return Promise.reject(new Error('Code postal invalide : ' + cp)); }
    if (geoCache[n]) { return Promise.resolve(geoCache[n]); }
    if (!cleOrs) { return Promise.reject(new Error('Clé OpenRouteService absente (Logistique → Paramètres)')); }
    return fetch('https://api.openrouteservice.org/geocode/search?text=' + encodeURIComponent(n + ', Canada') + '&boundary.country=CA&size=1', { headers: { Authorization: cleOrs } })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (!d.features || !d.features.length) { throw new Error('Code postal introuvable : ' + n); }
        var c = d.features[0].geometry.coordinates; geoCache[n] = { lat: c[1], lon: c[0] };
        try { localStorage.setItem('sv-geo', JSON.stringify(geoCache)); } catch (e) {}
        return geoCache[n];
      });
  }
  // Distances et durées de route de chaque technicien vers la destination (aller simple)
  var trajetsCache = {};
  function trajets(cpDest, listeCles) {
    var cle = normCP(cpDest) + '|' + listeCles.join(',');
    if (trajetsCache[cle]) { return Promise.resolve(trajetsCache[cle]); }
    var tdefs = listeCles.map(techDe);
    return Promise.all([geocoderCP(cpDest)].concat(tdefs.map(function (t) { return t && t.d.codePostal ? geocoderCP(t.d.codePostal).catch(function () { return null; }) : Promise.resolve(null); }))).then(function (pos) {
      var dest = pos[0], origines = pos.slice(1), res = {};
      var valides = origines.map(function (p, i) { return p ? i : -1; }).filter(function (i) { return i >= 0; });
      var estimation = function () { valides.forEach(function (i) { var km = B.distanceM(origines[i], dest) / 1000 * 1.25; res[listeCles[i]] = { km: km, heures: km / 80, estime: true }; }); return res; };
      if (!valides.length) { return res; }
      if (!cleOrs) { return estimation(); }
      var locs = valides.map(function (i) { return [origines[i].lon, origines[i].lat]; }).concat([[dest.lon, dest.lat]]);

    var v = vueBloc(b); if (!v) { return; }
    var d = b.d, a = appelDe(d.aid);
    var corps = '<div class="aide" style="font-size:14px"><span class="mono">Série ' + h(d.serie) + '</span> · ' + h(d.travail) + (d.ville ? ' · ' + h(d.ville) : '') + '</div>'
      + '<div class="rang"><label>Technicien<select id="fb-t1">' + optionsTechs(v.techs[0]) + '</select></label><label>Deuxième technicien<select id="fb-t2">' + optionsTechs(v.techs[1] || '', 'Aucun') + '</select></label></div>'
      + '<div class="rang"><label>Date<input type="date" id="fb-date" value="' + v.date + '"></label><label>Début<input type="time" id="fb-debut" step="900" value="' + v.debut + '"></label><label>Fin<input type="time" id="fb-fin" step="900" value="' + v.fin + '"></label></div>'
      + '<section id="fb-cout" style="background:#F8F9FB;border:1px solid #DDE1E7;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px"></section>'
      + (d.publie ? '<div class="aide">Publié : ' + h(d.publie.techs.map(nomUser).join(' et ')) + ', ' + h(dateCourte(d.publie.date) + ', ' + plage(d.publie)) + '. Toute modification passe en brouillon jusqu’à la publication.</div>' : '<div class="aide">Cette intervention n’a jamais été publiée.</div>');
    fenetre('Intervention à l’horaire', corps, '<button type="button" class="btn refus" data-f="retirer">Retirer de l’horaire</button>' + (a ? '<button type="button" class="btn" data-f="appel">Détails de l’appel</button>' : '') + '<button type="button" class="btn" data-f="fermer">Fermer</button><button type="button" class="btn principal" data-f="ok">Appliquer en brouillon</button>');
    var m = $('sv-modale');
    ['fb-t1', 'fb-date', 'fb-debut', 'fb-fin'].forEach(function (id) { $(id).addEventListener('change', function () { majCout(b); }); });
    majCout(b);
    m.querySelector('[data-f=ok]').onclick = function () {
      var t1 = $('fb-t1').value, t2 = $('fb-t2').value, date = $('fb-date').value, de = $('fb-debut').value, fi = $('fb-fin').value;
      if (!date || !de || !fi || mn(fi) <= mn(de)) { alert('Vérifie la date et les heures.'); return; }
      var nv = { techs: t2 && t2 !== t1 ? [t1, t2] : [t1], date: date, debut: de, fin: fi };
      d.brouillon = memeVersion(nv, d.publie) ? null : nv; d.retrait = false;
      sauverBloc(b).then(function () { fermer(); rendre(); });
    };
    m.querySelector('[data-f=retirer]').onclick = function () { retirerBloc(b); };
    var da = m.querySelector('[data-f=appel]'); if (da) { da.onclick = function () { fermer(); formAppel(a); }; }
  }
  function retirerBloc(b) {
    var d = b.d;
    if (d.publie) { d.retrait = true; d.brouillon = null; sauverBloc(b).then(function () { fermer(); rendre(); }); return; }
    G.retirer(b.id).then(function () {
      blocs = blocs.filter(function (x) { return x !== b; });
      var a = appelDe(d.aid); if (a) { a.d.statut = 'a_planifier'; G.modifier(a.id, a.d); }
      fermer(); rendre();
    });
  }
  function formAbsence(x) {
    var d = x ? x.d : { tech: techs[0] ? techs[0].user : '', date: jourSel, debut: '07:00', fin: '12:00', motif: 'formation' };
    var corps = '<div class="rang"><label>Technicien<select id="fx-tech">' + optionsTechs(d.tech) + '</select></label><label>Date<input type="date" id="fx-date" value="' + d.date + '"></label></div>'
      + '<div class="rang"><label>Début<input type="time" id="fx-debut" step="900" value="' + d.debut + '"></label><label>Fin<input type="time" id="fx-fin" step="900" value="' + d.fin + '"></label><label style="flex:1">Motif<input type="text" id="fx-motif" value="' + h(d.motif) + '"></label></div>'
      + '<div class="aide">L’absence s’affiche tout de suite dans l’horaire (elle ne passe pas par la publication).</div>';
    fenetre(x ? 'Modifier l’absence' : 'Absence d’un technicien', corps, (x ? '<button type="button" class="btn refus" data-f="suppr">Supprimer</button>' : '') + '<button type="button" class="btn" data-f="fermer">Annuler</button><button type="button" class="btn principal" data-f="ok">Enregistrer</button>');
    var m = $('sv-modale');
    m.querySelector('[data-f=ok]').onclick = function () {
      var nd = x ? JSON.parse(JSON.stringify(x.d)) : { type: 'srvAbsence', xid: 'x' + Date.now().toString(36) };
      nd.tech = $('fx-tech').value; nd.date = $('fx-date').value; nd.debut = $('fx-debut').value; nd.fin = $('fx-fin').value; nd.motif = $('fx-motif').value.trim();
      if (!nd.date || mn(nd.fin) <= mn(nd.debut)) { alert('Vérifie la date et les heures.'); return; }
      G.enregistrer(x, nd).then(function (id) { if (x) { x.d = nd; } else { absences.push({ id: id, d: nd }); } fermer(); rendre(); });
    };
    var s = m.querySelector('[data-f=suppr]'); if (s) { s.onclick = function () { G.retirer(x.id).then(function () { absences = absences.filter(function (y) { return y !== x; }); fermer(); rendre(); }); }; }
  }
  function conflit(tech, date, debut, fin, saufBid) {
    var occ = blocs.some(function (b) { var v = vueBloc(b); return b.d.bid !== saufBid && v && v.etat !== 'retire' && v.date === date && v.techs.indexOf(tech) >= 0 && mn(v.debut) < fin && mn(v.fin) > debut; });
    var abs = absences.some(function (x) { return x.d.tech === tech && x.d.date === date && mn(x.d.debut) < fin && mn(x.d.fin) > debut; });
    return abs ? 'une absence' : (occ ? 'une autre intervention' : '');
  }
  function placer(aid, tech, heure) {
    var a = appelDe(aid); if (!a) { return; }
    var debut = heure * 60, fin = Math.min(H1 * 60 + 120, debut + a.d.duree);
    var cf = conflit(tech, jourSel, debut, fin, null);
    if (cf && !confirm(nomUser(tech) + ' a déjà ' + cf + ' à ce moment. Placer quand même ?')) { return; }
    var nd = { type: 'srvBloc', bid: 'b' + Date.now().toString(36), aid: aid, serie: a.d.serie, travail: a.d.travail, ville: a.d.ville, publie: null, brouillon: { techs: [tech], date: jourSel, debut: B.hhmm(debut), fin: B.hhmm(fin) }, retrait: false, confirme: {} };
    var b = { id: null, d: nd };
    blocs.push(b); carteChoisie = null; a.d.statut = 'planifie';
    Promise.all([sauverBloc(b), G.modifier(a.id, a.d)]).then(function () { rendre(); formBloc(b); }).catch(function (e) { dire('Enregistrement impossible : ' + (e && e.message ? e.message : e), true); });
    rendre();
  }
  function deplacer(bid, tech, heure) {
    var b = blocs.filter(function (x) { return x.d.bid === bid; })[0]; if (!b) { return; }
    var v = vueBloc(b); if (!v) { return; }
    var duree = mn(v.fin) - mn(v.debut), debut = heure * 60;
    var techsN = v.techs.slice(); techsN[0] = tech; if (techsN[1] === tech) { techsN.splice(1, 1); }
    var nv = { techs: techsN, date: jourSel, debut: B.hhmm(debut), fin: B.hhmm(debut + duree) };
    b.d.brouillon = memeVersion(nv, b.d.publie) ? null : nv; b.d.retrait = false;
    sauverBloc(b).then(rendre); rendre();
  }
  function annulerChangements() {
    if (!confirm('Annuler tous les changements non publiés ? L’horaire revient à la dernière version publiée.')) { return; }
    var c = Promise.resolve();
    changements().forEach(function (b) {
      if (!b.d.publie) { c = c.then(function () { return G.retirer(b.id); }).then(function () { blocs = blocs.filter(function (x) { return x !== b; }); var a = appelDe(b.d.aid); if (a) { a.d.statut = 'a_planifier'; return G.modifier(a.id, a.d); } }); }
      else { b.d.brouillon = null; b.d.retrait = false; c = c.then(function () { return sauverBloc(b); }); }
    });
    c.then(function () { dire('Changements annulés : l’horaire est revenu à la version publiée.'); });
  }

  // ---------- Branchements
  function brancher() {
    var z = $('sv-contenu');
    Array.prototype.forEach.call(z.querySelectorAll('[data-mode]'), function (b) { b.onclick = function () { mode = b.getAttribute('data-mode'); rendre(); }; });
    var af = $('sv-afficher'); if (af) { af.onchange = function () { afficher = af.value; rendre(); }; }
    var re = $('sv-recherche'); if (re) { re.oninput = function () { recherche = re.value.trim(); var pos = re.selectionStart; rendre(); var r2 = $('sv-recherche'); r2.focus(); try { r2.setSelectionRange(pos, pos); } catch (e) {} }; }
    Array.prototype.forEach.call(z.querySelectorAll('[data-choix]'), function (c) { c.onchange = function () { choixPublier[c.getAttribute('data-choix')] = c.checked; rendre(); }; });
    Array.prototype.forEach.call(z.querySelectorAll('[data-carte]'), function (c) { c.ondragstart = function (e) { glisse = { carte: c.getAttribute('data-carte') }; try { e.dataTransfer.setData('text/plain', 'carte'); } catch (x) {} }; });
    Array.prototype.forEach.call(z.querySelectorAll('.bloc[data-bloc]'), function (c) { c.ondragstart = function (e) { if (afficher !== 'brouillon' || mode !== 'jour') { e.preventDefault(); return; } glisse = { bloc: c.getAttribute('data-bloc') }; try { e.dataTransfer.setData('text/plain', 'bloc'); } catch (x) {} }; });
    Array.prototype.forEach.call(z.querySelectorAll('.cellule.heure'), function (cel) {
      cel.ondragover = function (e) { if (glisse) { e.preventDefault(); cel.classList.add('cible'); } };
      cel.ondragleave = function () { cel.classList.remove('cible'); };
      cel.ondrop = function (e) {
        e.preventDefault(); cel.classList.remove('cible'); if (!glisse) { return; }
        var t = cel.getAttribute('data-tech'), hh = +cel.getAttribute('data-heure');
        if (glisse.carte) { placer(glisse.carte, t, hh); } else if (glisse.bloc) { deplacer(glisse.bloc, t, hh); }
        glisse = null;
      };
    });
  }
  function surClic(e) {
    var t = e.target.closest('button'); if (!t || !$('sv').contains(t) || $('sv-modale')) { return; }
    var a = t.getAttribute('data-a');
    if (t.hasAttribute('data-o')) { onglet = t.getAttribute('data-o'); vue = 'horaire'; message = null; rendre(); return; }
    if (t.hasAttribute('data-suppr-te')) { supprimerTechnicien(t.getAttribute('data-suppr-te')); return; }
    if (a === 'te-ajouter') { ajouterTechnicien(); return; }
    if (a === 'sp-sauver') { sauverParamSv(); return; }
    if (t.hasAttribute('data-carte')) { var aid = t.getAttribute('data-carte'); carteChoisie = carteChoisie === aid ? null : aid; if (carteChoisie) { mode = 'jour'; } rendre(); return; }
    if (t.hasAttribute('data-poser')) { var p = t.getAttribute('data-poser').split('|'); placer(carteChoisie, p[0], +p[1]); return; }
    if (t.hasAttribute('data-bloc')) { var b = blocs.filter(function (x) { return x.d.bid === t.getAttribute('data-bloc'); })[0]; if (b && afficher === 'brouillon') { formBloc(b); } return; }
    if (t.hasAttribute('data-absence')) { var x = absences.filter(function (y) { return y.d.xid === t.getAttribute('data-absence'); })[0]; if (x) { formAbsence(x); } return; }
    if (t.hasAttribute('data-jour-ouvrir')) { jourSel = t.getAttribute('data-jour-ouvrir'); mode = 'jour'; rendre(); return; }
    if (a === 'prec' || a === 'suiv') {
      var s = a === 'prec' ? -1 : 1;
      if (mode === 'jour') { do { jourSel = B.ajouterJours(jourSel, s); } while ([0, 6].indexOf(B.dateDe(jourSel).getDay()) >= 0); }
      else if (mode === 'semaine') { jourSel = B.ajouterJours(lundiDe(jourSel), 7 * s); }
      else { var m = B.dateDe(jourSel); jourSel = B.jourIso(new Date(m.getFullYear(), m.getMonth() + s, 1)); }
      message = null; rendre(); return;
    }
    if (a === 'aujourdhui') { var auj = B.jourIso(); jourSel = [0, 6].indexOf(B.dateDe(auj).getDay()) >= 0 ? B.ajouterJours(lundiDe(auj), 7) : auj; rendre(); return; }
    if (a === 'nouvel-appel') { formAppel(null); return; }
    if (a === 'absence') { formAbsence(null); return; }
    if (a === 'annuler-choix') { carteChoisie = null; rendre(); return; }
    if (a === 'annuler') { annulerChangements(); return; }
    if (a === 'reviser') { vue = 'publier'; message = null; rendre(); window.scrollTo(0, 0); return; }
    if (a === 'retour') { vue = 'horaire'; rendre(); return; }
    if (a === 'publier') { publier(); return; }
  }

  var branche = false;
  function demarrer(a) {
    api = a; B = window.Bonneville; G = B.creerApi(a);
    if (!jourSel) { var auj = B.jourIso(); jourSel = [0, 6].indexOf(B.dateDe(auj).getDay()) >= 0 ? B.ajouterJours(lundiDe(auj), 7) : auj; }
    if (!branche) { document.addEventListener('click', surClic); branche = true; }
    G.session().then(function (s) { moi = s.userName || ''; return charger(); }).then(rendre)
      .catch(function (e) { $('sv-contenu').innerHTML = '<div class="page"><div class="message erreur">Lecture impossible : ' + h(e && e.message ? e.message : e) + '</div></div>'; });
  }
  window.BonnevilleModule = { aller: function () { vue = 'horaire'; rendre(); } };
  return {
    initialize: function (a, s, callback) { try { demarrer(a); } catch (e) { console.warn(e); } callback(); },
    focus: function (a) { try { demarrer(a); } catch (e) { console.warn(e); } },
    blur: function () {}
  };
};
geotab.addin.Service = geotab.addin.service;
geotab.addin.bonnevilleService = geotab.addin.service;
</script>
